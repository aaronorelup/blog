<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>00.01 The hidden curriculum · The Missing Map</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Karla:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../../engine/player.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="../../"><span class="brand">The Missing Map</span> · all lessons</a>
    <button class="pill" id="mode" type="button" aria-label="Switch day or night">Day / night</button>
  </header>

  <p class="eyebrow" id="eyebrow">Lesson 00.01</p>
  <h1 id="title">The hidden curriculum</h1>
  <p class="lede" id="summary"></p>

  <div class="stage" id="stage">
    <canvas id="stage-canvas" width="1920" height="1080" aria-label="Animated lesson"></canvas>
    <div class="cc" id="cc" aria-live="off"></div>
    <button class="bigplay" id="bigplay" type="button">Play lesson</button>
  </div>
  <div class="controls">
    <button class="pill" id="play" type="button">Play</button>
    <span class="time" id="time">0:00 / 0:00</span>
    <div class="scrub"><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Seek"><div class="ticks" id="ticks"></div></div>
    <button class="pill" id="speed" type="button" aria-label="Playback speed">1×</button>
    <button class="pill" id="ccbtn" type="button" aria-pressed="true">CC</button>
    <button class="pill" id="fs" type="button">Full screen</button>
    <a class="pill dl" id="dl" href="lesson.mp4" download hidden>MP4</a>
  </div>

  <div class="cols">
    <section id="keepbox"><h2>What to keep</h2><ul class="keep" id="keep"></ul></section>
    <section><h2>Chapters</h2><ul class="chapters" id="chapters"></ul></section>
  </div>
  <section class="transcript" id="txbox">
    <details open><summary>Transcript: click any word to jump there</summary><div class="tx" id="tx"></div></details>
  </section>
  <footer class="foot">
    <span></span>
    <span id="filed">Filed 2026-10-01</span>
    <span></span>
  </footer>
</div>
<script src="../../engine/kit.js"></script>
<script src="../../engine/map.js"></script>
<script src="../../engine/runtime.js"></script>
<script src="../../engine/music.js"></script>
<script src="cues.js" onerror="void 0"></script>
<script src="scenes.js" onerror="void 0"></script>
<script src="lesson.js"></script>
<script src="../../engine/player.js"></script>
</body>
</html>
