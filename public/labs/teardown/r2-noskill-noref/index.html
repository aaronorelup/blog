<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOLE-1 · drum digger simulator</title><style>html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 52% 42%,#f8f7f3 0%,#ecebe6 55%,#dedbd3 100%);font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;color:#2e2b27;-webkit-font-smoothing:antialiased}
#gl{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;touch-action:none}
#stage{position:fixed;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;pointer-events:none}
#stage .panel,#stage button,#stage input{pointer-events:auto}
#ov{position:absolute;left:0;top:0;width:1600px;height:900px;pointer-events:none}
.hidden-panels .panel{opacity:0;pointer-events:none!important}
.panel{position:absolute;transition:opacity .25s}
.k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#7b766d;font-weight:600}
#title{left:28px;top:18px;width:300px}
#title h1{margin:0;font-size:46px;line-height:48px;font-weight:800;letter-spacing:-.01em}
#title .sub{font-size:12.5px;color:#6f6a62;margin-top:2px;white-space:nowrap}
#depth{left:28px;top:100px;width:300px}
#depth .num{font-size:84px;line-height:84px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
#depth .num small{font-size:30px;font-weight:700;margin-left:4px;letter-spacing:0}
#depth .tgt{font-size:13px;color:#6f6a62;margin-top:2px}
#depth .bar{height:5px;background:#d9d5cc;border-radius:3px;margin-top:8px;overflow:hidden}
#depth .bar i{display:block;height:100%;background:#2e2b27;width:0}
#depth .pr{font-size:12px;color:#4a463f;margin-top:7px;font-variant-numeric:tabular-nums}
#status{left:28px;top:290px;width:300px;height:100px;font-size:12px;line-height:16px;font-variant-numeric:tabular-nums}
#status .ph{font-weight:700;font-size:13px}
#status .tl{color:#f26a1b;font-weight:700}
#subs{left:28px;top:404px;width:300px}
#subs table{border-collapse:collapse;margin-top:4px}
#subs td{padding:1px 0;font-size:12.5px;height:23px}
#subs td.n{width:132px;white-space:nowrap}
#subs td.n i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#cfcac0;margin-right:7px;vertical-align:1px}
#subs tr.acc td.n i{background:#f26a1b}
#subs tr.acc td.n{font-weight:700}
button{font:600 11.5px "Helvetica Neue",Helvetica,Arial,sans-serif;color:#2e2b27;background:#fbfaf7;border:1px solid #bdb7ab;border-radius:5px;padding:3px 8px;margin:0 3px 0 0;cursor:pointer}
button:hover{border-color:#2e2b27}
button.on{background:#2e2b27;color:#fbfaf7;border-color:#2e2b27}
button.press{box-shadow:0 0 0 3px rgba(242,106,27,.45)}
#dir{left:28px;top:630px;width:300px}
#dir .row{margin-top:5px}
#revb{left:28px;top:690px;width:292px;border:1.5px solid #2e2b27;border-radius:6px;padding:9px 11px;background:rgba(251,250,247,.86);font-size:11.5px;line-height:15.5px}
#revb .stamp{display:inline-block;border:2px solid #b8321a;color:#b8321a;font-weight:800;padding:0 6px;transform:rotate(-4deg);letter-spacing:.08em;margin-left:6px}
#revb .gn{margin-top:5px}
#revb .sig{height:4px;background:#d9d5cc;border-radius:2px;margin:6px 0 2px;position:relative}
#revb .sig i{position:absolute;left:0;top:-3px;width:10px;height:10px;border-radius:50%;background:#f26a1b;margin-left:-5px}
#revb .clk{font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
#revb .clk.sm{font-size:10.5px;color:#6f6a62}
#check .rate{font-size:12px;line-height:17px;margin-top:6px;color:#4a463f}
#right{left:1186px;top:16px;width:396px}
#right canvas{display:block;background:rgba(251,250,247,.97);border:1px solid #d3cec4;border-radius:6px;margin-bottom:10px}
#cams{left:356px;top:842px;width:820px;display:flex;align-items:center;gap:2px}
#cams .k{margin-right:8px}
#live{left:1186px;top:842px;width:396px;font-size:11px;color:#6f6a62;display:flex;align-items:center;gap:4px}
#live input[type=range]{width:120px}
#nc{position:absolute;left:14px;top:880px;font-size:11px;color:#9a968e;letter-spacing:.02em}
.co{position:absolute;font-size:11.5px;line-height:14px;background:rgba(251,250,247,.92);border:1px solid #2e2b27;border-radius:4px;padding:3px 7px;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none}
.co b{font-weight:700}
#check{position:absolute;left:400px;top:22px;width:700px;border:1.5px solid #2e2b27;border-radius:6px;background:rgba(251,250,247,.93);padding:10px 14px;font-size:14px;line-height:21px;font-variant-numeric:tabular-nums;opacity:0}
#check b{font-size:15px}
#cursor{position:absolute;left:0;top:0;width:22px;height:30px;pointer-events:none;z-index:9}
#ripple{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid #f26a1b;opacity:0;pointer-events:none;z-index:8}
#tourtag{left:356px;top:16px;font-size:11px;color:#7b766d}
#veil{position:absolute;left:0;top:0;width:350px;height:900px;background:linear-gradient(to right,rgba(246,245,241,.9) 0,rgba(246,245,241,.82) 300px,rgba(246,245,241,0) 350px);pointer-events:none}
