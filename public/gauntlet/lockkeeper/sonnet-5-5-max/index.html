<!doctype html>
<html lang="en" data-mode="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lockkeeper's Ledger</title>
<style>
/* The Lockkeeper's Ledger - styles. Brand: the Tea House (cream paper by day, indigo by night, gold headings, terracotta links). */
:root {
  color-scheme: dark;
  --pc-page:#101220; --pc-bg:rgba(21,23,38,.96); --pc-tile:#201F2C; --pc-hover:#222130; --pc-code:#222130; --pc-scrim:rgba(8,9,18,.44);
  --pc-head:#F0C06A; --pc-strong:#F2E7D5; --pc-body:#C9BCA9; --pc-soft:#9C917F; --pc-quiet:#8E8375;
  --pc-line:#302E3E; --pc-line2:#4A445A; --pc-accent:#E2795C; --pc-gold:#C9A227;
  --pc-shadow:0 34px 100px rgba(0,0,0,.6);
  --th-blossom:#F7C9D4; --th-blossom-deep:#F0A6B8; --th-petal:#F7B7C8; --th-ink:#3A3A42;
  /* scene */
  --sky-day-top:#3B4472; --sky-day-bot:#B98F7A; --sky-night-top:#0B0C18; --sky-night-bot:#181B33;
  --hill-far:#1B1D33; --hill-near:#262438; --ground:#2E2A3C; --ground-edge:#4A445A;
  --water:#3C6291; --water-hi:#8DB4E6; --water-deep:#2C4B74; --chamber-wall:#B9AE9B;
  --boat:#F2E7D5; --boat-ink:#2A2620; --boat-late:#E2795C;
  /* causes of delay: fixed order keeper, pool low, plan holds, locks closed, lock busy (validated on both surfaces) */
  --c-keeper:#E2795C; --c-pool:#4FBFA8; --c-holds:#DDB552; --c-closed:#6A6F92; --c-busy:#86B0F5;
  --op-fill:#B9AE9B; --op-ink:#1A1826;
  --font-head:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic UI","Segoe UI Rounded","Segoe UI",system-ui,sans-serif;
  --font-ui:Karla,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-read:Georgia,"Times New Roman",serif;
  --font-mono:ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
:root[data-mode='day'] {
  color-scheme: light;
  --pc-page:#FBF3E8; --pc-bg:rgba(251,243,232,.97); --pc-tile:#F3E7D2; --pc-hover:#F4E9D8; --pc-code:#F0E5D2; --pc-scrim:rgba(251,243,232,.34);
  --pc-head:#BE7A10; --pc-strong:#3A3A42; --pc-body:#4A4A50; --pc-soft:#6B5E52; --pc-quiet:#7A6C5D;
  --pc-line:#E2D5C0; --pc-line2:#D0BEA3; --pc-accent:#A85E2B; --pc-gold:#B08A2E;
  --pc-shadow:0 30px 90px rgba(58,58,66,.22);
  --sky-day-top:#F6E9D2; --sky-day-bot:#FBF3E8; --sky-night-top:#8F94B8; --sky-night-bot:#B9B9D0;
  --hill-far:#E9DCC4; --hill-near:#DFCFB2; --ground:#D6C3A2; --ground-edge:#B9A27C;
  --water:#7FA6CE; --water-hi:#EAF3FB; --water-deep:#5F88B5; --chamber-wall:#5A4E40;
  --boat:#3A3A42; --boat-ink:#FBF3E8; --boat-late:#A85E2B;
  --c-keeper:#B5522B; --c-pool:#1F8F7A; --c-holds:#9A7708; --c-closed:#4C4E70; --c-busy:#3F72C8;
  --op-fill:#5A5A62; --op-ink:#FBF3E8;
}

* { box-sizing: border-box; }
html { background: var(--pc-page); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--pc-page); color: var(--pc-body);
  font: 400 14px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased;
}
::selection { background: var(--pc-line2); color: var(--pc-strong); }
:focus-visible { outline: 3px solid var(--pc-head); outline-offset: 3px; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--pc-accent); }
h1, h2, h3, h4 { font-family: var(--font-head); color: var(--pc-head); letter-spacing: -.015em; margin: 0; font-weight: 700; }
.eyebrow { font: 600 10.5px/1 var(--font-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--pc-gold); }
.mono { font-family: var(--font-mono); font-size: .92em; }
.read { font-family: var(--font-read); font-size: 15.5px; line-height: 1.6; color: var(--pc-body); max-width: 66ch; }
.muted { color: var(--pc-soft); }
strong, b { color: var(--pc-strong); font-weight: 600; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 1100px; margin: 0 auto; padding: 18px 20px 48px; }

/* ---------------------------------------------------------------- header */
.top { display: flex; align-items: flex-start; gap: 18px; justify-content: space-between; flex-wrap: wrap; }
.top h1 { font-size: 26px; line-height: 1.15; }
.top .lede { margin: 6px 0 0; max-width: 64ch; font-family: var(--font-read); font-size: 15.5px; line-height: 1.55; color: var(--pc-body); }
.top .lede b { color: var(--pc-strong); }
.top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill {
  border: 1px solid var(--pc-line2); background: transparent; color: var(--pc-strong); border-radius: 999px; padding: 6px 14px;
  cursor: pointer; font: 600 12.5px/1.2 var(--font-ui); letter-spacing: .01em; transition: background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease);
}
.pill:hover { background: var(--pc-hover); border-color: var(--pc-gold); }
.pill[aria-pressed='true'], .pill.on { background: var(--pc-hover); border-color: var(--pc-head); color: var(--pc-head); }
.pill.primary { background: var(--pc-head); color: var(--pc-page); border-color: var(--pc-head); }
.pill.primary:hover { filter: brightness(1.06); }
.pill[disabled] { opacity: .45; cursor: default; }
.pill.small { padding: 4px 10px; font-size: 12px; }
.square { border-radius: 0; }

[hidden] { display: none !important; }
.banner { margin: 12px 0 0; padding: 9px 14px; border: 1px solid var(--pc-line2); border-left: 3px solid var(--pc-accent); font-size: 13px; color: var(--pc-strong); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner .pill { margin-left: auto; }

/* ---------------------------------------------------------------- score tiles */
.score { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; margin: 16px 0 14px; border-top: 1px solid var(--pc-line); border-bottom: 1px solid var(--pc-line); }
.tile { padding: 10px 14px 10px 0; border-right: 1px solid var(--pc-line); padding-left: 14px; min-width: 0; }
.tile:first-child { padding-left: 0; }
.tile:last-child { border-right: none; }
.tile .k { font: 600 10.5px/1.2 var(--font-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--pc-quiet); }
.tile .v { font: 600 26px/1.15 var(--font-ui); color: var(--pc-strong); font-variant-numeric: tabular-nums; margin-top: 3px; }
.tile .v small { font-size: 13px; color: var(--pc-soft); font-weight: 400; margin-left: 4px; }
.tile .d { font-size: 12px; color: var(--pc-soft); margin-top: 1px; min-height: 16px; }
.tile .d.worse { color: var(--pc-accent); }
.tile .d.better { color: var(--pc-head); }

/* ---------------------------------------------------------------- canal card */
.canalcard { border: 1px solid var(--pc-line); border-radius: 0; box-shadow: var(--pc-shadow); background: var(--pc-tile); overflow: hidden; }
.canalscroll { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
.canalscroll svg { display: block; width: 100%; min-width: 940px; height: auto; }
.canalhint { display: none; font-size: 11.5px; color: var(--pc-quiet); padding: 4px 12px; }
.legendrow { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 8px 14px; border-top: 1px solid var(--pc-line); font-size: 12px; color: var(--pc-soft); align-items: center; }
.legendrow .lab { font: 600 10.5px/1 var(--font-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--pc-quiet); margin-right: 2px; }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.sw.dot { border-radius: 50%; }
body.patterns .sw[data-cause='closed'], body.patterns .sw[data-cause='holds'] { background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.35) 0 2px, transparent 2px 5px); }
.transport { display: flex; align-items: center; gap: 10px; padding: 8px 14px 12px; border-top: 1px solid var(--pc-line); flex-wrap: wrap; background: var(--pc-tile); }
.transport .clock { font: 600 15px/1 var(--font-ui); color: var(--pc-strong); min-width: 118px; font-variant-numeric: tabular-nums; }
.transport .phase { font-size: 12px; color: var(--pc-soft); min-width: 150px; }
.scrub { position: relative; flex: 1 1 320px; min-width: 220px; height: 34px; }
.scrub svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.scrub input[type=range] { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
.scrub input[type=range]::-webkit-slider-runnable-track { height: 34px; background: transparent; }
.scrub input[type=range]::-moz-range-track { height: 34px; background: transparent; }
.scrub input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 4px; height: 34px; background: var(--pc-head); border-radius: 2px; box-shadow: 0 0 0 0 transparent; transition: box-shadow .18s var(--ease); }
.scrub input[type=range]::-moz-range-thumb { width: 4px; height: 34px; background: var(--pc-head); border: 0; border-radius: 2px; }
.scrub input[type=range]:hover::-webkit-slider-thumb { box-shadow: 0 0 14px 4px var(--th-blossom-deep); }
.speedgroup { display: flex; gap: 4px; align-items: center; }
.speedgroup .lab { font-size: 11px; color: var(--pc-quiet); margin-right: 2px; }

.mini { position: fixed; top: 0; left: 0; right: 0; z-index: 40; background: var(--pc-bg); border-bottom: 1px solid var(--pc-line2); padding: 7px 14px; display: none; backdrop-filter: blur(8px); box-shadow: 0 12px 40px rgba(0,0,0,.18); }
.mini.on { display: block; }
.miniin { max-width: 1060px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
/* ---------------------------------------------------------------- tabs */
.tabs { display: flex; gap: 6px; margin: 18px 0 0; border-bottom: 1px solid var(--pc-line); flex-wrap: wrap; align-items: flex-end; }
.tab { border: 0; background: transparent; padding: 9px 14px 10px; font: 600 13.5px/1 var(--font-ui); color: var(--pc-soft); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .18s var(--ease), border-color .18s var(--ease); }
.tab:hover { color: var(--pc-strong); }
.tab[aria-selected='true'] { color: var(--pc-head); border-bottom-color: var(--pc-head); }
.panel { padding: 16px 0 0; min-height: 320px; }
.panel[hidden] { display: none; }
.panelhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.panelhead h2 { font-size: 18px; }
.seg { display: inline-flex; border: 1px solid var(--pc-line2); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 13px; font: 600 12.5px/1.2 var(--font-ui); color: var(--pc-soft); cursor: pointer; }
.seg button[aria-pressed='true'] { background: var(--pc-hover); color: var(--pc-head); }
.seg button + button { border-left: 1px solid var(--pc-line2); }

/* ---------------------------------------------------------------- gantt */
.ganttbox { border: 1px solid var(--pc-line); background: var(--pc-tile); overflow-x: auto; position: relative; }
.ganttbox svg { display: block; }
.ganttbox text { font-family: var(--font-ui); }
.gantt-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--pc-soft); margin: 8px 0 0; align-items: center; }
.gl { display: inline-flex; align-items: center; gap: 6px; }
.gl i { display: inline-block; width: 26px; height: 11px; border-radius: 3px; }
.gl i.up { background: var(--op-fill); }
.gl i.down { border: 1.5px solid var(--op-fill); background: transparent; }
.gl i.empty { border: 1px solid var(--op-fill); background: repeating-linear-gradient(45deg, var(--op-fill) 0 1.5px, transparent 1.5px 5px); opacity: .8; }
table.data { border-collapse: collapse; width: 100%; font-size: 13px; }
table.data th { text-align: left; font: 600 10.5px/1.2 var(--font-ui); letter-spacing: .09em; text-transform: uppercase; color: var(--pc-quiet); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--pc-line2); position: sticky; top: 0; background: var(--pc-page); cursor: default; white-space: nowrap; }
table.data th.sortable { cursor: pointer; }
table.data th.sortable:hover { color: var(--pc-strong); }
table.data td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--pc-line); vertical-align: top; font-variant-numeric: tabular-nums; }
table.data tr.row { cursor: pointer; }
table.data tr.row:hover td { background: var(--pc-hover); }
table.data tr.sel td { background: var(--pc-hover); }
table.data td.num, table.data th.num { text-align: right; padding-right: 14px; }
.scrolly { max-height: 380px; overflow: auto; border-top: 1px solid var(--pc-line); }

/* ---------------------------------------------------------------- delays */
.overview { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; margin-bottom: 14px; }
.ovcard { border-top: 1px solid var(--pc-line); padding-top: 10px; }
.ovcard h3 { font-size: 15px; margin-bottom: 4px; }
.bars .bar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 90px; align-items: center; gap: 10px; margin: 6px 0; font-size: 13px; }
.bars .bar .nm { color: var(--pc-body); text-align: right; }
.bars .bar .tr { height: 12px; position: relative; }
.bars .bar .fl { height: 12px; border-radius: 0 4px 4px 0; }
.bars .bar .vl { color: var(--pc-strong); font-variant-numeric: tabular-nums; }
.stack { display: flex; height: 10px; gap: 2px; min-width: 90px; }
.stack span { display: block; height: 10px; border-radius: 2px; min-width: 2px; }
.cause-keeper { background: var(--c-keeper); } .cause-water { background: var(--c-pool); } .cause-partner, .cause-held { background: var(--c-holds); }
.cause-night, .cause-closure { background: var(--c-closed); } .cause-lock { background: var(--c-busy); }
body.patterns .cause-night, body.patterns .cause-closure { background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.4) 0 2px, transparent 2px 5px); }
body.patterns .cause-partner, body.patterns .cause-held { background-image: radial-gradient(rgba(0,0,0,.45) 1.2px, transparent 1.4px); background-size: 5px 5px; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 8px; }
.filters input[type=search] { border: 1px solid var(--pc-line2); background: transparent; border-radius: 999px; padding: 5px 14px; min-width: 190px; color: var(--pc-strong); }
.late { color: var(--pc-accent); font-weight: 600; }
.pri { font-size: 11px; color: var(--pc-quiet); letter-spacing: .1em; }
.story { list-style: none; margin: 8px 0 0; padding: 0; }
.story li { font-family: var(--font-read); font-size: 15px; line-height: 1.5; padding: 7px 0 7px 14px; border-left: 3px solid var(--pc-line2); margin: 0 0 6px; color: var(--pc-body); }
.story li .when { font: 600 11px/1 var(--font-ui); letter-spacing: .06em; color: var(--pc-quiet); display: block; margin-bottom: 2px; }
.story li[data-cause='keeper'] { border-left-color: var(--c-keeper); } .story li[data-cause='water'] { border-left-color: var(--c-pool); }
.story li[data-cause='partner'], .story li[data-cause='held'] { border-left-color: var(--c-holds); } .story li[data-cause='night'], .story li[data-cause='closure'] { border-left-color: var(--c-closed); }
.story li[data-cause='lock'] { border-left-color: var(--c-busy); }
details.bstory { border-top: 1px solid var(--pc-line); padding: 8px 0 6px; }
details.bstory:last-of-type { border-bottom: 1px solid var(--pc-line); }
details.bstory summary { cursor: pointer; list-style: none; display: flex; gap: 6px 14px; align-items: baseline; flex-wrap: wrap; font-family: var(--font-ui); font-size: 14px; color: var(--pc-strong); }
details.bstory summary::-webkit-details-marker { display: none; }
details.bstory summary::before { content: '▸'; color: var(--pc-soft); width: 12px; flex: none; }
details.bstory[open] summary::before { content: '▾'; }
details.bstory summary span { font-size: 12.5px; }
details.bstory[open] { padding-bottom: 12px; }
.detail { border: 1px solid var(--pc-line); border-radius: 24px; padding: 14px 18px 12px; margin: 10px 0 14px; background: var(--pc-tile); }
.detail h3 { font-size: 17px; }
.detail .meta { font-size: 12.5px; color: var(--pc-soft); margin: 2px 0 6px; }

/* ---------------------------------------------------------------- disruption */
.formrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
.formrow label { font-size: 13px; color: var(--pc-body); display: inline-flex; gap: 6px; align-items: center; }
.formrow select, .formrow input[type=number] { border: 1px solid var(--pc-line2); background: var(--pc-page); color: var(--pc-strong); border-radius: 999px; padding: 5px 12px; }
.formrow input[type=number] { width: 84px; }
.card { border: 1px solid var(--pc-line); border-radius: 24px; padding: 14px 18px; background: transparent; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
.chip { border: 1px solid var(--pc-line2); border-radius: 999px; padding: 3px 4px 3px 12px; font-size: 12.5px; color: var(--pc-strong); display: inline-flex; gap: 8px; align-items: center; }
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--pc-soft); padding: 0 8px; border-radius: 999px; font-size: 15px; line-height: 1; }
.chip button:hover { color: var(--pc-accent); }
.progress { height: 6px; background: var(--pc-line); border-radius: 3px; overflow: hidden; margin: 10px 0; }
.progress i { display: block; height: 100%; width: 0; background: var(--pc-head); transition: width .3s linear; }
.diff .up { color: var(--pc-accent); } .diff .dn { color: var(--pc-head); }
.diff li { margin: 6px 0; }
.note { font-size: 12.5px; color: var(--pc-soft); }

/* ---------------------------------------------------------------- guide */
.guide { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 26px; align-items: start; }
.guide h3 { font-size: 16px; margin: 14px 0 4px; }
.guide h3:first-child { margin-top: 0; }
.guide dl { margin: 0; }
.guide dt { color: var(--pc-strong); font-weight: 600; margin-top: 8px; }
.guide dd { margin: 0; color: var(--pc-body); font-family: var(--font-read); font-size: 14.5px; line-height: 1.5; }
.guide svg { width: 100%; height: auto; }

/* ---------------------------------------------------------------- tooltip */
#tip { position: fixed; z-index: 50; pointer-events: none; max-width: 340px; padding: 9px 12px; border-radius: 12px; background: var(--pc-bg); border: 1px solid var(--pc-line2); box-shadow: 0 12px 40px rgba(0,0,0,.35); color: var(--pc-body); font-size: 12.5px; line-height: 1.45; opacity: 0; transition: opacity .12s var(--ease); }
#tip.on { opacity: 1; }
#tip b { color: var(--pc-strong); }
#tip .h { font: 700 13px/1.2 var(--font-head); color: var(--pc-head); margin-bottom: 3px; display: block; }
#tip .why { font-family: var(--font-read); font-size: 13px; }

/* ---------------------------------------------------------------- svg text helpers */
.svgtxt { font-family: var(--font-ui); }

/* ---------------------------------------------------------------- narrow screens */
@media (max-width: 820px) {
  .wrap { padding: 14px 14px 40px; }
  .top h1 { font-size: 22px; }
  .score { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile { border-right: 0; border-bottom: 1px solid var(--pc-line); padding-left: 0; }
  .tile:last-child { grid-column: span 2; border-bottom: 0; }
  .canalhint { display: block; }
  .overview, .guide, .grid2 { grid-template-columns: 1fr; }
  .bars .bar { grid-template-columns: 110px minmax(0, 1fr) 70px; }
  .transport .phase { min-width: 0; flex: 1 1 100%; order: 5; }
  .scrub { flex-basis: 100%; order: 4; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media (forced-colors: active) { .sw, .stack span { forced-color-adjust: none; } }

</style>
</head>
<body>

      feeder: canal.feeder_per_minute || 0,
      windows: (canal.windows || []).map(w => [w[0], w[1]]),
      enter: canal.enter_minutes, enterBarge: canal.enter_minutes_with_barge, exit: canal.exit_minutes,
      slotsCap: canal.chamber_slots,
      keeperSpeed: canal.keeper_speed,
      closures: canal.closures || [],
      keepers: canal.keepers || [],
      boats: canal.boats || [],
      pos: new Array(nL + 2).fill(0),       // towpath position of lock l (1..nL)
      boatById: new Map(), keeperById: new Map(),
    };
    for (let l = 2; l <= nL; l++) M.pos[l] = M.pos[l - 1] + pools[l - 1].length;
    M.boats.forEach(b => M.boatById.set(b.id, b));
    M.keepers.forEach(k => M.keeperById.set(k.id, k));
    M.horizon = M.windows.reduce((m, w) => Math.max(m, w[1]), 0);
    return M;
  }

  const slotsOf = b => (b.type === 'barge' ? 2 : 1);

  // Locks a boat must pass, in order, with the direction of each passage.
  function routeOf(b) {
    const r = [];
    if (b.to > b.from) for (let l = b.from + 1; l <= b.to; l++) r.push({ lock: l, dir: 'up' });
    else for (let l = b.from; l > b.to; l--) r.push({ lock: l, dir: 'down' });
    return r;
  }

  // minutes for a boat to cross the pool it has just come out into after passing `lock`
  function crossMinutes(M, b, lock, dir) {
    const pool = dir === 'up' ? lock : lock - 1;
    return Math.ceil(M.pools[pool].length / b.speed);
  }

  function walkMinutes(M, a, b) {
    return Math.ceil(Math.abs(M.pos[a] - M.pos[b]) / M.keeperSpeed);
  }

  function opDuration(M, lock, dir, boatIds) {
    const L = M.locks[lock - 1];
    let d = dir === 'up' ? L.fill : L.empty;
    if (boatIds.length > 0) {
      const barge = boatIds.some(id => { const b = M.boatById.get(id); return b && b.type === 'barge'; });
      d += (barge ? M.enterBarge : M.enter) + M.exit;
    }
    return d;
  }

  // ------------------------------------------------------------------ validation
  // Full check. Returns metrics, errors and (always) a best-effort trace for the UI.
  function validate(canal, schedule, options) {
    options = options || {};
    let M;
    try { M = prepare(canal); } catch (e) {
      return { valid: false, errors: ['canal: ' + e.message], weighted_lateness: null, water_drawn: null,
        late_boats: null, operations: 0, empty_turns: 0 };
    }
    const errors = [];
    const err = m => { if (errors.length < 400) errors.push(m); };
    const raw = schedule && Array.isArray(schedule.operations) ? schedule.operations : null;
    if (!raw) {
      return { valid: false, errors: ['schedule.operations must be an array'], weighted_lateness: null,
        water_drawn: null, late_boats: null, operations: 0, empty_turns: 0 };
    }

    // ---- 1. parse operations
    const ops = [];
    raw.forEach((o, idx) => {
      const tag = 'op#' + idx;
      if (!o || typeof o !== 'object') { err(tag + ': not an object'); return; }
      let ok = true;
      if (!isInt(o.lock) || o.lock < 1 || o.lock > M.nL) { err(`${tag}: lock ${JSON.stringify(o.lock)} is not an integer 1..${M.nL}`); ok = false; }
      if (!isInt(o.start)) { err(`${tag}: start ${JSON.stringify(o.start)} is not an integer`); ok = false; }
      if (o.dir !== 'up' && o.dir !== 'down') { err(`${tag}: dir must be "up" or "down"`); ok = false; }
      if (!Array.isArray(o.boats) || !o.boats.every(isInt)) { err(`${tag}: boats must be a list of integer ids`); ok = false; }
      if (!isInt(o.keeper) || !M.keeperById.has(o.keeper)) { err(`${tag}: unknown keeper ${JSON.stringify(o.keeper)}`); ok = false; }
      if (!ok) return;
      const seen = new Set();
      for (const id of o.boats) {
        if (!M.boatById.has(id)) { err(`${tag}: unknown boat ${id}`); ok = false; }
        else if (seen.has(id)) { err(`${tag}: boat ${id} listed twice`); ok = false; }
        seen.add(id);
      }
      if (!ok) return;
      const dur = opDuration(M, o.lock, o.dir, o.boats);
      ops.push({ idx, lock: o.lock, dir: o.dir, start: o.start, boats: o.boats.slice(), keeper: o.keeper,
        dur, end: o.start + dur, empty: o.boats.length === 0, label: `op#${idx} (lock ${o.lock} ${o.dir} @${o.start})` });
    });

    // ---- 2. per-operation rules: capacity, operating hours, closures
    for (const op of ops) {
      const used = op.boats.reduce((s, id) => s + slotsOf(M.boatById.get(id)), 0);
      if (used > M.slotsCap) err(`${op.label}: boats need ${used} slots but the chamber holds ${M.slotsCap}`);
      if (!M.windows.some(w => w[0] <= op.start && op.end <= w[1]))
        err(`${op.label}: [${op.start}, ${op.end}) is not inside an operating window`);
      for (const c of M.closures)
        if (c.lock === op.lock && op.start < c.to && c.from < op.end)
          err(`${op.label}: overlaps closure of lock ${c.lock} [${c.from}, ${c.to})`);
    }

    // ---- 3. per-lock sequence: no overlap, chamber state alternates from its initial state
    const byLock = Array.from({ length: M.nL + 1 }, () => []);
    for (const op of ops) byLock[op.lock].push(op);
    for (let l = 1; l <= M.nL; l++) {
      const list = byLock[l].sort((a, b) => a.start - b.start || a.idx - b.idx);
      let state = M.locks[l - 1].state;             // 'low' or 'high'
      let prev = null;
      for (const op of list) {
        if (prev && op.start < prev.end) err(`${op.label}: starts before ${prev.label} has finished on the same lock (ends ${prev.end})`);
        if (op.dir === 'up' && state !== 'low') err(`${op.label}: up needs the chamber low but it is high`);
        if (op.dir === 'down' && state !== 'high') err(`${op.label}: down needs the chamber high but it is low`);
        state = op.dir === 'up' ? 'high' : 'low';
        prev = op;
      }
    }

    // ---- 4. keepers: one operation at a time, walking time between locks
    const byKeeper = new Map(M.keepers.map(k => [k.id, []]));
    for (const op of ops) byKeeper.get(op.keeper).push(op);
    for (const k of M.keepers) {
      const list = byKeeper.get(k.id).sort((a, b) => a.start - b.start || a.idx - b.idx);
      let at = k.start_lock, free = 0, prev = null;
      for (const op of list) {
        const need = free + walkMinutes(M, at, op.lock);
        if (op.start < need)
          err(`${op.label}: keeper ${k.id} cannot be there before minute ${need} (${prev ? 'finished ' + prev.label : 'starts at lock ' + k.start_lock} then walks ${walkMinutes(M, at, op.lock)} min)`);
        at = op.lock; free = op.end; prev = op;
      }
    }

    // ---- 5. boats: exact route, order and arrival times
    const boatRows = [];
    let weighted = 0, lateBoats = 0;
    const lastEnd = M.horizon;
    const opsOfBoat = new Map(M.boats.map(b => [b.id, []]));
    for (const op of ops) for (const id of op.boats) opsOfBoat.get(id).push(op);
    for (const b of M.boats) {
      const list = opsOfBoat.get(b.id).sort((a, c) => a.start - c.start || a.idx - c.idx);
      const route = routeOf(b);
      let finish = null, complete = true;
      const stages = [];
      if (list.length !== route.length) {
        err(`boat ${b.id} (${b.name}): appears in ${list.length} operations but its route has ${route.length} lock passages`);
        complete = false;
      }
      let arrive = b.release;
      const n = Math.min(list.length, route.length);
      for (let i = 0; i < n; i++) {
        const op = list[i], want = route[i];
        if (op.lock !== want.lock || op.dir !== want.dir) {
          err(`boat ${b.id} (${b.name}): passage ${i + 1} should be lock ${want.lock} ${want.dir} but is in ${op.label}`);
          complete = false; break;
        }
        if (op.start < arrive)
          err(`boat ${b.id} (${b.name}): joins ${op.label} but only reaches lock ${op.lock} at minute ${arrive}`);
        stages.push({ lock: op.lock, dir: op.dir, avail: arrive, start: op.start, end: op.end, op: op.idx });
        arrive = op.end + crossMinutes(M, b, op.lock, op.dir);
      }
      if (complete && list.length) finish = list[list.length - 1].end;
      if (route.length === 0) { finish = null; complete = true; }
      let lateness = 0;
      if (route.length > 0) {
        lateness = finish === null ? Math.max(0, lastEnd - b.deadline) : Math.max(0, finish - b.deadline);
      }
      weighted += b.priority * lateness;
      if (lateness > 0) lateBoats++;
      boatRows.push({ id: b.id, name: b.name, priority: b.priority, deadline: b.deadline, finish, lateness,
        weighted: b.priority * lateness, complete, stages });
    }

    // ---- 6. water, minute by minute, in the exact order of events of section 4
    const levels = M.pools.map(p => p.level);
    const sortedOps = ops.filter(o => o.start >= 0 && o.start <= M.horizon)
      .sort((a, b) => a.start - b.start || a.lock - b.lock || a.idx - b.idx);
    const cascade = () => {
      for (let i = M.top; i >= 1; i--) {
        const max = M.pools[i].max;
        if (levels[i] > max) { levels[i - 1] += levels[i] - max; levels[i] = max; }
      }
    };
    let oi = 0, waterDrawn = 0;
    for (const op of ops) if (op.dir === 'up') waterDrawn += M.locks[op.lock - 1].volume;
    const trace = { levels: [], pre: [], opWater: new Map() };
    const lastT = sortedOps.length ? sortedOps[sortedOps.length - 1].start : 0;
    const tEnd = options.fullTimeline ? Math.max(M.horizon, lastT) : lastT;
    for (let t = 0; t <= tEnd; t++) {
      if (t >= 1) { levels[M.top] += M.feeder; cascade(); }
      if (options.fullTimeline) trace.pre.push(levels.slice());     // after the feeder, before this minute's operations
      while (oi < sortedOps.length && sortedOps[oi].start === t) {
        const op = sortedOps[oi++];
        const vol = M.locks[op.lock - 1].volume;
        if (op.dir === 'up') {
          const before = levels[op.lock];
          levels[op.lock] -= vol;
          if (levels[op.lock] < M.pools[op.lock].min)
            err(`${op.label}: pool ${op.lock} would drop to ${levels[op.lock]} (< min ${M.pools[op.lock].min})`);
          trace.opWater.set(op.idx, { pool: op.lock, before, after: levels[op.lock] });
        } else {
          const before = levels[op.lock - 1];
          levels[op.lock - 1] += vol;
          cascade();
          trace.opWater.set(op.idx, { pool: op.lock - 1, before, after: levels[op.lock - 1] });
        }
      }
      if (options.fullTimeline) trace.levels.push(levels.slice());
    }

    const emptyTurns = ops.filter(o => o.empty).length;
    const result = {
      valid: errors.length === 0,
      errors,
      weighted_lateness: weighted,
      water_drawn: waterDrawn,
      late_boats: lateBoats,
      operations: raw.length,
      empty_turns: emptyTurns,
    };
    if (options.trace) {
      trace.ops = ops; trace.boats = boatRows; trace.model = M;
      result.trace = trace;
    }
    if (options.boats) result.boats = boatRows.map(r => ({ id: r.id, name: r.name, priority: r.priority,
      deadline: r.deadline, finish: r.finish, lateness: r.lateness }));
    return result;
  }

  // Convenience: validate with the full trace (pool level at the end of every minute, per-boat stages).
  function simulate(canal, schedule) {
    return validate(canal, schedule, { trace: true, fullTimeline: true });
  }

  const api = { prepare, validate, simulate, routeOf, opDuration, walkMinutes, crossMinutes, slotsOf };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.LockValidate = api;

  // ------------------------------------------------------------------ command line
  if (typeof require !== 'undefined' && typeof module !== 'undefined' && require.main === module) {
    const fs = require('fs');
    const args = process.argv.slice(2).filter(a => !a.startsWith('--'));
    const flags = new Set(process.argv.slice(2).filter(a => a.startsWith('--')));
    if (args.length < 2) {
      console.error('usage: node validate.js canal.json schedule.json [--boats] [--errors-only]');
      process.exit(2);
    }
    let canal, schedule;
    try {
      canal = JSON.parse(fs.readFileSync(args[0], 'utf8'));
      schedule = JSON.parse(fs.readFileSync(args[1], 'utf8'));
    } catch (e) {
      console.error('cannot read input: ' + e.message);
      process.exit(2);
    }
    const r = validate(canal, schedule, { boats: flags.has('--boats') });
    if (flags.has('--errors-only')) console.log(JSON.stringify({ valid: r.valid, errors: r.errors }, null, 1));
    else console.log(JSON.stringify(r, null, 1));
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script id="src-explain">'use strict';
/*
 * explain.js - turns a simulated schedule into everything the Ledger page shows.
 *
 *   const A = LockExplain.analyze(canal, schedule);
 *
 * It runs the schedule through validate.js's simulator (the same engine that scores it), then works out, from the
 * simulation and nothing else:
 *   - timelines for the animation: pool levels, chamber level of every lock, position of every boat and keeper at any minute
 *   - for every boat, every wait at every lock, split into the reasons that held it (lock busy, no keeper free, pool too
 *     low, night, maintenance closure, waiting for a partner) and written up in plain language
 *   - totals: which boats are late and which causes cost the most
 * Reasons are found by asking, minute by minute during each wait, "what would have stopped an operation starting now?"
 * and naming the constraint that stayed unsatisfied longest.
 */
(function (root) {
  const V = (typeof require !== 'undefined' && typeof module !== 'undefined' && module.exports) ? require('./validate.js') : root.LockValidate;

  const pad = n => String(n).padStart(2, '0');
  function hm(t) { const m = ((t % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function clock(t) { return 'Day ' + (Math.floor(t / 1440) + 1) + ' ' + hm(t); }
  const CAUSE_ORDER = ['night', 'closure', 'keeper', 'water', 'partner', 'lock', 'held'];
  const CAUSE_LABEL = {
    lock: 'lock chamber busy', keeper: 'no keeper free', water: 'pool too low', night: 'locks closed at night',
    closure: 'maintenance closure', partner: 'waiting to share a chamber', held: 'held by the plan',
  };

  function analyze(canal, schedule) {
    const sim = V.simulate(canal, schedule);
    const score = { weighted_lateness: sim.weighted_lateness, water_drawn: sim.water_drawn, late_boats: sim.late_boats,
      operations: sim.operations, empty_turns: sim.empty_turns, boats: canal.boats.length };
    if (!sim.valid) return { valid: false, errors: sim.errors, score };
    const T = sim.trace, M = T.model;
    const A = { valid: true, errors: [], score, canal, model: M, windows: M.windows, closures: M.closures };
    const nL = M.nL;
    const keeperName = id => (M.keeperById.get(id) || {}).name || ('keeper ' + id);

    // ------------------------------------------------------------ operations
    const ops = T.ops.slice().sort((a, b) => a.start - b.start || a.lock - b.lock || a.idx - b.idx).map((o, i) => {
      const enter = o.empty ? 0 : (o.boats.some(id => M.boatById.get(id).type === 'barge') ? M.enterBarge : M.enter);
      const exit = o.empty ? 0 : M.exit;
      const mv = o.dur - enter - exit;
      return { id: i, idx: o.idx, lock: o.lock, dir: o.dir, start: o.start, end: o.end, dur: o.dur, keeper: o.keeper, boats: o.boats,
        empty: o.empty, enterEnd: o.start + enter, moveEnd: o.start + enter + mv };
    });
    const opByIdx = new Map(ops.map(o => [o.idx, o]));
    A.ops = ops;
    const lockOps = Array.from({ length: nL + 1 }, () => []);
    for (const o of ops) lockOps[o.lock].push(o);
    A.lockOps = lockOps;

    // keeper sequences, readiness of each operation's keeper
    const kOps = new Map(M.keepers.map(k => [k.id, []]));
    for (const o of ops) kOps.get(o.keeper).push(o);
    const kPrev = new Array(ops.length).fill(null);
    for (const k of M.keepers) {
      const list = kOps.get(k.id);
      let prev = null;
      for (const o of list) {
        kPrev[o.id] = prev;
        o.keeperReady = prev ? prev.end + V.walkMinutes(M, prev.lock, o.lock) : V.walkMinutes(M, k.start_lock, o.lock);
        o.keeperWalk = prev ? V.walkMinutes(M, prev.lock, o.lock) : V.walkMinutes(M, k.start_lock, o.lock);
        prev = o;
      }
    }
    A.keeperOps = kOps;

    // ------------------------------------------------------------ operating-hour helpers
    const windowAt = t => M.windows.find(w => w[0] <= t && t < w[1]) || null;
    function openBlock(l, t, dur) {
      // null when an operation of `dur` minutes may start at minute t; otherwise {type, ready, ...}
      let ready = t, cause = null, info = null;
      for (let guard = 0; guard < 20; guard++) {
        const w = M.windows.find(x => x[0] <= ready && ready + dur <= x[1]);
        if (!w) {
          const inside = windowAt(ready);
          const nx = M.windows.find(x => x[0] > ready);
          if (!cause) { cause = inside ? 'night' : 'night'; info = inside ? { closing: true, until: inside[1] } : { closing: false }; }
          if (!nx) return { type: 'night', ready: Infinity, info };
          ready = nx[0]; continue;
        }
        const c = M.closures.find(x => x.lock === l && ready < x.to && x.from < ready + dur);
        if (c) { if (!cause || cause === 'night') { cause = 'closure'; info = { closure: c }; } ready = c.to; continue; }
        break;
      }
      return ready > t ? { type: cause, ready, info } : null;
    }
    A.closedReason = (l, t) => {
      const c = M.closures.find(x => x.lock === l && x.from <= t && t < x.to);
      if (c && windowAt(t)) return 'closure';
      return windowAt(t) ? null : 'night';
    };

    // ------------------------------------------------------------ boats: stages, free-flow times
    const boats = canal.boats.map((b, bi) => {
      const row = T.boats[bi];
      const route = V.routeOf(b);
      let free = 0;
      route.forEach((r, i) => {
        free += V.opDuration(M, r.lock, r.dir, [b.id]);
        if (i < route.length - 1) free += V.crossMinutes(M, b, r.lock, r.dir);
      });
      const stages = row.stages.map(st => {
        const o = opByIdx.get(st.op);
        return { lock: st.lock, dir: st.dir, arrive: st.avail, start: st.start, end: st.end, op: o.id, wait: st.start - st.avail, segments: [] };
      });
      return { index: bi, id: b.id, name: b.name, type: b.type, speed: b.speed, priority: b.priority, from: b.from, to: b.to,
        release: b.release, deadline: b.deadline, finish: row.finish, lateness: row.lateness, weighted: row.weighted,
        freeFlow: free, stages, waitTotal: 0, causes: {}, story: [] };
    });
    A.boats = boats;
    const nameOf = id => (M.boatById.get(id) || {}).name || ('boat ' + id);
    const namesOf = list => { const n = list.map(nameOf); return n.length <= 1 ? (n[0] || '') : n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1]; };

    // ------------------------------------------------------------ why was boat b still waiting at minute t?
    const pre = T.pre;
    function runningOn(l, t) {
      const list = lockOps[l];
      for (let i = 0; i < list.length; i++) { if (list[i].start > t) break; if (t < list[i].end) return list[i]; }
      return null;
    }
    function nextOn(l, t) { const list = lockOps[l]; for (let i = 0; i < list.length; i++) if (list[i].start > t) return list[i]; return null; }
    function waterReady(N, t) {
      const p = N.lock, need = M.pools[p].min + M.locks[p - 1].volume;
      if ((pre[t] ? pre[t][p] : Infinity) >= need) return null;
      let r = t + 1;
      while (r < N.start && pre[r] && pre[r][p] < need) r++;
      // what sent the water: the last operation of the lock above that started before r, if any
      let helper = null;
      if (p + 1 <= nL) for (const o of lockOps[p + 1]) if (o.dir === 'down' && o.start > t && o.start < r) helper = o;
      return { ready: r, level: pre[t][p], need, helper };
    }
    // Could keeper `kid` physically start operation N at minute t (or soonest after)? Everything he does is respected except
    // N itself, so this asks about what he is doing at that moment, not about where N happens to sit in his list.
    function keeperReadyFor(kid, N, t) {
      const list = kOps.get(kid), k = M.keeperById.get(kid);
      let prevEnd = 0, prevLock = k.start_lock;
      for (let i = 0; i <= list.length; i++) {
        const next = i < list.length ? list[i] : null;
        if (next && next.id === N.id) continue;
        const earliest = Math.max(t, prevEnd + V.walkMinutes(M, prevLock, N.lock));
        if (!next || earliest + N.dur + V.walkMinutes(M, N.lock, next.lock) <= next.start) return earliest;
        prevEnd = next.end; prevLock = next.lock;
      }
      return Infinity;
    }
    function keeperActivity(kid, N, t) {
      const list = kOps.get(kid), k = M.keeperById.get(kid);
      let prev = null, next = null;
      for (const o of list) {
        if (o.id === N.id) continue;
        if (o.start <= t && t < o.end) return { kind: 'work', op: o, key: 'w' + o.id };
        if (o.end <= t) prev = o; else if (!next) next = o;
      }
      const from = prev ? prev.lock : k.start_lock;
      const arrive = (prev ? prev.end : 0) + V.walkMinutes(M, from, N.lock);
      if (arrive > t) return { kind: 'walk', from, arrive, prev, key: 'k' + (prev ? prev.id : 's') };
      return { kind: 'due', next, key: 'd' + (next ? next.id : 'x') };
    }
    function keeperBlock(N, t) {
      let best = Infinity, bk = null;
      for (const k of M.keepers) { const r = keeperReadyFor(k.id, N, t); if (r < best) { best = r; bk = k.id; } }
      if (best <= t || bk === null) return null;
      const act = keeperActivity(bk, N, t);
      return { ready: best, keeper: bk, act };
    }
    function blockerAt(bi, si, t) {
      const b = boats[bi], st = b.stages[si];
      const R = runningOn(st.lock, t);
      if (R) return { type: 'lock', ready: R.end, key: 'lock:' + R.id, op: R };
      const N = nextOn(st.lock, t);
      if (!N) return { type: 'held', ready: t + 1, key: 'held', op: null };
      const cands = [];
      // closed hours and maintenance hold every boat whatever else is going on, so they come first while they are in force
      const ob = openBlock(N.lock, t, N.dur);
      if (ob) return { type: ob.type, ready: ob.ready, key: ob.type + ':' + (ob.info && ob.info.closure ? ob.info.closure.from : ob.ready), op: N, info: ob.info };
      const kb = keeperBlock(N, t);
      if (kb) cands.push({ type: 'keeper', ready: kb.ready, key: 'keeper:' + kb.keeper + ':' + kb.act.key, op: N, info: kb });
      if (N.dir === 'up') {
        const w = waterReady(N, t);
        if (w) cands.push({ type: 'water', ready: w.ready, key: 'water:' + N.lock, op: N, info: w });
      }
      for (const id of N.boats) {
        if (id === b.id) continue;
        const ob2 = boats[canal.boats.findIndex(x => x.id === id)];
        const st2 = ob2.stages.find(s => s.op === N.id);

        if (R.dir === st.dir) return 'was taking ' + namesOf(R.boats) + (R.dir === 'up' ? ' up' : ' down') + ' first';
        return R.dir === 'down' ? 'was full and had to be emptied for ' + namesOf(R.boats) + ' coming down' : 'was empty and had to be filled for ' + namesOf(R.boats) + ' going up';

      const dur = seg.to - seg.from;

            else if (x.kind === 'walk') { g.items.push({ text: 'walking here, arriving ' + hm(x.arrive) }); g.lastWork = false; g.last = null; }

      const seq = [];

        seq.push({ k: 'enter', t0: o.start, t1: o.enterEnd, lock: st.lock, dir: st.dir, op: o.id });
        seq.push({ k: 'lift', t0: o.enterEnd, t1: o.moveEnd, lock: st.lock, dir: st.dir, op: o.id });
        seq.push({ k: 'exit', t0: o.moveEnd, t1: o.end, lock: st.lock, dir: st.dir, op: o.id });

    });

      const seq = A.keeperLine.get(kid);
      for (const s of seq) if (t >= s.t0 && t < s.t1) return Object.assign({ frac: isFinite(s.t1) ? (t - s.t0) / Math.max(1, s.t1 - s.t0) : 0 }, s);

  // disruption: {closures: [{lock, from, to}], delays: {boatId: minutes}}

<script id="src-solve">'use strict';
/*
 * solve.js - optimiser for "The Lockkeeper's Ledger"          node solve.js canal.json > schedule.json
 *
 * Reads a canal (rules: LOCKKEEPER_SPEC.md) and writes {"operations": [...]} to stdout; progress goes to stderr.
 *   --time s      wall-clock budget in seconds (default 95, or env LOCKKEEPER_TIME)
 *   --threads n   worker threads (default: cores - 1, at most 12)
 *   --seed n      first random seed          --quiet   no progress
 *   --start f     continue from the schedule in f (skips the dispatcher and rollouts)
 *   env LOCKKEEPER_TUNE   JSON overrides of the search settings (see `tune` in solveSingle), for experiments
 *
 * How it works (NOTES.md has the long version)
 *   buildModel     canal -> flat typed arrays: walking times, operation durations, "may start at" tables, boat routes.
 *   createEngine   a time-ordered dispatcher: builds a complete valid schedule minute by minute (exact water accounting,
 *                  keepers, pairing, holds). Its policy parameters are sampled at random; the best ones are improved by
 *                  rollouts (try the alternatives at each decision, finish greedily, keep the best).
 *   createPlanner  turns a schedule into an explicit plan (order of operations per lock and per keeper, boats per
 *                  operation), evaluates a plan exactly with one chronological pass (same semantics as validate.js, about
 *                  50 microseconds) and improves it by simulated annealing over a dozen move types.
 *   solveSingle    one thread: dispatcher -> rollouts -> annealing (cool slices from the best plan, then one hot slice to
 *                  shake converged plans out of their basin). Threads share their best schedule while they run.
 *   cliMain        starts the threads, and prints the best schedule only after validate.js has accepted it (falls back to
 *                  the next best, then to the plain dispatcher).

  const INF = 1e9;

  // ================================================================== model
  function buildModel(canal) {

    const locks = canal.locks.slice().sort((a, b) => a.id - b.id);

    hold: 30,          // longest a lock may wait for a second boat to share the chamber
    holdSlack: 0.5,    // ... but never more than this fraction of the leader's slack (minus holdMargin)
    holdMargin: 10,

    // lock chambers

      const status = sv('text', { x: x + lw / 2, y: 32, 'text-anchor': 'middle', 'font-size': 9.5, 'font-weight': 600, class: 'svgtxt', style: 'fill:var(--pc-soft);paint-order:stroke;stroke:var(--sky-day-top);stroke-width:2.5px;stroke-linejoin:round' });

      });

    tp.push(`L${G.x1[nL]},${G.rim(nL) - 3}`);
    svg.append(sv('path', { d: tp.join(' '), fill: 'none', style: 'stroke:var(--ground-edge)', 'stroke-width': 1.6, 'stroke-dasharray': '1 3', 'stroke-linecap': 'round' }));
    // feeder and river labels
    svg.append(sv('text', { x: G.cx(nL) - 12, y: G.rim(nL) - 34, 'text-anchor': 'end', 'font-size': 9.5, class: 'svgtxt', style: 'fill:var(--pc-soft)', text: `feeder stream +${M.feeder}/min ▸` }));   // left of the summit lock, so a keeper standing there does not cover it
    E.feedDrop = sv('circle', { r: 1.8, style: 'fill:var(--water-hi)' });
    svg.append(E.feedDrop);
    E.arrived = [];
    for (let p = 0; p <= nL; p++) {
      const tx = sv('text', { x: (G.x0[p] + G.x1[p]) / 2, y: G.bed(p) + 32, 'text-anchor': 'middle', 'font-size': 9.5, class: 'svgtxt', style: 'fill:var(--pc-head)', opacity: 0 });

    E.boats = A.boats.map(b => {
      const barge = b.type === 'barge';
      const w = barge ? 15 : 10;
      const g = sv('g', { style: 'cursor:pointer' });
      const halo = sv('rect', { x: -w - 3, y: -13, width: 2 * w + 6, height: 17, rx: 5, fill: 'none', style: 'stroke:var(--pc-head)', 'stroke-width': 2, opacity: 0 });
      const hull = sv('path', { d: `M${-w},-5 L${w},-5 L${w - 2.5},0.5 L${-w + 2.5},0.5 Z`, style: 'fill:var(--boat)', stroke: 'none' });
      const cab = barge ? sv('rect', { x: -w + 4, y: -8.5, width: 2 * w - 8, height: 3.6, rx: 1, style: 'fill:var(--boat);opacity:.6' }) : sv('rect', { x: -1, y: -9, width: 8, height: 4.2, rx: 1.2, style: 'fill:var(--boat)' });

  function boatTip(b) {
    const A = S.A, t = S.t, bs = A.boatState(b.index, t);
    const route = `${b.from === 0 ? 'the river' : 'Pool ' + b.from} → ${b.to === 0 ? 'the river' : 'Pool ' + b.to}`;
    let now = '';
    if (bs.k === 'wait') {
      const st = b.stages.find(s => t >= s.arrive && t < s.start);
      const seg = st && st.segments.find(g => t >= g.from && t < g.to);
      now = `<br><b>Now:</b> waiting at Lock ${bs.lock}` + (st ? ` since ${hm(st.arrive)}` : '') + (seg ? `.<br><span class="why">${esc(seg.text.replace(/^.*?: /, '').replace(/^./, c => c.toUpperCase()))}.</span>` : '.');
    } else if (bs.k === 'enter' || bs.k === 'lift' || bs.k === 'exit') now = `<br><b>Now:</b> in Lock ${bs.lock}, ${b.stages.find(s => s.op === bs.op) && bs.dir === 'up' ? 'going up' : 'going down'}.`;
    else if (bs.k === 'cross') now = `<br><b>Now:</b> crossing pool ${bs.dir === 'up' ? bs.from : bs.from - 1} towards Lock ${bs.to}.`;
    else if (bs.k === 'done') now = `<br><b>Now:</b> arrived (finished ${hm(b.finish)}).`;
    else now = `<br><b>Now:</b> not yet released (${clock(b.release)}).`;
    const late = b.lateness > 0 ? `<br><span class="late">Finishes ${b.lateness} min late</span> (deadline ${clock(b.deadline)}, weight ${b.priority}).` : `<br>Finishes ${clock(b.finish)}, on time (deadline ${clock(b.deadline)}).`;
    return `<span class="h">${esc(b.name)}</span>${b.type === 'barge' ? 'Barge (takes the whole chamber)' : 'Narrowboat'}, ${route}, priority ${b.priority} (${'•'.repeat(b.priority)}).${now}${late}<br><span class="muted">Click to follow it in every view.</span>`;
  }
  function keeperTip(k) {
    const A = S.A, ks = A.keeperState(k.id, S.t);
    let now = 'standing by';
    if (ks.k === 'work') { const o = A.ops[ks.op]; now = `working Lock ${ks.lock}, ${o.dir === 'up' ? 'filling' : 'emptying'}${o.boats.length ? ' for ' + esc(o.boats.map(id => A.nameOf(id)).join(' + ')) : ' (empty turn)'} until ${hm(o.end)}`; }
    else if (ks.k === 'walk') now = `walking from Lock ${ks.from} to Lock ${ks.to} (arrives ${hm(ks.t1)})`;
    else if (ks.k === 'wait') now = `waiting at Lock ${ks.lock} for the next boat`;
    else if (ks.k === 'idle') now = `finished for good, at Lock ${ks.lock}`;
    const n = A.keeperOps.get(k.id).length, busy = A.keeperOps.get(k.id).reduce((s, o) => s + o.dur, 0);
    return `<span class="h">${esc(k.name)}</span>Lockkeeper, started at Lock ${k.start_lock}. <b>Now:</b> ${now}.<br>${n} operations, ${fmtNum(busy)} min at the locks over the two days.`;
  }

  // ---------------------------------------------------------------- per-frame update
  function update(t) {
    if (!svg) return;
    const A = S.A, M = A.model, nL = M.nL;
    const nt = nightness(t);
    E.night.setAttribute('opacity', nt.toFixed(3));
    E.starG.setAttribute('opacity', (nt * 0.95).toFixed(3));
    const df = dayFraction(t);
    if (df !== null) { E.sun.setAttribute('cx', (60 + df * (G.W - 120)).toFixed(1)); E.sun.setAttribute('cy', (92 - Math.sin(df * Math.PI) * 40).toFixed(1)); E.sun.setAttribute('opacity', (0.42 * (1 - nt)).toFixed(3)); }
    else E.sun.setAttribute('opacity', 0);
    // moon: crosses the sky during the closed hours
    let mf = 0.5;
    const ws = A.windows;
    if (t < ws[0][0]) mf = 1 - t / ws[0][0] * 0.5 - 0.0; else for (let i = 0; i + 1 < ws.length; i++) if (t >= ws[i][1] && t < ws[i + 1][0]) mf = (t - ws[i][1]) / (ws[i + 1][0] - ws[i][1]);
    E.moon.setAttribute('transform', `translate(${(70 + mf * (G.W - 140)).toFixed(1)},${(96 - Math.sin(mf * Math.PI) * 40).toFixed(1)})`);
    E.moon.setAttribute('opacity', (nt).toFixed(3));
    // pools
    for (let p = 0; p <= nL; p++) {
      const y = ySurf(p, t), e = E.pools[p];
      e.water.setAttribute('y', y.toFixed(2)); e.water.setAttribute('height', Math.max(0, G.bed(p) + 6 - y).toFixed(2));
      e.surf.setAttribute('y1', y.toFixed(2)); e.surf.setAttribute('y2', y.toFixed(2));
      e.lvl.setAttribute('x', ((G.x0[p] + G.x1[p]) / 2).toFixed(1)); e.lvl.setAttribute('y', (y + 13).toFixed(1));
      e.lvl.textContent = p === 0 ? '' : fmtNum(A.levelAt(p, t));
    }
    // feeder drop
    const fd = (t * 0.9) % 1;
    E.feedDrop.setAttribute('cx', (G.x1[nL] - 6).toFixed(1)); E.feedDrop.setAttribute('cy', (G.rim(nL) - 30 + fd * 26).toFixed(1));
    // chambers
    for (let l = 1; l <= nL; l++) {
      const ch = A.chamber(l, t), e = E.locks[l];
      const yLow = ySurf(l - 1, t), yHigh = ySurf(l, t);
      const y = lerp(yLow, yHigh, ch.level);
      const floor = G.bed(l - 1) + 7;
      e.water.setAttribute('y', y.toFixed(2)); e.water.setAttribute('height', Math.max(0, floor - y).toFixed(2));
      e.surf.setAttribute('y1', y.toFixed(2)); e.surf.setAttribute('y2', y.toFixed(2));
      // gates: the gate on the side the boats use is open while they enter or leave
      let lowOpen = false, highOpen = false;
      if (ch.op && ch.op.boats.length) {
        if (ch.op.dir === 'up') { lowOpen = ch.phase === 'enter'; highOpen = ch.phase === 'exit'; }
        else { highOpen = ch.phase === 'enter'; lowOpen = ch.phase === 'exit'; }
      }
      e.gateL.setAttribute('opacity', lowOpen ? 0.18 : 0.95); e.gateR.setAttribute('opacity', highOpen ? 0.18 : 0.95);
      const cr = A.closedReason(l, t);
      e.closed.setAttribute('opacity', cr === 'closure' ? 0.9 : 0);
      e.nightShade.setAttribute('opacity', cr === 'night' ? 0.55 : 0);
      e.status.style.fill = cr === 'closure' ? 'var(--pc-accent)' : 'var(--pc-soft)';
      e.status.textContent = cr === 'night' ? 'shut' : cr === 'closure' ? 'maintenance' : ch.op ? (ch.op.dir === 'up' ? (ch.op.boats.length ? 'filling' : 'turning') : (ch.op.boats.length ? 'emptying' : 'turning')) : '';
    }
    updateBoats(t);
    updateKeepers(t);
    S.snap = false;
  }

  function updateBoats(t) {
    const A = S.A, nL = A.model.nL;
    const states = E.boats.map(v => A.boatState(v.b.index, t));
    // waiting queues: nearest the lock = arrived first
    const queues = new Map();
    E.boats.forEach((v, i) => {
      const s = states[i];
      if (s.k !== 'wait') return;
      const key = s.lock + (s.dir === 'up' ? 'u' : 'd');
      if (!queues.has(key)) queues.set(key, []);
      const st = v.b.stages.find(x => x.lock === s.lock);
      queues.get(key).push({ i, arrive: st ? st.arrive : 0 });
    });
    const qIndex = new Array(E.boats.length).fill(0), qCount = new Map();
    for (const [key, list] of queues) { list.sort((a, b) => a.arrive - b.arrive || a.i - b.i); list.forEach((q, n) => { qIndex[q.i] = n; }); qCount.set(key, list.length); }
    const arrivedAt = new Array(nL + 1).fill(0);
    const labelBoxes = [];
    E.boats.forEach((v, i) => {
      const s = states[i], b = v.b;

          const room = (G.x1[pool] - G.x0[pool]) - 16;
          const sp = Math.max(8, Math.min(30, room / Math.max(1, n)));
          const target = qIndex[i] * sp;
          if (S.snap || Math.abs(v.qOff - target) > 80) v.qOff = target; else v.qOff += (target - v.qOff) * 0.25;

          const off = A.ops[s.op].boats.length > 1 ? (partner === 0 ? -4.5 : 4.5) : 0;
          const inPoolX = up ? G.x1[l - 1] - 14 : G.x0[l] + 14;
          const outPoolX = up ? G.x0[l] + 14 : G.x1[l - 1] - 14;
          if (s.k === 'enter') { const f = ease(s.frac); x = lerp(inPoolX, cx + off, f); y = up ? ySurf(l - 1, t) : ySurf(l, t); }
          else if (s.k === 'lift') { x = cx + off; y = lerp(ySurf(l - 1, t), ySurf(l, t), A.chamber(l, t).level); }
          else { const f = ease(s.frac); x = lerp(cx + off, outPoolX, f); y = up ? ySurf(l, t) : ySurf(l - 1, t); }

        }
        case 'cross': {
          const up = s.dir === 'up', pool = up ? s.from : s.from - 1;

        }

      v.g.removeAttribute('display');
      v.g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`);
      v.g.setAttribute('opacity', opacity.toFixed(2));
      // status decorations
      const late = t > b.deadline && b.finish !== null && t < b.finish;
      v.hull.style.fill = late ? 'var(--boat-late)' : 'var(--boat)';
      v.halo.setAttribute('opacity', sel ? 1 : hov ? 0.6 : 0);
      if (s.k === 'wait') {
        const st = b.stages.find(q => t >= q.arrive && t < q.start);
        const seg = st && st.segments.find(g => t >= g.from && t < g.to);

      let row = -1;
      for (let r = 0; r < 4 && row < 0; r++) {

  function updateKeepers(t) {
    const A = S.A;
    const nightNow = nightness(t) > 0.5;

      const ks = A.keeperState(k.id, t), e = E.keepers.get(k.id);

  function root() { return svg; }
  return { build, update, root };
})();

// ============================================================================ transport: time, play/pause, scrubber
const timeHooks = [];              // called with the current minute whenever time changes
let tMax = 2880;
const T = { playBtn: null, range: null, clock: null, phase: null, band: null, last: 0 };

function phaseText(t) {
  const A = S.A;
  const cl = A.closures.filter(c => t >= c.from && t < c.to);
  const open = A.windows.some(w => t >= w[0] && t < w[1]);
  let s = open ? 'Locks open' : 'Night: every lock is shut';
  if (!open) { const nx = A.windows.find(w => w[0] > t); if (nx) s += ` until ${hm(nx[0])}`; else s = 'Night: the two days are over'; }
  if (cl.length) s += ' · ' + cl.map(c => `Lock ${c.lock} closed until ${hm(c.to)}`).join(', ');
  return s;
}

function setTime(t, opts) {
  t = clamp(t, 0, tMax);
  S.t = t;
  if (opts && opts.snap) S.snap = true;
  T.range.value = String(Math.round(t));
  T.clock.textContent = `${dayLabel(t)} · ${hm(t)}`;
  if (T.mini) { T.mini.clock.textContent = T.clock.textContent; T.mini.range.value = T.range.value; }
  T.phase.textContent = phaseText(t);
  canalView.update(t);
  for (const fn of timeHooks) fn(t);
}

function setPlaying(p) {
  S.playing = p;
  T.playBtn.textContent = p ? 'Pause' : 'Play';
  if (T.mini) T.mini.play.textContent = p ? 'Pause' : 'Play';
  T.playBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
  T.last = performance.now();
  if (p && S.t >= tMax - 1) setTime(0, { snap: true });
}

function loop(now) {
  if (S.playing) {
    const dt = Math.min(0.1, (now - T.last) / 1000);
    T.last = now;
    const nt = S.t + S.speed * dt;
    if (nt >= tMax) { setTime(tMax); setPlaying(false); }
    else setTime(nt);
  } else T.last = now;
  requestAnimationFrame(loop);
}

function buildBand() {
  T.band.replaceChildren();
  const A = S.A, pct = t => (100 * t / tMax).toFixed(3) + '%';
  T.band.append(h('div', { class: 'bandbg', style: { position: 'absolute', left: 0, right: 0, top: '10px', height: '14px', background: 'var(--pc-line)', borderRadius: '7px' } }));
  // night stretches (dark, hatched) and open hours
  let prev = 0;
  const nights = [];
  for (const w of A.windows) { if (w[0] > prev) nights.push([prev, w[0]]); prev = w[1]; }
  if (prev < tMax) nights.push([prev, tMax]);
  for (const n of nights) T.band.append(h('div', { style: { position: 'absolute', left: pct(n[0]), width: (100 * (n[1] - n[0]) / tMax).toFixed(3) + '%', top: '10px', height: '14px', background: 'repeating-linear-gradient(45deg, var(--pc-line2) 0 2px, transparent 2px 6px)', opacity: 0.8 }, title: 'Night: locks closed' }));
  for (const w of A.windows) T.band.append(h('div', { style: { position: 'absolute', left: pct(w[0]), width: (100 * (w[1] - w[0]) / tMax).toFixed(3) + '%', top: '10px', height: '14px', background: 'var(--pc-hover)', border: '1px solid var(--pc-line2)', borderRadius: '7px' } }));
  for (const c of A.closures) T.band.append(h('div', { title: `Lock ${c.lock} closed ${hm(c.from)}–${hm(c.to)}`, style: { position: 'absolute', left: pct(c.from), width: (100 * (c.to - c.from) / tMax).toFixed(3) + '%', top: '10px', height: '14px', background: 'repeating-linear-gradient(45deg, var(--pc-accent) 0 2px, transparent 2px 5px)', border: '1px solid var(--pc-accent)', borderRadius: '3px', opacity: 0.9 } }),
    h('span', { style: { position: 'absolute', left: pct(c.from), top: '-3px', fontSize: '10px', color: 'var(--pc-accent)', fontWeight: 600, whiteSpace: 'nowrap' }, text: 'L' + c.lock }));
  // hour labels
  for (let day = 0; day * 1440 < tMax; day++) {
    T.band.append(h('span', { style: { position: 'absolute', left: pct(day * 1440 + 8), top: '24px', fontSize: '10px', color: 'var(--pc-quiet)' }, text: 'Day ' + (day + 1) }));
    for (let hh = 6; hh < 24; hh += 6) T.band.append(h('span', { style: { position: 'absolute', left: pct(day * 1440 + hh * 60), top: '24px', fontSize: '10px', color: 'var(--pc-quiet)', transform: 'translateX(-50%)', fontVariantNumeric: 'tabular-nums' }, text: String(hh).padStart(2, '0') + ':00' }));
  }
}

function buildTransport(host) {
  tMax = Math.max(2880, Math.ceil((S.A.horizon + 30) / 1440) * 1440);
  T.playBtn = h('button', { class: 'pill primary', type: 'button', 'aria-pressed': 'false', onclick: () => setPlaying(!S.playing) }, 'Play');
  const startBtn = h('button', { class: 'pill small', type: 'button', onclick: () => { setPlaying(false); setTime(0, { snap: true }); } }, 'Start');
  const endBtn = h('button', { class: 'pill small', type: 'button', onclick: () => { setPlaying(false); setTime(tMax - 1, { snap: true }); } }, 'End');
  T.clock = h('div', { class: 'clock', 'aria-live': 'off' });
  T.phase = h('div', { class: 'phase' });
  T.range = h('input', { type: 'range', min: 0, max: tMax, step: 1, value: 0, 'aria-label': 'Time across both days',
    oninput: ev => { setTime(+ev.target.value, { snap: true }); } });
  T.band = h('div', { style: { position: 'absolute', inset: 0, pointerEvents: 'none' } });
  const scrub = h('div', { class: 'scrub' }, T.band, T.range);
  const speeds = h('div', { class: 'speedgroup' }, h('span', { class: 'lab' }, 'speed'),
    [10, 30, 90, 240].map(v => h('button', { class: 'pill small', type: 'button', 'data-speed': v, 'aria-pressed': v === S.speed ? 'true' : 'false',
      title: `${v} minutes of canal time per second`, onclick: ev => { S.speed = v; for (const b of speeds.querySelectorAll('button')) b.setAttribute('aria-pressed', +b.dataset.speed === v ? 'true' : 'false'); } }, v + '×')));
  host.replaceChildren(startBtn, T.playBtn, endBtn, T.clock, scrub, speeds, T.phase);
  buildBand();
  buildMini(host.closest('.canalcard'));

// a slim copy of the controls that appears while the canal itself is scrolled out of view
function buildMini(card) {
  if (T.mini || !card) { if (T.mini) T.mini.range.max = tMax; return; }
  const play = h('button', { class: 'pill small primary', type: 'button', onclick: () => setPlaying(!S.playing) }, S.playing ? 'Pause' : 'Play');
  const clockEl = h('span', { class: 'clock', style: { minWidth: '112px', font: '600 13px/1 var(--font-ui)', color: 'var(--pc-strong)' } }, T.clock.textContent);
  const range = h('input', { type: 'range', min: 0, max: tMax, step: 1, value: T.range.value, 'aria-label': 'Time across both days', style: { flex: '1 1 auto', minWidth: 0, accentColor: 'var(--pc-head)' }, oninput: ev => setTime(+ev.target.value, { snap: true }) });
  const up = h('button', { class: 'pill small', type: 'button', onclick: () => card.scrollIntoView({ behavior: 'smooth', block: 'start' }) }, 'Back to the canal');
  const el = h('div', { class: 'mini', 'aria-label': 'Time controls' }, h('div', { class: 'miniin' }, play, clockEl, range, up));
  document.body.append(el);
  T.mini = { el, play, clock: clockEl, range };
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { el.classList.toggle('on', !es[0].isIntersecting && es[0].boundingClientRect.top < 0); }, { threshold: 0.05 }).observe(card);

document.addEventListener('keydown', ev => {
  const tag = (ev.target && ev.target.tagName) || '';
  if (tag === 'INPUT' && ev.target.type !== 'range') return;
  if (tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (ev.code === 'Space' && tag !== 'BUTTON') { ev.preventDefault(); setPlaying(!S.playing); }
  else if (ev.code === 'ArrowRight' && tag !== 'INPUT') { ev.preventDefault(); setTime(S.t + (ev.shiftKey ? 60 : 5), { snap: true }); }
  else if (ev.code === 'ArrowLeft' && tag !== 'INPUT') { ev.preventDefault(); setTime(S.t - (ev.shiftKey ? 60 : 5), { snap: true }); }
});

// ============================================================================ Gantt: locks, keepers and a table
const gantt = (function () {
  let host, labelsEl, scrollEl, svgHost, scale = null, playhead = null, dims = null;
  const ROW = 30, AXIS = 36, LABEL = 74;

  function buildScale(zoom, availW) {
    const A = S.A, W = A.windows;
    const pieces = [];
    let prev = 0;
    W.forEach((w, i) => { if (w[0] > prev) pieces.push({ t0: prev, t1: w[0], night: true }); pieces.push({ t0: w[0], t1: w[1], night: false, win: i }); prev = w[1]; });
    if (prev < tMax) pieces.push({ t0: prev, t1: tMax, night: true });
    let use = pieces, chartW;
    if (zoom === 'all') {
      const nightsPx = pieces.filter(p => p.night).reduce((s, p) => s + (p.t0 === 0 || p.t1 === tMax ? 10 : 30), 0);
      chartW = Math.max(availW - LABEL - 8, 720);
      const dayMin = pieces.filter(p => !p.night).reduce((s, p) => s + (p.t1 - p.t0), 0);
      const ppm = (chartW - nightsPx) / dayMin;
      let x = 0;
      for (const p of use) { p.x0 = x; p.w = p.night ? (p.t0 === 0 || p.t1 === tMax ? 10 : 30) : (p.t1 - p.t0) * ppm; x += p.w; }
      chartW = x;
    } else {
      const k = +zoom.slice(1);
      const w = W[Math.min(k, W.length - 1)];
      use = [{ t0: Math.max(0, w[0] - 30), t1: Math.min(tMax, w[1] + 30), night: false, x0: 0 }];
      chartW = Math.max(availW - LABEL - 8, (use[0].t1 - use[0].t0) * 1.9);
      use[0].w = chartW;
      use[0].part = true;
    }
    const xOf = t => {
      for (const p of use) if (t >= p.t0 && t <= p.t1) return p.x0 + (t - p.t0) / (p.t1 - p.t0) * p.w;
      return t < use[0].t0 ? 0 : chartW;
    };
    const tOf = x => {
      for (const p of use) if (x >= p.x0 && x <= p.x0 + p.w) return p.t0 + (x - p.x0) / p.w * (p.t1 - p.t0);
      return x < 0 ? use[0].t0 : use[use.length - 1].t1;

  function opLabel(o, w, A) {
    if (o.empty) return w >= 44 ? 'empty turn' : '';

    const full = arrow + names.join(' + ');
    if (w >= full.length * 5.3 + 8) return full;
    const short = arrow + names.map(n => n.split(' ')[0].slice(0, 5)).join('+');

  function opTip(o) {

    const boats = o.boats.length ? o.boats.map(id => esc(A.nameOf(id))).join(' + ') : 'no boats: an empty turn to get the chamber ready';
    const water = o.dir === 'up' ? `Takes ${L.volume} units from Pool ${o.lock}.` : `Sends ${L.volume} units down into Pool ${o.lock - 1}.`;
    return `<span class="h">Lock ${o.lock} · ${dirTxt}</span>${boats}<br><b>${hm(o.start)}–${hm(o.end)}</b> (${o.dur} min) · keeper ${esc(A.keeperName(o.keeper))}<br>${water}`;

  function render() {

    scale = buildScale(S.ganttZoom, availW);
    const rows = S.ganttView === 'keepers' ? A.canal.keepers.map(k => ({ key: 'k' + k.id, label: k.name, sub: 'Lockkeeper', keeper: k })) : Array.from({ length: nL }, (_, i) => ({ key: 'l' + (i + 1), label: 'Lock ' + (i + 1), lock: i + 1 }));

    labelsEl.replaceChildren(...rows.map((r, i) => h('div', { style: { position: 'absolute', top: (AXIS + i * ROW) + 'px', height: ROW + 'px', lineHeight: ROW + 'px', left: 0, width: LABEL + 'px', paddingLeft: '10px', fontSize: '12px', fontWeight: 600, color: 'var(--pc-body)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }, text: r.label })));
    const svg = sv('svg', { width: scale.chartW + 8, height, viewBox: `0 0 ${scale.chartW + 8} ${height}`, role: 'img', 'aria-label': 'Gantt chart of every lock operation across both days' });
    svg.append(sv('defs', null,
      sv('pattern', { id: 'ganttHatch', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, sv('rect', { width: 1.6, height: 6, style: 'fill:var(--op-fill)' })),
      sv('pattern', { id: 'ganttNight', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, sv('rect', { width: 1.5, height: 6, style: 'fill:var(--pc-line2);opacity:.7' })),

      const r = sv('rect', { x: x0, y: AXIS + i * ROW + 2, width: Math.max(2, x1 - x0), height: ROW - 4, fill: 'url(#ganttClosed)', opacity: 0.55 });

    }

          h('h3', null, 'The rules, briefly'),
          h('dl', null,
            h('dt', null, 'An operation'), h('dd', null, `One lock changing level once: a fill (${rng(fills)} min) takes boats up, an emptying (${rng(empties)} min) takes them down. With boats aboard add ${c.enter_minutes} min to enter (${c.enter_minutes_with_barge} for a barge) and ${c.exit_minutes} to leave.`),
            h('dt', null, 'An empty turn'), h('dd', null, 'An operation with no boats, only to put the chamber in the right state for the next boat. After a fill the chamber is full and must be emptied before it can fill again.'),
            h('dt', null, 'Room in the chamber'), h('dd', null, `${c.chamber_slots} slots: two narrowboats can share a chamber; a barge takes the whole of it.`),
            h('dt', null, 'Opening hours'), h('dd', null, `Locks work only ${w.map(x => clock(x[0]) + '–' + hm(x[1])).join(' and ')}, and never during a maintenance closure. Boats may cross pools at night.`),
            h('dt', null, 'The score'), h('dd', null, 'A boat is late by the minutes between its deadline and the end of its last lock operation; that lateness counts once per priority point (a doctor’s launch counts three times a holiday boat). Lower total wins; water drawn by fills breaks ties.')))));
  }
  return { build };
})();

// ============================================================================ page assembly
(function init() {
  const app = document.getElementById('app');
  S.orig = { canal: DATA.canal, schedule: DATA.schedule, A: analyse(DATA.canal, DATA.schedule) };
  if (!S.orig.A.valid) {
    app.append(h('div', { class: 'wrap' }, h('h1', null, 'The Lockkeeper’s Ledger'), h('p', { class: 'read' }, 'The schedule shipped with this page does not pass the rules, so it cannot be shown. First errors:'), h('pre', { class: 'mono' }, S.orig.A.errors.slice(0, 5).join('\n'))));
    return;
  }
  S.A = S.orig.A; S.canal = S.orig.canal; S.schedule = S.orig.schedule;
  applyMode(initialMode());

  // ---- skeleton
  const lede = h('p', { class: 'lede' });
  const modeBtn = h('button', { class: 'pill', type: 'button', 'aria-pressed': 'false', title: 'Switch between the night and day look', onclick: () => { applyMode(S.mode === 'day' ? 'night' : 'day'); modeBtn.textContent = S.mode === 'day' ? 'Night look' : 'Day look'; canalView.update(S.t); gantt.refresh(); } }, S.mode === 'day' ? 'Night look' : 'Day look');
  const banner = h('div', { class: 'banner', hidden: true });
  const scoreEl = h('section', { class: 'score', 'aria-label': 'Score' });
  const canalHost = h('div', { class: 'canalscroll' });
  const legend = h('div', { class: 'legendrow' });
  const transport = h('div', { class: 'transport' });
  const canalCard = h('section', { class: 'canalcard', 'aria-label': 'The canal, animated' }, canalHost, h('div', { class: 'canalhint' }, 'Swipe sideways to follow the whole canal.'), legend, transport);
  const tabDefs = [['gantt', 'Timeline'], ['delays', 'Delays explained'], ['disrupt', 'What if…'], ['guide', 'How a lock works']];
  const tabsEl = h('div', { class: 'tabs', role: 'tablist', 'aria-label': 'Views' });
  const panels = {};
  for (const [id, label] of tabDefs) {
    tabsEl.append(h('button', { class: 'tab', role: 'tab', id: 'tab-' + id, 'aria-controls': 'panel-' + id, 'aria-selected': 'false', type: 'button', onclick: () => setTab(id) }, label));
    panels[id] = h('section', { class: 'panel', role: 'tabpanel', id: 'panel-' + id, 'aria-labelledby': 'tab-' + id, hidden: true });
  }
  const built = {};
  function setTab(id) {
    S.tab = id;
    for (const [tid] of tabDefs) { panels[tid].hidden = tid !== id; $('#tab-' + tid).setAttribute('aria-selected', tid === id ? 'true' : 'false'); }
    if (!built[id]) {
      built[id] = true;
      ({ gantt: () => gantt.build(panels.gantt), delays: () => delays.build(panels.delays), disrupt: () => disrupt.build(panels.disrupt), guide: () => guide.build(panels.guide) })[id]();
    }
    if (id === 'gantt') gantt.refresh();
  }
  tabsEl.addEventListener('keydown', ev => {
    const i = tabDefs.findIndex(([id]) => id === S.tab);
    if (ev.key === 'ArrowRight') { setTab(tabDefs[(i + 1) % tabDefs.length][0]); $('#tab-' + S.tab).focus(); }
    if (ev.key === 'ArrowLeft') { setTab(tabDefs[(i + tabDefs.length - 1) % tabDefs.length][0]); $('#tab-' + S.tab).focus(); }
  });

  app.append(h('div', { class: 'wrap' },
    h('header', { class: 'top' },
      h('div', null, h('div', { class: 'eyebrow' }, 'The Wendle Navigation · two days'), h('h1', { style: { margin: '6px 0 0' } }, 'The Lockkeeper’s Ledger'), lede),
      h('div', { class: 'top-actions' }, modeBtn)),
    banner, scoreEl, canalCard, tabsEl, ...tabDefs.map(([id]) => panels[id])));
  document.body.append(tipEl);

  // ---- pieces that depend on the plan being shown
  function renderScore() {
    const sc = S.A.score, o = S.orig.A.score, showDelta = S.viewing === 'replan';
    const tiles = [
      ['Weighted lateness', fmtNum(sc.weighted_lateness), 'min × priority', showDelta ? [o.weighted_lateness, sc.weighted_lateness] : null],
      ['Late boats', `${sc.late_boats}`, `of ${sc.boats}`, showDelta ? [o.late_boats, sc.late_boats] : null],
      ['Water drawn', fmtNum(sc.water_drawn), 'units', showDelta ? [o.water_drawn, sc.water_drawn] : null],
      ['Operations', fmtNum(sc.operations), '', showDelta ? [o.operations, sc.operations] : null],
      ['Empty turns', fmtNum(sc.empty_turns), `of ${sc.operations}`, showDelta ? [o.empty_turns, sc.empty_turns] : null],
    ];
    scoreEl.replaceChildren(...tiles.map(([k, v, small, d]) => h('div', { class: 'tile' }, h('div', { class: 'k' }, k), h('div', { class: 'v' }, v, small ? h('small', null, small) : null),
      h('div', { class: 'd' + (d && d[1] > d[0] ? ' worse' : d && d[1] < d[0] ? ' better' : '') }, d ? `original ${fmtNum(d[0])} (${d[1] === d[0] ? 'same' : (d[1] > d[0] ? '+' : '−') + fmtNum(Math.abs(d[1] - d[0]))})` : ''))));
    tiles.forEach((t, i) => { scoreEl.children[i].title = ['Sum over boats of priority × minutes finished after the deadline. Lower is better.', 'Boats that finished after their deadline.', 'Total volume taken out of pools by fills (the tie-break).', 'Lock operations in the schedule.', 'Operations without boats, only to reset a chamber.'][i]; });
  }
  function renderLede() {
    const c = S.A.canal;
    lede.replaceChildren(h('b', null, `${c.keepers.length} lockkeepers worked ${c.locks.length} locks for two days to move ${c.boats.length} boats.`), ' ' + delays.conclusion());
  }
  function renderBanner() {
    if (S.viewing !== 'replan' || !S.replan) { banner.hidden = true; return; }
    const d = describeDisruption(S.replan.disruption);
    banner.hidden = false;
    banner.replaceChildren(h('span', null, h('b', null, 'Showing the re-planned schedule.'), ' ' + d), h('button', { class: 'pill small', type: 'button', onclick: () => setPlan('original') }, 'Back to the original plan'));
  }
  function describeDisruption(dis) {
    const p = [];
    for (const c of dis.closures) p.push(`Lock ${c.lock} closed ${dayLabel(c.from)} ${hm(c.from)}–${hm(c.to)}`);
    for (const id of Object.keys(dis.delays)) { const b = S.orig.A.boats.find(x => x.id === +id); p.push(`${b ? b.name : 'boat ' + id} released ${dis.delays[id]} min late`); }
    return p.join('; ') + '.';
  }
  function renderLegend() {
    legend.replaceChildren(h('span', { class: 'lab' }, 'a dot over a waiting boat'),
      ...CAUSES.map(c => h('span', null, h('i', { class: 'sw dot', 'data-cause': c.group, style: { background: `var(${c.css})` } }), c.label)),
      h('span', { style: { marginLeft: 'auto' } }, 'dots on a hull = priority · terracotta hull = past its deadline'));
  }

  onPlanChange(() => {
    canalView.build(canalHost);
    buildBand();
    renderScore(); renderLede(); renderBanner(); renderLegend();
    if (built.gantt) gantt.refresh();
    if (built.delays) delays.refresh();
    if (built.disrupt) disrupt.onPlanChange();
    setTime(S.t, { snap: true });
  });
  selectionHooks.push(() => { canalView.update(S.t); if (built.gantt) gantt.refresh(); if (built.delays) delays.onSelect(); });
  timeHooks.push(t => { if (built.gantt) gantt.onTime(t); if (built.delays) delays.onTime(t); });

  // ---- first paint
  canalView.build(canalHost);
  buildTransport(transport);
  renderScore(); renderLede(); renderLegend();
  setTab('gantt');
  setTime(S.A.windows[0][0], { snap: true });
  let rz = null;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (built.gantt && S.tab === 'gantt') gantt.refresh(); }, 150); });
  requestAnimationFrame(loop);
  window.__ledger = { S, setTime, setPlaying, setTab, selectBoat, canalView, gantt };   // handy for tests and for poking around in the console
})();

})();</script>
