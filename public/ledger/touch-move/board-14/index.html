<style>
:root{
  --table:#2a1e15; --table2:#3b2a1c; --lamp:#f2d49b;
  --text:#e8d6b4; --muted:#b89f80; --faint:#8a7458;
  --ink:#1f3a5f; --last:rgba(255,213,138,.34); --check:rgba(255,154,98,.55);
  --dot:rgba(58,39,22,.30); --dot-d:rgba(232,210,166,.30);
  --gut:16px;
}
*{box-sizing:border-box}
html{background:var(--table)}
body{
  margin:0; min-height:100vh; color:var(--text);
  font:16px/1.45 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  background:
    radial-gradient(120% 80% at 38% 22%, rgba(242,212,155,.13), rgba(242,212,155,0) 60%),
    repeating-linear-gradient(91deg, rgba(0,0,0,.05) 0 2px, rgba(0,0,0,0) 2px 7px),
    linear-gradient(180deg,#33251a,#21170f);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
main{
  max-width:1180px; margin:0 auto; padding:28px var(--gut) 56px;
  display:grid; gap:28px 40px; grid-template-columns:minmax(0,560px) minmax(0,1fr); align-items:start;
}
.play{display:flex; flex-direction:column; gap:14px; min-width:0}

/* the clock */
.clock{width:min(100%,440px); margin:0 auto 2px; display:block}
.clock svg{display:block; width:100%; height:auto; overflow:visible}

/* the board */
.board{position:relative; width:100%; aspect-ratio:1/1; user-select:none; -webkit-user-select:none;
  touch-action:none; border-radius:3px; box-shadow:0 18px 40px rgba(0,0,0,.55), 0 2px 0 rgba(255,236,200,.06) inset}
.board>.wood{position:absolute; inset:0; width:100%; height:100%; display:block; border-radius:3px}
.sqs{position:absolute; left:2.381%; top:2.381%; width:95.238%; height:95.238%}
.sq,.pc,.mk{position:absolute; width:12.5%; height:12.5%}
.sq.last{background:var(--last)}
.sq.chk{background:radial-gradient(circle, var(--check) 0 38%, rgba(255,154,98,0) 70%)}
.mk::after{content:""; position:absolute; left:41%; top:41%; width:18%; height:18%; border-radius:50%; background:var(--dot)}
.mk.d::after{background:var(--dot-d)}
.mk.cap::after{left:8%; top:8%; width:84%; height:84%; background:none; border:3px solid var(--dot); box-sizing:border-box}
.mk.cap.d::after{border-color:var(--dot-d)}
.pc{pointer-events:none; transition:left .38s cubic-bezier(.3,.1,.25,1), top .38s cubic-bezier(.3,.1,.25,1), opacity .3s, transform .5s}
.pc img{width:100%; height:100%; display:block; filter:drop-shadow(2px 4px 3px rgba(0,0,0,.45))}
.pc.lift{transition:none; z-index:5; transform:scale(1.08)}
.pc.lift img{filter:drop-shadow(5px 10px 6px rgba(0,0,0,.45))}
.pc.gone{opacity:0}
.pc.tip{transform:rotate(-84deg) translate(-8%,18%)}
.pc.touched img{filter:drop-shadow(2px 4px 3px rgba(0,0,0,.45)) drop-shadow(0 0 5px rgba(255,200,112,.55))}
.co{position:absolute; font:600 10px/1 Georgia,serif; pointer-events:none; opacity:.9}
.co.f{bottom:3%; right:5%} .co.r{top:4%; left:5%}

/* the line under the board */
.line{min-height:1.6em; color:var(--muted); font-size:15px; letter-spacing:.01em; word-spacing:.06em; padding:0 2px}
.line .res{color:var(--text); margin-left:.4em}
.row{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:0 2px; min-height:28px}
button.quiet{appearance:none; background:none; border:0; padding:4px 0; margin:0; color:var(--faint);
  font:inherit; font-size:14px; letter-spacing:.04em; cursor:pointer; text-decoration:underline;
  text-decoration-color:rgba(184,159,128,.35); text-underline-offset:3px}
button.quiet:hover,button.quiet:focus-visible{color:var(--text); outline:none}
button.quiet[hidden]{display:none}
#again{color:var(--text)}

/* the score sheet */
.sheet{position:relative; margin:0; width:100%; max-width:600px; justify-self:center; cursor:zoom-in;
  transform:rotate(.6deg); box-shadow:0 22px 44px rgba(0,0,0,.55), 0 3px 8px rgba(0,0,0,.35)}
.sheet img{display:block; width:100%; height:auto}
.sheet .patch{position:absolute; left:11.1667%; top:82.4572%; width:20.5833%; height:4.3709%;
  clip-path:inset(0 100% 0 0); transition:clip-path 0s}
.sheet.big{position:fixed; z-index:20; inset:0; max-width:none; transform:none; overflow:auto; cursor:zoom-out;
  background:rgba(12,8,5,.92); padding:16px; box-shadow:none}
.sheet.big .paper{position:relative; width:min(1200px,100%); margin:0 auto}
.paper{position:relative}

noscript p,.static-note{color:var(--muted)}

@media (max-width:900px){
  main{grid-template-columns:minmax(0,1fr); padding-top:18px; gap:22px}
  .play{max-width:560px; width:100%; justify-self:center}
  .sheet{max-width:560px}
}
@media (max-width:420px){ .co{font-size:8px} .line{font-size:14px} }
@media (prefers-reduced-motion:reduce){ .pc{transition:none} }
</style>
