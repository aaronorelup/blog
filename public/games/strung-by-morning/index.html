<script>
/* Strung by Morning. One night in a small repair shop, made to be played once.
   Everything is drawn and synthesised in this file: no images, no audio files, no requests.

/* ================= palette ================= */
const PAGE = '#101220';

/* ================= setup ================= */
const QS = new URLSearchParams(location.search);

  const f = (e) => { REDUCED = e.matches; };

}

const BEATS = ['note', 'clock', 'rain', 'kettle', 'moth', 'answer', 'birds', 'silence', 'ending'];

/* music: 76 bpm, steps are eighth notes, one loop is four bars */
const BPM = 76, STEP = 60 / BPM / 2, LOOP = 32;
const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);
const OPEN = [38, 45, 50, 55, 57, 62];                       // D A D G A D, string 6 first
const SCALE = [57, 59, 62, 64, 66, 69, 71, 74, 76, 78, 81];  // D major pentatonic, A3 up
const RAIN_STEPS = [0, 3, 6, 9, 11, 14, 16, 19, 22, 25, 27, 30];
const RAIN_SET = new Set(RAIN_STEPS);
const RAIN_FRETS = [0, 2, 5, 7, 9, 12];
const RAIN_DEF = [5, 5, 7, 9, 7, 5, 2, 5, 7, 5, 2, 0];
const KETTLE_P = [50, 52, 57, 50];
const BIRD_P = [74, 78, 81, 76, 83];
const BIRD_DEF = [3, 10, 14, 21, 28];
const ALL_PITCH = [38, 45, 47, 50, 52, 54, 55, 57, 59, 62, 64, 66, 69, 71, 74, 76, 78, 81];

/* ================= saved state ================= */
function blank() {
  return { v: 1, beat: 0, done: false, date: '', muted: false,
    layers: { clock: [], rain: [], kettle: [], moth: [], answer: [], birds: [] }, line: [], birds: BIRD_DEF.slice() };
}
let S = blank();
function loadSave() {
  if (FRESH) return;
  try {
    const raw = window.localStorage.getItem(KEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    if (!o || o.v !== 1 || typeof o.layers !== 'object') return;
    const b = blank();
    b.beat = clamp(o.beat | 0, 0, BEATS.length - 1);
    b.done = !!o.done; b.date = typeof o.date === 'string' ? o.date.slice(0, 40) : ''; b.muted = !!o.muted;
    for (const L of LAYERS) {
      const arr = Array.isArray(o.layers[L]) ? o.layers[L] : [];
      b.layers[L] = arr.filter((n) => n && n.s >= 0 && n.s < LOOP && n.p > 20 && n.p < 110).slice(0, 64)

    }
    if (Array.isArray(o.line)) b.line = o.line.filter((p) => Array.isArray(p) && isFinite(p[0]) && isFinite(p[1])).slice(0, 200).map((p) => [+p[0], +p[1]]);

}

const timers = [];
function after(off, fn) { timers.push({ t: G.t + off, fn }); }
function runTimers() {
  for (let i = 0; i < timers.length; i++) {
    if (timers[i].t <= G.t) { const f = timers[i].fn; timers.splice(i, 1); i--; f(); }
  }

/* ================= sound ================= */
const A = { ctx: null, ok: false, muted: false, base: 0, g0: 0, bufs: {}, queue: [], rainLevel: 0 };
const SP = SPEED;

function aTime(off) { return Math.max(A.ctx.currentTime + 0.004, A.base + (G.t + off - A.g0) / SP); }
function syncAudioClock() {
  if (!A.ok) return;
  const want = A.ctx.currentTime + 0.03, have = A.base + (G.t - A.g0) / SP, err = have - want;

function audioInit() {
  if (A.ctx) { if (A.ctx.state !== 'running' && A.ctx.resume) A.ctx.resume().catch(() => {}); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

    /* on phones with the ringer switched off, ask for the kind of audio session that still plays */
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* not offered here */ }
    const c = A.ctx = new AC();
    A.master = c.createGain(); A.master.gain.value = A.muted ? 0 : 0.9;
    A.comp = c.createDynamicsCompressor();
    A.comp.threshold.value = -10; A.comp.knee.value = 6; A.comp.ratio.value = 16; A.comp.attack.value = 0.003; A.comp.release.value = 0.22;
    A.master.connect(A.comp); A.comp.connect(c.destination);
    A.bus = c.createGain(); A.bus.gain.value = 0.9; A.bus.connect(A.master);
    A.rev = c.createConvolver(); A.rev.buffer = makeImpulse(c);
    A.revOut = c.createGain(); A.revOut.gain.value = 0.85; A.rev.connect(A.revOut); A.revOut.connect(A.master);
    A.noise = makeNoise(c, 2);
    A.ok = true; A.base = c.currentTime; A.g0 = G.t;
    A.queue = ALL_PITCH.slice();
    if (c.state !== 'running' && c.resume) c.resume().catch(() => {});
  } catch (e) { A.ok = false; }
}
function makeNoise(c, sec) {
  const n = Math.floor(c.sampleRate * sec), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;

}
function makeImpulse(c) {
  const sr = c.sampleRate, n = Math.floor(sr * 2.6), b = c.createBuffer(2, n, sr), pre = Math.floor(sr * 0.012);

/* Karplus and Strong: a burst of noise goes round a tuned delay and wears smooth, like a plucked string */
function ksRender(midi) {

  const dur = midi < 48 ? 7 : midi < 60 ? 6 : midi < 72 ? 4.6 : 3.4;

  return b;
}

  if (!A.live()) return;
