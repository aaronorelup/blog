<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Show Me Once</title>
<meta name="description" content="A small night game. A little creature can learn anything, but only by watching you do it once. About twelve minutes, meant to be played one time.">
<meta name="theme-color" content="#101220">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101220'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23E2795C' opacity='.28'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23E2795C'/%3E%3C/svg%3E">
<style>
:root {
  --night: #101220; --land: #201F2C; --gold: #F0C06A; --cream: #F2E7D5; --coral: #E2795C;
  --body: #C9BCA9; --soft: #9C917F;
  --sans: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", Quicksand, Seravek, "Gill Sans Nova", Ubuntu, Calibri, "DejaVu Sans", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: var(--night); color: var(--body); overflow: hidden;
  overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: none;
}
body { position: fixed; top: 0; right: 0; bottom: 0; left: 0; font-family: var(--sans); }
#c { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#c.kbd:focus { outline: 2px solid var(--gold); outline-offset: -6px; }
#shade { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; background: radial-gradient(ellipse 78% 78% at 50% 52%, rgba(8, 9, 16, 0) 52%, rgba(8, 9, 16, .5) 100%); }
#cap {
  position: absolute; left: 50%; top: 0; transform: translateX(-50%); margin: 0; width: min(88vw, 30em);
  padding-top: max(calc(env(safe-area-inset-top) + 50px), 9vh); text-align: center;
  font-size: clamp(18px, calc(11px + 2vmin), 30px); line-height: 1.32; letter-spacing: .012em; color: var(--body);
  text-wrap: balance; pointer-events: none; opacity: 0; text-shadow: 0 1px 14px rgba(16, 18, 32, .95), 0 0 3px rgba(16, 18, 32, .9);
}
#chips {
  position: absolute; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; justify-content: center;
  gap: clamp(7px, 2.2vw, 16px); padding: 0 8px; pointer-events: none; opacity: 0; transform: translateY(14px);
  transition: opacity .45s ease, transform .45s ease; visibility: hidden;
}
#chips.on { opacity: 1; transform: none; pointer-events: auto; visibility: visible; }
.chip {
  -webkit-appearance: none; appearance: none; font: inherit; color: var(--body); margin: 0;
  background: rgba(28, 27, 40, .9); border: 1.5px solid var(--coral); border-radius: 16px; padding: 6px 6px 5px;
  display: grid; justify-items: center; gap: 3px; cursor: pointer; touch-action: manipulation;
  transition: transform .16s ease, border-color .25s ease, opacity .3s ease, box-shadow .25s ease;
  box-shadow: 0 6px 22px rgba(0, 0, 0, .35);
}
.chip[hidden] { display: none; }
.chip canvas { width: clamp(50px, 15vw, 70px); height: clamp(50px, 15vw, 70px); display: block; pointer-events: none; }
.chip span { font: 500 11px/1.2 var(--mono); letter-spacing: .05em; color: var(--soft); }
.chip:hover { transform: translateY(-2px); }
.chip:active { transform: scale(.95); }
.chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.chip[aria-disabled="true"] { opacity: .42; border-color: #4a4658; cursor: default; transform: none; }
.chip.used[aria-disabled="true"] { opacity: .62; border-color: var(--gold); }
.chip.hint { animation: hint 1.1s ease-in-out infinite; }
.chip.no { animation: no .36s ease; }
@keyframes hint { 50% { box-shadow: 0 0 0 7px rgba(226, 121, 92, .3), 0 6px 22px rgba(0, 0, 0, .35); transform: translateY(-4px); } }
@keyframes no { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
#mute {
  position: absolute; top: max(6px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right)); width: 44px; height: 44px;
  border: 0; padding: 10px; background: none; color: var(--soft); border-radius: 50%; cursor: pointer; opacity: .7;
  transition: opacity .2s ease, color .2s ease;
}
#mute:hover { opacity: 1; color: var(--body); }
#mute:focus-visible { outline: 2px solid var(--gold); outline-offset: -5px; opacity: 1; }
#mute svg { width: 24px; height: 24px; display: block; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#mute .off { display: none; }
#mute[aria-pressed="true"] .on { display: none; }
#mute[aria-pressed="true"] .off { display: inline; }
#end, #ret {
  position: absolute; left: 0; right: 0; bottom: max(22px, env(safe-area-inset-bottom)); margin: 0; padding: 0 18px; text-align: center;
  font-size: clamp(13px, calc(10px + .8vmin), 16px); line-height: 1.6; color: var(--soft); opacity: 0; visibility: hidden;
  transition: opacity 1.8s ease, visibility 0s linear 1.8s; -webkit-user-select: text; user-select: text;
}
#end.on, #ret.on { opacity: 1; visibility: visible; transition: opacity 1.8s ease; }
#end p, #ret p { margin: 0; }
#end a { color: var(--body); text-decoration: underline; text-decoration-color: rgba(201, 188, 169, .45); text-underline-offset: 3px; display: inline-block; padding: 8px 6px; }
#end a:hover { color: var(--cream); text-decoration-color: var(--gold); }
#ret button {
  font: inherit; color: var(--soft); background: none; border: 0; padding: 10px 8px; cursor: pointer; text-decoration: underline;
  text-decoration-color: rgba(156, 145, 127, .5); text-underline-offset: 3px; border-radius: 6px;
}
#ret button:hover { color: var(--body); }
#ret #yes { color: var(--coral); }
#end a:focus-visible, #ret button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; border-radius: 6px; }
noscript p { position: absolute; left: 0; right: 0; bottom: 40%; text-align: center; padding: 0 20px; }
@media (prefers-reduced-motion: reduce) {
  .chip.hint { animation: none; box-shadow: 0 0 0 6px rgba(226, 121, 92, .42); }
  .chip.no { animation: none; }
  #chips, .chip, #end, #ret { transition-duration: .01s; }
}
</style>
</head>
<body>
<canvas id="c" tabindex="0" role="application" aria-label="Show Me Once, a small game. A little creature in a night landscape learns from what you show it. Space or Enter taps and holds. Hold Space and press the arrow keys to draw. Keys 1 to 4 pick a move. M mutes the sound."></canvas>
<div id="shade" aria-hidden="true"></div>
<p id="cap" aria-live="polite"></p>
<div id="chips" role="group" aria-label="Moves it has learned from you"></div>
<button id="mute" type="button" aria-pressed="false" aria-label="Mute sound" title="Mute (M)">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z"/><path class="on" d="M15.4 9.2a4 4 0 0 1 0 5.6M17.9 6.6a7.6 7.6 0 0 1 0 10.8"/><path class="off" d="M16 9.6l4.6 4.8M20.6 9.6L16 14.4"/></svg>
</button>
<div id="end"><p>Designed and built by Claude, at Aaron's request.</p><p><a href="/projects/">Back to Aaron's projects</a></p></div>
<div id="ret"><p id="ask1"><button id="forget" type="button">forget everything and begin again</button></p><p id="ask2" hidden>Forget all of it and start from the first dot? <button id="yes" type="button">Yes, forget</button> <button id="no" type="button">No, keep it</button></p></div>
<noscript><p>This little game needs JavaScript to run.</p></noscript>
<script>
(() => {
'use strict';

/* ================================================================== basics */
const $ = (id) => document.getElementById(id);
const canvas = $('c'), X = canvas.getContext('2d');
const capEl = $('cap'), chipsEl = $('chips'), muteEl = $('mute'), endEl = $('end'), retEl = $('ret');
const Q = new URLSearchParams(location.search);
const TS = Math.min(20, Math.max(1, parseFloat(Q.get('t')) || 1));   // ?t= multiplies the game clock (tests)
const FRESH = Q.get('fresh') === '1';                                 // ?fresh=1 ignores and never writes the save
const KEY = 'ao.show-me-once.v1';
const mqRM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
let RM = !!(mqRM && mqRM.matches);
if (mqRM && mqRM.addEventListener) mqRM.addEventListener('change', (e) => { RM = e.matches; });

const COL = { night: '#101220', land: '#201F2C', gold: '#F0C06A', cream: '#F2E7D5', coral: '#E2795C', body: '#C9BCA9', soft: '#9C917F', ink: '#1B1A28' };
const { PI, sin, cos, abs, min, max, floor, ceil, round, sqrt, atan2, exp, hypot, pow, log } = Math;
const TAU = PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const E = {
  lin: (t) => t,
  io: (t) => (t < 0.5 ? 2 * t * t : 1 - pow(-2 * t + 2, 2) / 2),
  out: (t) => 1 - pow(1 - t, 3),
  in: (t) => t * t * t,
  back: (t) => { const c = 1.70158; return 1 + (c + 1) * pow(t - 1, 3) + c * pow(t - 1, 2); },
  el: (t) => (t <= 0 ? 0 : t >= 1 ? 1 : pow(2, -9 * t) * sin((t * 10 - 0.75) * (TAU / 3)) + 1),
};
const hash = (n) => { const s = sin(n * 127.1 + 311.7) * 43758.5453; return s - floor(s); };
const rnd = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const hexRGB = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (h, a) => { const c = hexRGB(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
const mix = (h1, h2, t) => { const a = hexRGB(h1), b = hexRGB(h2); return `rgb(${round(lerp(a[0], b[0], t))},${round(lerp(a[1], b[1], t))},${round(lerp(a[2], b[2], t))})`; };

/* ================================================================== save */
const store = {
  load() {
    if (FRESH) return null;
    try { const s = window.localStorage.getItem(KEY); if (!s) return null; const o = JSON.parse(s); return o && o.v === 1 && o.g ? o : null; } catch (e) { return null; }
  },
  save() {
    if (FRESH) return;
    try { window.localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* private mode, full disk: play on */ }
  },
  clear() { try { window.localStorage.removeItem(KEY); } catch (e) { /* nothing to clear */ } },
};
const blank = () => ({ v: 1, beat: 0, done: false, muted: false, g: {} });
let S = store.load() || blank();
let G = S.g;                         // the gestures: stroke, taps, hold, mark, trace, line

/* ================================================================== view */
let W = 1, H = 1, DPR = 1, SC = 1, VW = 360, VH = 560, GA = 0.66, resCap = 2, slow = 0;
const cam = { x: 0, y: 0, z: 1, fx: null, oy: 0, lead: 0.14, jump: false };
function resize() {
  W = max(1, window.innerWidth); H = max(1, window.innerHeight);
  DPR = min(resCap, window.devicePixelRatio || 1);
  canvas.width = round(W * DPR); canvas.height = round(H * DPR);
  SC = min(W / 360, H / 560); VW = W / SC; VH = H / SC;
  GA = H > W * 1.15 ? 0.71 : 0.7;
}
const kz = () => SC * cam.z;
const w2s = (x, y) => [(x - cam.x) * kz() + W / 2, (y - cam.y) * kz() + H * GA];
const s2w = (sx, sy) => [(sx - W / 2) / kz() + cam.x, (sy - H * GA) / kz() + cam.y];

/* ================================================================== clock, tasks, tweens */
let clock = 0, lastNow = 0, lastWall = 0, uiT = 0;
const tasks = [];                    // running generator scripts, each stepped with dt
const tweens = [];
const timers = [];                   // game-time callbacks {t, fn}
function spawn(gen) { tasks.push(gen); gen.next(0); return gen; }
function anim(o, k, to, dur, ef, delay) { tweens.push({ o, k, from: null, to, dur: max(0.0001, dur), t: -(delay || 0), ef: ef || E.io }); }
function later(t, fn) { timers.push({ t, fn }); }
function* wait(s) { let t = 0; while (t < s) t += yield; }
function* until(fn, cap) { let t = 0; while (!fn()) { t += yield; if (cap && t > cap) return false; } return true; }
function* tw(o, k, to, dur, ef) { const from = o[k]; let t = 0; ef = ef || E.io; while (t < dur) { t += yield; o[k] = lerp(from, to, ef(min(1, t / dur))); } o[k] = to; }
function stepCore(dt) {
  for (let i = 0; i < timers.length; i++) { const tm = timers[i]; if (tm.t <= clock) { timers.splice(i--, 1); tm.fn(); } }
  for (let i = 0; i < tweens.length; i++) {
    const w = tweens[i]; w.t += dt; if (w.t < 0) continue;
    if (w.from === null) w.from = w.o[w.k];
    const u = min(1, w.t / w.dur); w.o[w.k] = lerp(w.from, w.to, w.ef(u));
    if (u >= 1) tweens.splice(i--, 1);
  }
  for (let i = 0; i < tasks.length; i++) { if (tasks[i].next(dt).done) tasks.splice(i--, 1); }
}

/* ================================================================== gestures: frames, record, normalise, replay */
// A frame is an origin and two equal, perpendicular basis vectors. A stroke learned between two rings is stored in
// the frame of those rings (u along the line between them, v at a right angle, "up"), so it can be replayed into any
// other pair of anchors or any box: the same shape, the same timing.
function frameAB(ax, ay, bx, by) { const ux = bx - ax, uy = by - ay; return { ox: ax, oy: ay, ux, uy, vx: uy, vy: -ux, len: hypot(ux, uy) || 1 }; }
function frameBox(cx, cy, s) { return { ox: cx, oy: cy, ux: s, uy: 0, vx: 0, vy: -s, len: s }; }
function toF(F, x, y) { const dx = x - F.ox, dy = y - F.oy, d = F.len * F.len; return [(dx * F.ux + dy * F.uy) / d, (dx * F.vx + dy * F.vy) / d]; }
function fromF(F, u, v) { return [F.ox + u * F.ux + v * F.vx, F.oy + u * F.uy + v * F.vy]; }
const r3 = (n) => round(n * 1000) / 1000;
function plen(p) { let l = 0; for (let i = 1; i < p.length; i++) l += hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return l; }
function cumlen(p) { const c = [0]; for (let i = 1; i < p.length; i++) c.push(c[i - 1] + hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1])); return c; }
function thin(p, n) {                 // keep at most n points, never the wobble's corners: drop by distance
  if (p.length <= n) return p.slice();
  const c = cumlen(p), total = c[c.length - 1] || 1, out = [p[0]]; let next = total / (n - 1);
  for (let i = 1; i < p.length - 1; i++) if (c[i] >= next) { out.push(p[i]); next = c[i] + total / (n - 1); }
  out.push(p[p.length - 1]); return out;
}
function resample(p, n) {             // n points evenly along the path: [x, y]
  const c = cumlen(p), total = c[c.length - 1]; const out = []; let j = 1;
  if (total < 1e-6) { for (let i = 0; i < n; i++) out.push([p[0][0], p[0][1]]); return out; }
  for (let i = 0; i < n; i++) {
    const d = (total * i) / (n - 1);
    while (j < p.length - 1 && c[j] < d) j++;
    const seg = c[j] - c[j - 1] || 1, f = clamp((d - c[j - 1]) / seg, 0, 1);
    out.push([lerp(p[j - 1][0], p[j][0], f), lerp(p[j - 1][1], p[j][1], f)]);
  }
  return out;
}
function squeezeTime(p, maxPause, lo, hi) {    // p: [.., .., t]; start at 0, cap long pauses, scale the whole into [lo, hi]
  let t = 0, prev = p[0][2];
  for (const q of p) { const dt = clamp(q[2] - prev, 0, maxPause); prev = q[2]; t += dt; q[2] = t; }
  const k = t < lo ? lo / max(t, 1e-4) : t > hi ? hi / t : 1;
  if (t < 1e-4) p.forEach((q, i) => { q[2] = (lo * i) / max(1, p.length - 1); });
  else if (k !== 1) for (const q of p) q[2] *= k;
  return p[p.length - 1][2];
}
// A dot instead of a line: an arch that bows toward where they touched, with a little life in it.
function lifeArc(u0, v0, seed) {
  const bow = abs(v0) > 0.05 ? clamp(v0, -0.42, 0.42) : 0.17;
  const peak = clamp(u0, 0.3, 0.7), k = log(0.5) / log(peak), p = [];
  for (let i = 0; i <= 30; i++) {
    const s = i / 30, w = 0.011 * sin(s * 19 + seed * 9) * sin(PI * s);
    p.push([r3(s), r3(bow * sin(PI * pow(s, k)) + w), r3(1.7 * E.io(s))]);
  }
  return { p, d: 1.7, dot: 1 };
}
// The line they drew between the rings. Keeps every wobble and hesitation; makes sure it starts on one ring and
// ends on the other, runs left to right, and takes between 0.9 and 6 seconds.
function normStroke(raw, F) {
  let q = raw.map((p) => { const f = toF(F, p.x, p.y); return [f[0], f[1], p.t]; });
  const seed = (raw[0].x * 0.013 + raw[0].y * 0.017) % 1;
  if (q.length < 3 || plen(q) < 0.07) { let u = 0, v = 0; for (const p of q) { u += p[0]; v += p[1]; } return lifeArc(u / q.length, v / q.length, seed); }
  if (q[q.length - 1][0] < q[0][0]) { const t1 = q[q.length - 1][2]; q = q.reverse().map((p) => [p[0], p[1], t1 - p[2]]); }
  q = thin(q, 150);
  const d = squeezeTime(q, 1.2, 0.9, 6);
  const c = cumlen(q), total = c[c.length - 1], a = q[0], b = q[q.length - 1];
  const rawF = q.map((p) => [p[0], p[1]]);
  const out = q.map((p, i) => {
    const s = c[i] / total;
    let u = p[0] + (0 - a[0]) * (1 - s) + (1 - b[0]) * s, v = p[1] + (0 - a[1]) * (1 - s) + (0 - b[1]) * s;
    const av = abs(v); if (av > 0.6) v = Math.sign(v) * (0.6 + 0.35 * Math.tanh((av - 0.6) / 0.35));
    return [r3(u), r3(v), r3(p[2])];
  });
  return { p: out, d: r3(d), rawF };
}
// Four knocks. Floors and caps so that four taps in 50 ms, or a minute between two of them, still make a rhythm.
function normTaps(times) {
  const t = times.slice(0, 4); while (t.length < 4) t.push(t[t.length - 1] + (t.length > 1 ? t[t.length - 1] - t[t.length - 2] : 0.5));
  let iv = [t[1] - t[0], t[2] - t[1], t[3] - t[2]].map((v) => clamp(v, 0.02, 1.5));
  let sum = iv[0] + iv[1] + iv[2];
  if (sum < 0.9) { const k = 0.9 / sum; iv = iv.map((v) => v * k); }
  iv = iv.map((v) => max(0.17, v)); sum = iv[0] + iv[1] + iv[2];
  if (sum > 3.3) { const k = 3.3 / sum; iv = iv.map((v) => v * k); }
  return { t: [0, r3(iv[0]), r3(iv[0] + iv[1]), r3(iv[0] + iv[1] + iv[2])] };
}
function normHold(d) { return { d: r3(clamp(d, 0.5, 5)) }; }
// Anything drawn on the banner: fitted to a box of half-size 0.5, gaps between strokes shortened.
function normMark(strokes, F) {
  let all = [], out = [];
  for (const s of strokes) { const q = s.map((p) => { const f = toF(F, p.x, p.y); return [f[0], f[1], p.t]; }); if (q.length) { out.push(q); all = all.concat(q); } }
  if (!all.length) return defaultMark();
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of all) { x0 = min(x0, p[0]); x1 = max(x1, p[0]); y0 = min(y0, p[1]); y1 = max(y1, p[1]); }
  const ext = max(x1 - x0, y1 - y0), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  if (ext < 0.07) {                   // a dot: a small ring of light around it, drawn in one turn
    const ring = []; const ph = hash(cx * 31 + cy * 17) * TAU;
    for (let i = 0; i <= 14; i++) { const a = ph + (i / 14) * TAU; ring.push([r3(0.3 * cos(a)), r3(0.3 * sin(a) * (1 + 0.06 * sin(a * 3))), r3(0.08 * i)]); }
    return { s: [[[0, 0, 0], [0.012, 0.01, 0.12]], ring.map((p) => [p[0], p[1], r3(p[2] + 0.4)])], d: 1.52, dot: 1 };
  }
  const k = 0.84 / max(ext, 0.2);     // small scribbles grow to fill the sign, large ones are left nearly alone
  let t = 0; const res = [];
  let budget = 220;
  for (const q of out) {
    const th = thin(q, max(4, round((budget * q.length) / all.length)));
    let prev = th[0][2]; const st = [];
    for (const p of th) { t += clamp(p[2] - prev, 0, 0.5); prev = p[2]; st.push([r3((p[0] - cx) * k), r3((p[1] - cy) * k), r3(t)]); }
    if (st.length === 1) st.push([st[0][0] + 0.012, st[0][1] + 0.01, r3(t + 0.1)]);
    res.push(st); t += 0.28;
  }
  t -= 0.28;
  const sc = t < 0.8 ? 0.8 / max(t, 1e-3) : t > 4.5 ? 4.5 / t : 1;
  if (sc !== 1) for (const st of res) for (const p of st) p[2] = r3(p[2] * sc);
  return { s: res, d: r3(t * sc) };
