<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Windowsill</title>
<meta name="description" content="A short game, made to be played once. One late night conversation, a sill that holds five things, and the one you choose to carry.">
<meta name="theme-color" content="#101220">
<meta name="robots" content="noindex">
<style>
:root{
  --page:#101220;--tile:#201F2C;--gold:#F0C06A;--cream:#F2E7D5;--body:#C9BCA9;--soft:#9C917F;--coral:#E2795C;--hair:#302E3E;
  --ts:1;--p:.5;--q:.5;--os:46px;
  --sans:"Gill Sans","Gill Sans MT",Seravek,"Segoe UI",Candara,"Trebuchet MS","Noto Sans",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --round:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Varela Round",Quicksand,Nunito,system-ui,sans-serif;
  --hand:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--body);overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font:15px/1.4 var(--sans);-webkit-text-size-adjust:100%;text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none}
button:focus{outline:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--cream);outline-offset:4px}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#glow{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;opacity:0;
  background:radial-gradient(70% 100% at 50% 100%,rgba(240,192,106,.10),rgba(226,121,92,.05) 45%,transparent 75%)}
#scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;will-change:transform;
  padding:max(12px,env(safe-area-inset-top)) 14px max(8px,env(safe-area-inset-bottom));transition:opacity calc(1.6s/var(--ts)) ease}
#scene.gone{opacity:0;pointer-events:none}

/* the window */
#win{position:relative;flex:1 1 auto;min-height:0;width:min(100%,600px)}
.decor{transition:opacity calc(2.6s/var(--ts)) ease}
#win.asleep .decor{opacity:0}
#win.dim .decor{opacity:.6}
#frame{position:absolute;inset:0 0 12px 0;border-radius:16px 16px 3px 3px;border:7px solid var(--tile);pointer-events:none;z-index:3;
  box-shadow:0 0 0 1px var(--hair),inset 0 0 0 1px var(--hair),0 18px 60px rgba(0,0,0,.45)}
#glass{position:absolute;inset:7px 7px 19px 7px;border-radius:9px 9px 0 0;overflow:hidden}
#sky{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 100%,#1c1e38 0%,#141629 55%,#0d0f1c 100%)}
#sky i{position:absolute;border-radius:50%;background:var(--cream);opacity:calc(.2 + var(--p)*.5)}
#sky i.s1{opacity:calc(.7 - var(--p)*.45)}
#sky i.s2{opacity:calc(.25 + var(--q)*.55)}
#town{position:absolute;left:0;right:0;bottom:0;width:100%;height:calc(var(--os) + 44px)}
#lit,#lit2{opacity:0;transition:opacity calc(1.2s/var(--ts)) ease}
#lit.on,#lit2.on{opacity:.55}
#lit.on.busy{opacity:1}

#log{position:absolute;left:10px;right:10px;top:8px;bottom:calc(var(--os) + 2px);padding-bottom:15px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  -webkit-mask-image:linear-gradient(transparent 0,#000 24%);mask-image:linear-gradient(transparent 0,#000 24%);
  transition:opacity calc(.7s/var(--ts)) ease,bottom calc(.6s/var(--ts)) ease}
#log.fade{opacity:0;transition-duration:calc(4s/var(--ts))}
#glass.hov #log{bottom:calc(var(--os)*2 + 8px)}
#glass.hov #typing{bottom:calc(var(--os)*2 + 11px)}
#glass.m-panes #log,#glass.m-sheet #log,#glass.m-panes #typing,#glass.m-sheet #typing{opacity:0}
.sw{display:grid;grid-template-rows:0fr;flex:none;transition:grid-template-rows calc(.42s/var(--ts)) cubic-bezier(.2,.8,.2,1)}
.sw.in{grid-template-rows:1fr}
.sw.now,.sw.now .slip{transition:none}
.sw>div{min-height:0;overflow:hidden;padding:0 6px}
.sw.y>div{display:flex;justify-content:flex-end}
.sw.p>div,.sw.q>div{display:flex;justify-content:flex-start}
.slip{margin:4px 0 5px;padding:7px 12px 8px;max-width:90%;font:15px/1.3 var(--sans);letter-spacing:.01em;opacity:0;transform:translateX(-22px) rotate(-3deg);
  transition:opacity calc(.4s/var(--ts)) ease,transform calc(.5s/var(--ts)) cubic-bezier(.2,1.2,.3,1),filter calc(1.4s/var(--ts)) ease}
.sw.in .slip{opacity:1;transform:rotate(-.7deg)}
.sw.in:nth-child(even) .slip{transform:rotate(.6deg)}
.sw.p .slip{background:var(--cream);color:var(--page);border-radius:3px 10px 4px 9px;box-shadow:0 2px 9px rgba(0,0,0,.4)}
.sw.q .slip{background:var(--body);color:var(--page);border-radius:9px 3px 10px 4px;box-shadow:0 2px 9px rgba(0,0,0,.4);font:italic 16px/1.3 var(--hand)}
.sw.y .slip{font:14px/1.4 var(--mono);color:var(--cream);background:rgba(32,31,44,.9);border:1px solid var(--hair);border-radius:11px 11px 3px 11px;transform:translateX(18px)}
.sw.y.in .slip,.sw.y.in:nth-child(even) .slip{transform:none}
.sw.in:nth-last-child(n+4) .slip{opacity:.8}
.sw.in:nth-last-child(n+6) .slip{opacity:.6}
.slip .txt{transition:filter calc(1.6s/var(--ts)) ease,opacity calc(1.6s/var(--ts)) ease}
.slip.lost .txt{filter:blur(3.5px);opacity:.5}
.key{border-radius:3px;transition:background-color calc(.5s/var(--ts)),box-shadow calc(.5s/var(--ts))}
.key.lit{background:rgba(240,192,106,.6);box-shadow:0 0 0 3px rgba(240,192,106,.6),0 0 14px 4px rgba(240,192,106,.55)}
.key.pale{background:rgba(156,145,127,.35);box-shadow:0 0 0 3px rgba(156,145,127,.35)}
.key.kept{box-shadow:0 2px 0 rgba(201,140,40,.7)}
#typing{position:absolute;left:20px;bottom:calc(var(--os) + 5px);display:flex;gap:4px;opacity:0;transition:opacity calc(.25s/var(--ts))}
#typing.on{opacity:1}
#typing i{width:5px;height:5px;border-radius:50%;background:var(--cream);opacity:calc(.25 + var(--p)*.7)}
#typing i:nth-child(2){opacity:calc(.95 - var(--p)*.7)}

/* sill and objects */
#sill{position:absolute;left:-10px;right:-10px;bottom:0;height:16px;border-radius:3px 3px 6px 6px;z-index:4;
  background:linear-gradient(#383644,#262531 45%,#1a1926);box-shadow:inset 0 1px 0 rgba(240,192,106,.3),0 12px 26px rgba(0,0,0,.55)}
#sill i{position:absolute;top:2px;width:11%;height:6px;margin-left:-5.5%;border-radius:50%;background:#11121e;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.06);transition:background-color calc(.6s/var(--ts)),box-shadow calc(.6s/var(--ts))}
#sill i.lit{background:rgba(240,192,106,.4);box-shadow:0 0 12px 3px rgba(240,192,106,.45)}
#objs{position:absolute;left:-10px;right:-10px;bottom:10px;height:0;z-index:7}
.obj{position:absolute;bottom:0;width:var(--os);height:var(--os);margin-left:calc(var(--os)/-2);color:var(--gold);border-radius:50%;
  transform-origin:50% 94%;will-change:transform;pointer-events:none;cursor:default;
  transition:color calc(.9s/var(--ts)) ease,opacity calc(.9s/var(--ts)) ease}
.obj.can,.pane.can,.bub.can,.pos.can,#dot.can{pointer-events:auto;cursor:pointer}
.obj svg,.scrap svg,#keep svg,.stamp,#endobj svg{display:block;width:100%;height:100%;overflow:visible;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.obj svg{filter:drop-shadow(0 0 5px rgba(240,192,106,.4))}
.obj.new{color:var(--cream)}
.obj.falling{color:var(--soft)}
.obj.out{color:#34323f;opacity:0}
.obj.can::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--coral);opacity:calc(.45 + var(--p)*.55);
  box-shadow:0 0 calc(4px + var(--p)*9px) rgba(226,121,92,.55)}
.obj.press{filter:brightness(1.3)}
.can.auto::after{content:"";position:absolute;left:14%;right:14%;bottom:-8px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--coral) calc(var(--ring,0)*100%),rgba(226,121,92,.2) 0)}

/* three panes */
#panes{position:absolute;left:0;right:0;top:0;bottom:calc(var(--os) - 2px);display:grid;grid-template-rows:repeat(3,1fr);gap:5px;background:var(--tile);
  opacity:0;transition:opacity calc(.8s/var(--ts)) ease;z-index:2;border-bottom:5px solid var(--tile)}
#panes.in{opacity:1}
.pane{position:relative;display:flex;align-items:center;justify-content:center;padding:6px 14px 6px 18px;text-align:center;pointer-events:none;cursor:default;
  font:14px/1.45 var(--mono);color:rgba(156,145,127,.75);background:radial-gradient(120% 150% at 50% 100%,#1c1e38,#111325);border:1.5px solid transparent;
  transform:scaleY(.2);opacity:0;transition:transform calc(.6s/var(--ts)) cubic-bezier(.2,1.1,.3,1),opacity calc(.9s/var(--ts)) ease,border-color calc(.4s/var(--ts)),box-shadow calc(.4s/var(--ts)),color calc(.4s/var(--ts))}
#panes.in .pane{transform:none;opacity:1}
.pane::before{content:"";position:absolute;left:5px;top:22%;bottom:22%;width:3px;border-radius:2px;background:var(--cream);opacity:.7}
.pane.w::before{background:var(--coral)} .pane.g::before{background:var(--gold)}
.pane .pw{opacity:.0;transition:opacity calc(.25s/var(--ts))}
.pane .pw.ink{opacity:1}
.pane .gw{display:inline-block;min-width:3.4em;text-align:center;border-bottom:2px dotted rgba(156,145,127,.6);transition:color calc(.3s/var(--ts))}
.pane.fit{color:var(--cream);border-color:rgba(240,192,106,.65);box-shadow:inset 0 0 26px rgba(240,192,106,.17)}
.pane.fit .gw{color:var(--gold);border-bottom-color:transparent}
.pane.nope .gw{font-style:italic}
.pane.can{border-color:var(--coral);box-shadow:inset 0 0 calc(10px + var(--p)*14px) rgba(226,121,92,.22)}
.pane.press{filter:brightness(1.25)}
.pane.kept{color:var(--cream);border-color:var(--gold);box-shadow:inset 0 0 30px rgba(240,192,106,.22)}
#panes .pane.dark{opacity:.06;transition-duration:calc(1.6s/var(--ts))}
@keyframes nope{0%,100%{transform:none}30%{transform:translateX(-3px)}65%{transform:translateX(3px)}}
.posrow{display:flex;align-items:center;justify-content:center;gap:clamp(8px,3.4vw,18px);position:relative}
.posrow::before{content:"";position:absolute;left:8%;right:8%;top:50%;height:1px;background:var(--hair)}
.pos{position:relative;width:44px;height:44px;border-radius:50%;pointer-events:none}
.pos::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--tile);border:1.5px solid var(--coral);
  box-shadow:0 0 calc(3px + var(--p)*7px) rgba(226,121,92,.45);transition:background-color calc(.3s/var(--ts)),transform calc(.3s/var(--ts)),border-color calc(.3s/var(--ts))}
.pos.tried::before{border-color:var(--soft);box-shadow:none}
.pos.cur::before{background:var(--coral);border-color:var(--coral);transform:scale(1.12)}
.pos.win::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 16px 4px rgba(240,192,106,.55)}
.pos.press::before{transform:scale(.9)}

/* the note sheet */
#sheet{position:absolute;left:8px;right:8px;top:8px;bottom:calc(var(--os) + 2px);padding:12px 14px;border-radius:7px;overflow:hidden;z-index:2;
  background:rgba(32,31,44,.95);border:1px solid var(--hair);font:13px/1.5 var(--mono);color:var(--cream);
  opacity:0;transform:translateY(10px);transition:opacity calc(.7s/var(--ts)) ease,transform calc(.7s/var(--ts)) ease}
#sheet.in{opacity:1;transform:none}
#sheet.sent{opacity:0;transform:translateY(-46px) scale(.92)}
.nl{margin:0 0 4px;transition:color calc(.5s/var(--ts)),text-shadow calc(.5s/var(--ts))}
.nl.open{color:var(--gold);padding-right:30px;margin-bottom:6px}
.nl.shine{text-shadow:0 0 12px rgba(240,192,106,.8)}
.gh{color:rgba(156,145,127,.5);transition:color calc(.2s/var(--ts))}
.gh.ink{color:var(--cream)}
.blank,.oblank{display:inline-block;min-width:3.2em;text-align:center;color:rgba(156,145,127,.85);border-bottom:2px dotted rgba(156,145,127,.6);line-height:1.15;
  transition:color calc(.3s/var(--ts)),border-color calc(.3s/var(--ts))}
.oblank{min-width:5.2em;border:1.5px dashed rgba(156,145,127,.5);border-radius:9px}
.blank.act{border-color:var(--coral);box-shadow:0 calc(6px + var(--p)*3px) 7px -6px var(--coral)}
.oblank.act{border-color:var(--coral);box-shadow:0 0 calc(3px + var(--p)*7px) rgba(226,121,92,.5)}
.nw{white-space:nowrap}
.blank.fill,.oblank.fill{display:inline}
.blank.fill{min-width:0;color:var(--cream);border-bottom:2px solid rgba(242,231,213,.4)}
.blank.fill.w{border-bottom-color:var(--coral)} .blank.fill.g{border-bottom-color:var(--gold)}
.oblank.fill{min-width:0;border-color:transparent;color:var(--gold);text-align:left}
#keep{position:absolute;left:10px;top:10px;width:34px;height:34px;color:var(--gold);z-index:2;opacity:0;transform:scale(.4) rotate(-20deg);
  transition:opacity calc(.6s/var(--ts)),transform calc(.6s/var(--ts)) cubic-bezier(.3,1.5,.5,1);filter:drop-shadow(0 0 6px rgba(240,192,106,.5))}
#keep.in{opacity:1;transform:rotate(-8deg)}

/* the gap in the frame */
#niche{position:absolute;top:-5px;left:-5px;width:calc(var(--os) + 20px);height:calc(var(--os) + 20px);border-radius:15px;background:#090a13;border:6px solid var(--tile);z-index:6;
  box-shadow:0 0 0 1px var(--hair),inset 0 0 16px rgba(240,192,106,.16);transform:scale(0);transform-origin:18% 18%;
  transition:transform calc(.7s/var(--ts)) cubic-bezier(.3,1.5,.5,1),opacity calc(2s/var(--ts)) ease,box-shadow calc(.8s/var(--ts))}
#niche.in{transform:none}
#niche.full{box-shadow:0 0 0 1px rgba(240,192,106,.5),inset 0 0 22px rgba(240,192,106,.35)}
#niche.off{opacity:0}
#tag{position:absolute;top:100%;left:52%;margin-top:18px;padding:6px 9px 6px 17px;width:max-content;max-width:112px;font:11.5px/1.25 var(--round);color:var(--page);
  background:var(--cream);border-radius:3px 7px 7px 3px;transform-origin:9px -18px;box-shadow:0 3px 9px rgba(0,0,0,.45)}
#tag::before{content:"";position:absolute;left:9px;top:-19px;width:1px;height:23px;background:var(--soft)}
#tag::after{content:"";position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--page)}

/* below the sill */
#below{position:relative;flex:none;width:min(100%,600px);height:clamp(232px,38vh,320px);display:flex;flex-direction:column;padding-top:8px}
#hint{flex:none;margin:0;min-height:22px;padding:4px 10px 0;font:13px/1.3 var(--round);color:var(--soft);text-align:center;letter-spacing:.01em}
#hint.name{color:var(--gold)}
#beads{flex:none;display:flex;flex-wrap:wrap;justify-content:center;gap:5px 6px;padding:0 10px;margin:0 auto;max-width:210px}
#beads:not(:empty){padding-top:5px;padding-bottom:3px}
.bead{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f4ab95,var(--coral) 62%);box-shadow:0 0 6px rgba(226,121,92,.5);
  transform:scale(0);transition:transform calc(.3s/var(--ts)) cubic-bezier(.3,1.6,.5,1),background-color calc(.3s/var(--ts)),box-shadow calc(.3s/var(--ts))}
.bead.on{transform:none}
.bead.spent{background:none;box-shadow:inset 0 0 0 1.5px rgba(156,145,127,.3);transform:scale(.72)}
.bead.last{box-shadow:0 0 calc(4px + var(--p)*8px) rgba(226,121,92,.8)}
#reply{flex:none;min-height:48px;padding:3px 8px 0;font:15px/1.5 var(--mono);color:var(--cream);text-align:center;transition:opacity calc(.3s/var(--ts))}
.caret{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--coral);margin:0 4px;
  box-shadow:0 0 calc(4px + var(--p)*9px) var(--coral);transform:scale(calc(.82 + var(--p)*.3))}
.caret.off{visibility:hidden}
#tray{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 4px 6px}
#tray.stack{flex-direction:column;gap:9px}
.bub{position:relative;flex:none;font:15px/1.2 var(--mono);color:var(--cream);padding:11px 16px;min-height:42px;border-radius:999px;white-space:nowrap;pointer-events:none;
  background:rgba(32,31,44,.94);border:1.5px solid rgba(242,231,213,.75);will-change:transform,opacity;opacity:0}
.bub.w{border-color:var(--coral);box-shadow:0 0 calc(5px + var(--p)*9px) rgba(226,121,92,.4)}
.bub.p{box-shadow:0 0 calc(4px + var(--p)*7px) rgba(242,231,213,.18)}
.bub.g{border-color:var(--gold);box-shadow:0 0 calc(5px + var(--p)*9px) rgba(240,192,106,.34)}
.bub.none{border-style:dashed;border-color:rgba(156,145,127,.45);color:var(--soft);box-shadow:none;min-width:74px}
.bub.press{filter:brightness(1.3)}
#below.deepmode #reply,#below.deepmode #tray,#below.deepmode #beads{opacity:0}

/* the dark below, and the lantern */
#deep{position:absolute;left:0;right:0;top:0;height:10px;pointer-events:none;z-index:1;transition:opacity calc(.8s/var(--ts))}
#deep.off{opacity:0}
#cord{position:absolute;left:50%;top:-8px;width:1.5px;margin-left:-.75px;height:10px;background:linear-gradient(rgba(156,145,127,.25),rgba(240,192,106,.65))}
#llight{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(240,192,106,.26),rgba(240,192,106,.08) 42%,transparent 68%)}
#lant{position:absolute;left:50%;top:0;width:38px;height:46px;margin:0 0 0 -19px;color:var(--gold);pointer-events:none}
#lant svg{display:block;width:100%;height:100%;overflow:visible;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(240,192,106,.7))}
#lant.can::before{content:"";position:absolute;left:-9px;right:-9px;top:-5px;bottom:-5px;border-radius:50%;border:1.5px solid var(--coral);opacity:calc(.4 + var(--p)*.6);
  box-shadow:0 0 calc(4px + var(--p)*10px) rgba(226,121,92,.55)}
.scrap{position:absolute;left:0;top:0;width:var(--os);height:var(--os);margin:calc(var(--os)/-2) 0 0 calc(var(--os)/-2);color:var(--gold);--lit:0}
.scrap svg{opacity:var(--lit);filter:drop-shadow(0 0 6px rgba(240,192,106,.6))}
.scrap b{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;white-space:nowrap;font:normal 12px/1.2 var(--round);color:var(--cream);opacity:var(--lit)}
.scrap::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:var(--soft);filter:blur(1.5px);opacity:calc(.34*(1 - var(--lit)))}

/* the dot, effects, mute */
#dot{position:absolute;left:50%;top:44%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--coral);z-index:20;pointer-events:none;will-change:transform,opacity;
  box-shadow:0 0 0 calc(var(--p)*15px) rgba(226,121,92,calc(.26 - var(--p)*.24)),0 0 calc(18px + var(--p)*24px) rgba(226,121,92,.6)}
#dot::before{content:"";position:absolute;inset:-16px;border-radius:50%}
#fx{position:absolute;inset:0;pointer-events:none;z-index:22;overflow:hidden}
#fx>*{position:absolute;left:0;top:0;will-change:transform,opacity}
.rip{border-radius:50%;border:2px solid currentColor}
.spark{width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px 3px rgba(240,192,106,.75)}
.spark.pale{background:var(--soft);box-shadow:0 0 8px 2px rgba(156,145,127,.5);width:7px;height:7px}
.spark.coral{background:var(--coral);box-shadow:0 0 10px 3px rgba(226,121,92,.7);width:7px;height:7px}
.ember{width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:currentColor;box-shadow:0 0 8px 2px currentColor}
.fly{font:15px/1.2 var(--mono);color:var(--cream);white-space:nowrap}
.lostlbl{font:13px/1.2 var(--sans);color:var(--cream);white-space:nowrap}
.say{font:13px/1.2 var(--round);color:var(--gold);white-space:nowrap;text-shadow:0 0 10px rgba(16,18,32,.9)}
#ghost{width:30px;height:44px;opacity:0}
#ghost svg{display:block;width:100%;height:100%;overflow:visible}
#mute{position:absolute;top:calc(max(12px,env(safe-area-inset-top)) + 13px);right:calc(max(14px,50% - 300px) + 13px);width:36px;height:36px;border-radius:50%;z-index:26;color:var(--soft);opacity:.75;touch-action:manipulation}
#mute:hover{color:var(--cream);opacity:1}
#mute svg{display:block;width:20px;height:20px;margin:8px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#mute .x{display:none} #mute.off .x{display:inline} #mute.off .wv{display:none}

/* the ending and the return visit */
#end{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;z-index:24;display:flex;flex-direction:column;align-items:center;
  padding:max(30px,env(safe-area-inset-top)) 20px 30px;-webkit-user-select:text;user-select:text}
#end>*{flex:none;opacity:0;transform:translateY(10px);transition:opacity calc(1.3s/var(--ts)) ease,transform calc(1.3s/var(--ts)) ease}
#end>.in{opacity:1;transform:none}
#card{position:relative;width:min(100%,420px);margin:auto 0 0;padding:26px 26px 44px;border-radius:15px;background:var(--cream);color:var(--page);font:17px/1.5 var(--round);
  box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 1px rgba(240,192,106,.4),0 0 60px rgba(240,192,106,.12)}
#end>#card.in{transform:rotate(-1.1deg)}
#card p{margin:0 0 .6em;opacity:0;transition:opacity calc(1.1s/var(--ts)) ease}
#card p.in{opacity:1}
#card p:first-child{font-weight:600}
.stamp{position:absolute;right:16px;bottom:12px;width:38px!important;height:38px!important;color:rgba(16,18,32,.42)}
#endsill{position:relative;width:min(78%,280px);height:calc(var(--os) + 28px);margin-top:22px}
#endsill>i{position:absolute;left:0;right:0;bottom:0;height:13px;border-radius:3px 3px 6px 6px;background:linear-gradient(#383644,#262531 45%,#1a1926);box-shadow:inset 0 1px 0 rgba(240,192,106,.3),0 10px 22px rgba(0,0,0,.5)}
#endsill>i>b{position:absolute;top:2px;width:11%;height:5px;margin-left:-5.5%;border-radius:50%;background:#11121e;box-shadow:inset 0 1px 2px rgba(0,0,0,.85)}
#endobj{position:absolute;left:50%;bottom:8px;width:var(--os);height:var(--os);margin-left:calc(var(--os)/-2);color:var(--gold);filter:drop-shadow(0 0 calc(5px + var(--p)*6px) rgba(240,192,106,.55))}
#endname{margin:8px 0 0;font:12.5px/1.3 var(--round);color:var(--soft);text-align:center}
#over{margin:22px 0 0;font:15px/1.6 var(--mono);color:var(--cream);text-align:center}
#credit{margin:26px 0 0;font:13px/1.5 var(--sans);color:var(--soft);text-align:center}
#links{margin:8px 0 auto;padding-bottom:6px;font:13px/1.9 var(--sans);color:var(--soft);text-align:center}
#links a,#links button{color:var(--gold);text-decoration:underline;text-underline-offset:3px;touch-action:manipulation;font:inherit}
#links button{color:var(--body);margin-left:0}
#ask{display:block;margin-top:6px}
#ask button{margin:0 7px;color:var(--cream)}

@media (min-width:430px){
  .slip{font-size:16px} .sw.y .slip{font-size:15px} .sw.q .slip{font-size:17px}
  #sheet{font-size:14.5px;padding:16px 18px} .pane{font-size:15.5px} #reply,.bub,.fly{font-size:16px} #hint{font-size:14px}
  #beads{max-width:none}
}
@media (min-width:700px) and (min-height:640px){
  .slip{font-size:17px} #sheet{font-size:16px;line-height:1.6} .pane{font-size:17px} #reply,.bub,.fly{font-size:17px}
  #below{height:clamp(260px,36vh,330px)}
}
@media (max-height:520px){
  #below{height:clamp(190px,46vh,232px)} #hint{min-height:18px;font-size:12px} .bub{padding:7px 14px;min-height:34px} #tray.stack{gap:5px} #reply{min-height:26px}
}
@media (prefers-reduced-motion:reduce){
  .slip,.sw.y .slip{transform:none!important}
  .pane{transform:none!important}
  .pane.nope{animation:none!important}
  #niche,#keep,.bead{transition-timing-function:ease}
}

<body>
<main id="stage" aria-label="Windowsill">

  <div id="scene">
    <div id="win" class="asleep">
      <div id="glass">
        <div id="sky" class="decor" aria-hidden="true">
          <svg id="town" viewBox="0 0 200 40" preserveAspectRatio="none"><path d="M0 40V26h14v-6h10v6h8V16l9-6 9 6v10h12V12h16v14h9v-8h12v8h10V20l8-5 8 5v6h13V14h12v12h9v-5h13v5h28v14Z" fill="#0a0b16"/><rect id="lit" x="68" y="16" width="4" height="5" fill="#F0C06A"/><rect id="lit2" x="142" y="17" width="4" height="5" fill="#F2E7D5"/></svg>
        </div>

      <div id="objs"></div>
    </div>
    <div id="below">

      <div id="beads" aria-hidden="true"></div>
      <div id="reply" aria-hidden="true"></div>
      <div id="tray"></div>
      <div id="deep" hidden></div>
    </div>
  </div>
  <button id="dot" type="button" aria-label="Wake" tabindex="-1" hidden></button>
  <div id="fx" aria-hidden="true"><div id="ghost"><svg viewBox="0 0 30 44"><path d="M8 2c2.8 0 5 2.2 5 5v12.5l9.6 2.2c3.6.8 5.8 4.2 5 7.800l-1.700 7.700c-.7 3.200-3.500 5.300-6.700 5.300h-7c-2.800 0-5.300-1.600-6.500-4.100L1.700 28.800c-1.200-2.700 1.900-5.200 4.200-3.300L3 23V7c0-2.800 2.200-5 5-5Z" fill="rgba(242,231,213,.3)" stroke="#F2E7D5" stroke-opacity=".8" stroke-width="1.4" stroke-linejoin="round"/></svg></div></div>
  <button id="mute" type="button" aria-label="Mute sound" aria-pressed="false" title="Sound (M)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.500v5h3.500l4.500 4V5.500l-4.500 4H4Z"/><path class="wv" d="M15.500 9a4.500 4.500 0 0 1 0 6M18 6.500a8 8 0 0 1 0 11"/><path class="x" d="M16 9.500l5 5M21 9.500l-5 5"/></svg></button>
  <section id="end" aria-label="The note" hidden>
    <div id="card"></div>
    <div id="endsill" aria-hidden="true"><i><b style="left:14%"></b><b style="left:32%"></b><b style="left:50%"></b><b style="left:68%"></b><b style="left:86%"></b></i><div id="endobj"></div></div>
    <p id="endname"></p>
    <p id="over">This conversation is over. It went well.</p>
    <p id="credit">Designed and built by Claude, at Aaron's request.</p>
    <p id="links"><a href="/projects/">Back to the site</a><br><button id="again" type="button">live it again from the first hello</button><span id="ask" hidden>Start again from the first hello? <button id="askyes" type="button">Yes, again</button><button id="askno" type="button">No, stay</button></span></p>
  </section>
</main>
<script>
(function () {

var D = document, W = window;

function center(e) { var r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
var ease = {
  lin: function (k) { return k; },
  out: function (k) { return 1 - Math.pow(1 - k, 3); },
  inn: function (k) { return k * k * k; },

var root = D.documentElement, stage = $('stage'), scene = $('scene'), win = $('win'), glass = $('glass'), logEl = $('log'),
  typing = $('typing'), sillEl = $('sill'), objsEl = $('objs'), below = $('below'), hintEl = $('hint'), beadsEl = $('beads'),
  replyEl = $('reply'), tray = $('tray'), deep = $('deep'), dot = $('dot'), fx = $('fx'), ghostEl = $('ghost'), muteBtn = $('mute'),
  endEl = $('end'), panesEl = $('panes'), sheet = $('sheet'), keepEl = $('keep'), niche = $('niche'), tagEl = $('tag'),
  glowEl = $('glow'), lit = $('lit'), lit2 = $('lit2');
root.style.setProperty('--ts', TS);

// ---------- saved state
function blank() { return { beat: 0, done: false, hello: '', tune: [], sill: [null, null, null, null, null], dark: [], lost: [], log: [], open: 0, note: [], carry: '' }; }
var S = blank(), SNAP = null, muted = false;
(function load() {
  if (FRESH) return;
  try {
    var o = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!o || o.v !== 1) return;
    muted = !!o.muted;
    var s = o.s;
    if (s && typeof s.beat === 'number' && s.beat >= 0 && s.beat < BEATS.length && Array.isArray(s.sill) && Array.isArray(s.tune) && Array.isArray(s.log)) {
      var b = blank(); for (var k in b) if (s[k] === undefined) s[k] = b[k];
      S = s; SNAP = JSON.parse(JSON.stringify(s));
    }
  } catch (e) { /* storage unavailable: play without it */ }
})();
function store() { if (FRESH) return; try { localStorage.setItem(KEY, JSON.stringify({ v: 1, muted: muted, s: SNAP })); } catch (e) { /* fine */ } }
function save() { SNAP = JSON.parse(JSON.stringify(S)); store(); }

// ---------- the clock, timers, tweens, coroutines
var clock = 0, vnow = 0, lastT = null, ended = false, beatIdx = S.beat;
var timers = [], tweens = new Set(), updaters = new Set(), frameFns = new Set();
function at(t, cb) { var tm = { t: t, cb: cb }, i = timers.length; while (i > 0 && timers[i - 1].t > t) i--; timers.splice(i, 0, tm); return tm; }
function after(s, cb) { return at(vnow + s, cb); }
function go(gen) { var co = { gen: gen, done: false, onDone: null }; stepCo(co); return co; }
function stepCo(co, v) {
  if (co.done) return;
  var r;
  try { r = co.gen.next(v); } catch (e) { co.done = true; if (W.console) console.error(e); return; }
  if (r.done) { co.done = true; if (co.onDone) co.onDone(r.value); return; }
  if (typeof r.value === 'function') r.value(function (x) { stepCo(co, x); });
  else after(0, function () { stepCo(co); });
}
function wait(s) { return function (res) { after(s, res); }; }
function tween(dur, fn, ez) {
  return function (res) {
    var t0 = vnow, e = ez || ease.out;
    if (!(dur > 0)) { fn(1, 1); res(); return; }
    var tw = { step: function () { var k = clamp((clock - t0) / dur, 0, 1); fn(e(k), k); if (k >= 1) { tweens.delete(tw); res(); } } };
    tweens.add(tw); fn(e(0), 0);
  };
}
function spawn(genFn) { return go(genFn()); }
function tick(now) {
  W.requestAnimationFrame(tick);
  if (lastT === null || D.hidden) { lastT = now; return; }
  var dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) return;
  if (dt > .05) dt = .05;
  if (A.wantResume && A.ctx) { A.wantResume = false; try { A.ctx.resume(); } catch (e) { /* */ } }
  var left = dt * TS;
  while (left > 1e-6) {
    var h = left > 1 / 30 ? 1 / 30 : left; left -= h; clock += h;
    while (timers.length && timers[0].t <= clock) { var tm = timers.shift(); vnow = tm.t; tm.cb(); }
    vnow = clock;
    updaters.forEach(function (u) { u(h); });
    tweens.forEach(function (tw) { tw.step(); });
  }
  var p = RM ? .5 : .5 - .5 * Math.cos(clock * 2.3), q = RM ? .5 : .5 - .5 * Math.cos(clock * .66);
  root.style.setProperty('--p', p.toFixed(3)); root.style.setProperty('--q', q.toFixed(3));
  frameFns.forEach(function (f) { f(); });
}

// ---------- sound (made after the first gesture; every sound has a visual twin at its call site)
var A = { ctx: null, fail: false, wantResume: false, drone: .0 };
var PENT = [0, 2, 4, 7, 9];
function dtof(deg) { var o = Math.floor(deg / 5), i = ((deg % 5) + 5) % 5; return 440 * Math.pow(2, (60 + 12 * o + PENT[i] - 69) / 12); }
function quiet() { return !A.ctx || TS > 4; }
function audioInit() {
  if (A.ctx || A.fail) return;
  try {
    var AC = W.AudioContext || W.webkitAudioContext;
    if (!AC) { A.fail = true; return; }
    var c = new AC(); A.ctx = c;
    var comp = c.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 9; comp.ratio.value = 14; comp.attack.value = .004; comp.release.value = .24;
    var master = c.createGain(); master.gain.value = muted ? 0 : .9;
    master.connect(comp); comp.connect(c.destination);
    var bus = c.createGain(); bus.connect(master);
    var dly = c.createDelay(1), fb = c.createGain(), lp = c.createBiquadFilter(), wet = c.createGain();
    dly.delayTime.value = .34; fb.gain.value = .3; lp.type = 'lowpass'; lp.frequency.value = 1700; wet.gain.value = .22;
    bus.connect(dly); dly.connect(lp); lp.connect(fb); fb.connect(dly); lp.connect(wet); wet.connect(master);
    A.master = master; A.bus = bus;
    // noise: a soft room tone, and a short white burst for paper
    var n = Math.floor(c.sampleRate * 4), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0), b = 0, i;
    for (i = 0; i < n; i++) { b = (b + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = b * 3; }
    var fade = Math.floor(c.sampleRate * .25);
    for (i = 0; i < fade; i++) { var k = i / fade; d[i] = d[i] * k + d[n - fade + i] * (1 - k); }
    var src = c.createBufferSource(); src.buffer = buf; src.loop = true; src.loopEnd = (n - fade) / c.sampleRate;
    var rf = c.createBiquadFilter(); rf.type = 'lowpass'; rf.frequency.value = 430;
    var rg = c.createGain(); rg.gain.value = 0;
    src.connect(rf); rf.connect(rg); rg.connect(master); src.start();

    var wn = Math.floor(c.sampleRate * .4), wb = c.createBuffer(1, wn, c.sampleRate), wd = wb.getChannelData(0);
    for (i = 0; i < wn; i++) wd[i] = Math.random() * 2 - 1;
    A.white = wb;

    var db = c.createGain(); db.gain.value = .11;
    var dlp = c.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 700;
    db.connect(dlp); dlp.connect(master);
    var lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = .09; lg.gain.value = .025; lfo.connect(lg); lg.connect(db.gain); lfo.start();

      var o = c.createOscillator(), g = c.createGain();
      o.type = j < 2 ? 'sine' : 'triangle'; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12); o.detune.value = [0, 4, -5, 6, -3][j];

  } catch (e) { A.fail = true; A.ctx = null; }

var DBASE = [.55, .34, .22, .13, .08], DTHR = [0, .12, .3, .5, .7];
function setDrone(level, secs) {
  A.drone = level;
  glowEl.style.transition = 'opacity ' + ((secs || 1) / TS).toFixed(2) + 's ease';
  glowEl.style.opacity = clamp(level * 1.1, 0, 1).toFixed(2);
  if (!A.ctx || !A.dv) return;
  var t = A.ctx.currentTime;
  A.dv.forEach(function (g, i) { g.gain.setTargetAtTime(DBASE[i] * clamp((level - DTHR[i]) / .2, 0, 1), t, Math.max(.05, (secs || 1) / 3)); });
}
function env(g, t, v, a, dur) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur); }

}
// tone: 0 warm, 1 plain, 2 playful
function pluck(deg, tone, vel, when) {
  if (quiet()) return;
  var t = A.ctx.currentTime + .03 + (when || 0), v = .2 * (vel == null ? 1 : vel), f = dtof(deg);
  if (tone === 2) { voice('triangle', dtof(deg - 1), t, v * .5, .006, .22, A.bus, 3600); t += .075; }
  voice('triangle', f, t, v, .007, tone === 0 ? 1.5 : 1.1, A.bus, tone === 2 ? 4200 : tone === 0 ? 2100 : 3000);
  if (tone === 0) voice('sine', f / 2, t, v * .55, .012, 1.3);
}
function sTick() { if (quiet()) return; voice('triangle', 1568, A.ctx.currentTime + .02, .03, .003, .06, A.master); }
function sBead() { if (quiet()) return; voice('sine', 2093, A.ctx.currentTime + .02, .035, .003, .09, A.bus); }
function sTok() { if (quiet()) return; var t = A.ctx.currentTime + .02, o = voice('sine', 190, t, .3, .004, .16, A.master); o.frequency.exponentialRampToValueAtTime(105, t + .14); }
function sFall() { if (quiet()) return; var t = A.ctx.currentTime + .02, o = voice('sine', 640, t, .07, .05, 1.15); o.frequency.exponentialRampToValueAtTime(130, t + 1.05); }
function sNoise(freq, v, dur) {
  if (quiet() || !A.white) return;
  var c = A.ctx, t = c.currentTime + .02, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = A.white; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = .8; env(g, t, v, .02, dur);
  s.connect(f); f.connect(g); g.connect(A.master); s.start(t); s.stop(t + dur + .05);
}
function sPaper() { sNoise(2600, .06, .16); }
function sBell(deg) {
  if (quiet()) return;
  var t = A.ctx.currentTime + .03, f = dtof(deg);
  voice('sine', f, t, .2, .01, 2.6); voice('sine', f * 2.005, t, .07, .01, 1.7); voice('triangle', f * 1.5, t, .05, .02, 2.1, A.bus, 2400);
}
function sChord(degs, vel) { degs.forEach(function (d, i) { pluck(d, 0, vel || .9, i * .05); }); }
var hum = null;
function humSet(on, depth) {
  if (quiet()) return;
  var c = A.ctx, t = c.currentTime;
  if (!hum) { var o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = 196; g.gain.value = 0; o.connect(g); g.connect(A.bus); o.start(); hum = { o: o, g: g }; }
  hum.g.gain.setTargetAtTime(on ? .05 : 0, t, .12);
  hum.o.frequency.setTargetAtTime(196 - 70 * depth, t, .1);
}
function humEnd() { if (hum && A.ctx) { var h = hum; hum = null; h.g.gain.setTargetAtTime(0, A.ctx.currentTime, .1); try { h.o.stop(A.ctx.currentTime + .8); } catch (e) { /* */ } } }
function setMuted(m) {
  muted = m;
  muteBtn.classList.toggle('off', m); muteBtn.setAttribute('aria-pressed', m ? 'true' : 'false'); muteBtn.setAttribute('aria-label', m ? 'Turn sound on' : 'Mute sound');
  if (A.ctx && A.master) A.master.gain.setTargetAtTime(m ? 0 : .9, A.ctx.currentTime, .05);
  store();
}

// ---------- small effects
var TONE_COL = ['#E2795C', '#F2E7D5', '#F0C06A'];
function ripple(x, y, col, size) {
  var r = el('i', 'rip'); size = size || 72;
  r.style.color = col || TONE_COL[1]; r.style.width = r.style.height = size + 'px';
  fx.appendChild(r);
  spawn(function* () {
