<!doctype html><html><head><style>body{margin:0;background:#1a1a22}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/tools/node/node_modules/three/build/three.module.js","three/addons/":"/tools/node/node_modules/three/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search), src = q.get('src'), label = q.get('label')||src;
const W = 1600, H = 520;
const r = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true}); r.setSize(W,H); r.setPixelRatio(1);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a2a33);
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 0.6)); const d = new THREE.DirectionalLight(0xffffff, 1.4); d.position.set(2,3,4); scene.add(d);
const L = new GLTFLoader(); L.setMeshoptDecoder(MeshoptDecoder);
L.load(src, g => {
  const o = g.scene; const box = new THREE.Box3().setFromObject(o); const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  o.position.sub(c); scene.add(o);
  let tris = 0; o.traverse(m => { if (m.isMesh) tris += (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count)/3; });
  const rad = Math.max(s.x, s.y, s.z) * 0.62;
  const cam = new THREE.PerspectiveCamera(30, (W/4)/H, 0.01, 100);
  r.setScissorTest(true);
  [0, 90, 180, 270].forEach((a, i) => {
    const t = a*Math.PI/180, dist = rad/Math.tan(15*Math.PI/180)*1.2;
    cam.position.set(Math.sin(t)*dist, s.y*0.08, Math.cos(t)*dist); cam.lookAt(0,0,0);
    r.setViewport(i*W/4, 0, W/4, H); r.setScissor(i*W/4, 0, W/4, H); r.render(scene, cam);
  });
  const lab = document.createElement('div'); lab.style.cssText='position:fixed;left:8px;top:6px;color:#ddd;font:14px monospace';
  lab.textContent = `${label}  |  ${Math.round(tris).toLocaleString()} tris  |  front, right, back, left`; document.body.appendChild(lab);
  window.DONE = true;
}, undefined, e => { document.title = 'ERR ' + e; window.DONE = true; });
</script></body></html>
