<script type="importmap">{"imports":{"three":"/tools/node/node_modules/three/build/three.module.js","three/addons/":"/tools/node/node_modules/three/examples/jsm/"}}</script></head><body><div id="l"></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RIGS} from './rigs.js';
const q = new URLSearchParams(location.search);
const rigName = q.get('rig') || 'jefrie', RIG = RIGS[rigName];
const mode = q.get('mode') || 'live';               // live | poses | parts
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true}); r.setSize(W,H); r.setPixelRatio(1);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x141a2e);
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xffe2b0, 1.6); key.position.set(-2,3,3); scene.add(key);
scene.add(new THREE.HemisphereLight(0x8899ff, 0x221a10, 0.5));
const cam = new THREE.PerspectiveCamera(32, 1, 0.01, 50);
const L = new GLTFLoader(); L.setMeshoptDecoder(MeshoptDecoder);
const PALETTE = [0xe6194b,0x3cb44b,0xffe119,0x4363d8,0xf58231,0x911eb4,0x46f0f0,0xf032e6,0xbcf60c,0xfabebe,0x008080,0xe6beff];

// --- cut one textured mesh into rigid named parts with pivots and an overlap band ---
function buildPuppet(srcMesh) {
  const g = srcMesh.geometry.index ? srcMesh.geometry.toNonIndexed() : srcMesh.geometry.clone();
  srcMesh.updateWorldMatrix(true, false); g.applyMatrix4(srcMesh.matrixWorld);
  g.computeBoundingBox(); const bb = g.boundingBox, size = bb.getSize(new THREE.Vector3());
  const s = 1 / size.y;                                   // normalise: feet at y=0, height 1, centred in x,z
  const cx = (bb.min.x + bb.max.x) / 2, cz = (bb.min.z + bb.max.z) / 2;
  g.translate(-cx, -bb.min.y, -cz); g.scale(s, s, s);
  const pos = g.attributes.position, n = pos.count / 3;
  g.computeBoundingBox(); const nb = g.boundingBox;
  const parts = typeof RIG.parts === 'function' ? RIG.parts(nb) : RIG.parts; RIG._parts = parts;
  const owner = new Int16Array(n), extra = parts.map(() => []);
  const c = new THREE.Vector3(), a = new THREE.Vector3(), b = new THREE.Vector3(), d = new THREE.Vector3();
  for (let t = 0; t < n; t++) {
    a.fromBufferAttribute(pos, 3*t); b.fromBufferAttribute(pos, 3*t+1); d.fromBufferAttribute(pos, 3*t+2);
    c.copy(a).add(b).add(d).divideScalar(3);
    let o = 0;                                           // first matching part wins, part 0 is the root
    for (let p = parts.length - 1; p > 0; p--) if (parts[p].test(c, 0)) { o = p; break; }
    owner[t] = o;
    // overlap band: a parent's triangle near the cut is copied into the child too, so the seam stays covered when the child rotates
    for (let p = 1; p < parts.length; p++) if (p !== o && parts[p].test(c, RIG.overlap)) extra[p].push(t);
  }
  const groups = {}, root = new THREE.Group(); root.name = 'puppet';
  const attrNames = Object.keys(g.attributes);
  parts.forEach((P, pi) => {
    const tris = []; for (let t = 0; t < n; t++) if (owner[t] === pi) tris.push(t); tris.push(...extra[pi]);
    const ng = new THREE.BufferGeometry();
    for (const an of attrNames) {
      const src = g.attributes[an], isz = src.itemSize, arr = new Float32Array(tris.length * 3 * isz);
      tris.forEach((t, k) => { for (let v = 0; v < 3; v++) for (let j = 0; j < isz; j++) arr[(k*3+v)*isz+j] = src.getComponent(3*t+v, j); });
      ng.setAttribute(an, new THREE.BufferAttribute(arr, isz, src.normalized));
    }
    const pivot = new THREE.Vector3(...(P.chain ? P.chain[0] : P.pivot));
    const mat = mode === 'parts' ? new THREE.MeshStandardMaterial({color: PALETTE[pi % PALETTE.length], roughness: .8}) : srcMesh.material;
    const grp = new THREE.Group(); grp.name = P.name; grp.userData = {tris: tris.length, pivot};
    if (P.chain) {
      // linear-blend skinning along a polyline: bone 0 is fixed at the root so the joint with the parent never opens
      const pts = P.chain.map(v => new THREE.Vector3(...v)), nb = pts.length;
      const vp = ng.attributes.position, nv = vp.count, si = new Uint16Array(nv*4), sw = new Float32Array(nv*4);
      const v = new THREE.Vector3(), ab = new THREE.Vector3(), av = new THREE.Vector3();
      for (let i = 0; i < nv; i++) {
        v.fromBufferAttribute(vp, i); let best = 1e9, bk = 0, bt = 0;
        for (let k = 0; k < nb-1; k++) {
          ab.subVectors(pts[k+1], pts[k]); av.subVectors(v, pts[k]);
          const t = THREE.MathUtils.clamp(av.dot(ab)/ab.lengthSq(), 0, 1), d = av.addScaledVector(ab, -t).lengthSq();
          if (d < best) { best = d; bk = k; bt = t; }
        }
        si[i*4] = bk; si[i*4+1] = bk+1; sw[i*4] = 1-bt; sw[i*4+1] = bt;
      }
      ng.translate(-pivot.x, -pivot.y, -pivot.z);
      ng.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(si, 4)); ng.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sw, 4));
      const bones = pts.map((pt, k) => { const b = new THREE.Bone(); b.name = `${P.name}${k}`; b.position.copy(k ? pt.clone().sub(pts[k-1]) : new THREE.Vector3()); return b; });
      bones.forEach((b, k) => k && bones[k-1].add(b));
      const m = new THREE.SkinnedMesh(ng, mat); m.add(bones[0]); m.bind(new THREE.Skeleton(bones)); m.name = P.name; m.frustumCulled = false;
      grp.add(m); grp.userData.bones = bones;
      bones.forEach((b, k) => { if (k) groups[`${P.name}${k-1}`] = b; });   // pose keys tail0.. drive bones 1..n
    } else {
      ng.translate(-pivot.x, -pivot.y, -pivot.z);
      const m = new THREE.Mesh(ng, mat); m.name = P.name; grp.add(m);
    }
    groups[P.name] = grp;
  });
  parts.forEach(P => {                                   // parent and place each pivot relative to its parent's pivot
    const grp = groups[P.name], parent = P.parent ? groups[P.parent] : root;
    const pp = P.parent ? groups[P.parent].userData.pivot : new THREE.Vector3();
    grp.position.copy(grp.userData.pivot).sub(pp); parent.add(grp);
  });
  return {root, groups};
}
function applyPose(P, t) {                               // t in [0,1]: one cycle of the motion
  const st = RIG.pose(t);
  for (const [name, rot] of Object.entries(st.parts)) { const gp = P.groups[name]; if (gp) gp.rotation.set(rot[0]||0, rot[1]||0, rot[2]||0); }
  P.root.position.set(st.body?.pos?.[0]||0, st.body?.pos?.[1]||0, st.body?.pos?.[2]||0);
  P.root.rotation.set(st.body?.rot?.[0]||0, st.body?.rot?.[1]||0, st.body?.rot?.[2]||0);
  const sq = st.body?.squash || 0; P.root.scale.set(1+sq*.5, 1-sq, 1+sq*.5);
}
L.load(RIG.src, gl => {
  let src = null; gl.scene.traverse(o => { if (o.isMesh && !src) src = o; });
  const views = mode === 'poses' ? RIG.showPoses : [null];
  const puppets = views.map(() => { const P = buildPuppet(src); scene.add(P.root); return P; });
  const info = RIG._parts.map(p => `${p.name}: ${puppets[0].groups[p.name].userData.tris} tris${p.chain ? ` (skinned chain, ${p.chain.length} bones)` : ''}`).join('\n');
  document.getElementById('l').textContent = `${rigName} · ${RIG.label || 'rigid puppet parts'} · ${RIG._parts.length} parts · ${mode}\n${info}`;
  const yaw = +(q.get('yaw') || RIG.yaw || 0) * Math.PI / 180;
  const fb = new THREE.Box3().setFromObject(puppets[0].root), fc = fb.getCenter(new THREE.Vector3()), fs = fb.getSize(new THREE.Vector3());
  const fd = Math.max(fs.x, fs.y * 1.25, fs.z) * 1.15 / Math.tan(16 * Math.PI / 180) * 0.62 * (RIG.zoom || 1);
  function frame(time) {
    const nv = views.length; r.setScissorTest(true);
    views.forEach((tv, i) => {
      puppets.forEach((P, j) => P.root.visible = j === i);
      applyPose(puppets[i], tv === null ? (time / 1000 / (RIG.period || 2.4)) % 1 : tv);
      cam.aspect = (W/nv)/H; cam.updateProjectionMatrix();
      cam.position.set(fc.x + Math.sin(yaw)*fd, fc.y + 0.15, fc.z + Math.cos(yaw)*fd); cam.lookAt(fc.x, fc.y + 0.08, fc.z);
      r.setViewport(i*W/nv, 0, W/nv, H); r.setScissor(i*W/nv, 0, W/nv, H); r.render(scene, cam);
    });
    window.DONE = true;
    if (mode === 'live') requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}, undefined, e => { document.title = 'ERR ' + e; window.DONE = true; });
</script></body></html>
