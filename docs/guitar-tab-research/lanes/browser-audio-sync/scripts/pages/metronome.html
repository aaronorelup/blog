<!doctype html>
<meta charset="utf-8">
<title>metronome timing</title>
<body>
<script src="/nm/tone/build/Tone.js"></script>
<script type="module">
// Metronome timing test. One click per beat at BPM for DUR seconds, generated by one METHOD:
//   lookahead : clicks scheduled ahead on the AudioContext clock by a setTimeout loop (every 25 ms, 100 ms ahead)
//   interval  : setInterval(period) callbacks that start a click immediately (source.start() with no time)
//   tone      : Tone.js Transport.scheduleRepeat, click started at the time Tone passes to the callback
//   worklet   : an AudioWorkletProcessor that writes the click itself at frame positions it counts
// BUSY = ms of busy-wait per main-thread task (0 = idle): spin for BUSY ms, yield with setTimeout(0), repeat.
// The output is recorded by an AudioWorklet at the end of the graph; onsets are found to the sample.
import { finish, fail, sleep, makeRecorder, clickOnsets, stats, encodeWav, upload, addModuleFromSource } from './common.js';
const q = new URLSearchParams(location.search);
const METHOD = q.get('method') || 'lookahead', BUSY = Number(q.get('busy') || 0), DUR = Number(q.get('dur') || 61);
const BPM = Number(q.get('bpm') || 120), SAVE = q.get('save') !== '0';
const R = { method: METHOD, busy_ms: BUSY, dur_s: DUR, bpm: BPM };
try {
  const ctx = new AudioContext({ latencyHint: 'interactive' });
  await ctx.resume();
  const sr = ctx.sampleRate, P = Math.round(sr * 60 / BPM);   // period in frames (22050 at 44.1 kHz, 120 BPM)
  R.sampleRate = sr; R.baseLatency = ctx.baseLatency; R.outputLatency = ctx.outputLatency; R.period_frames = P;
  // click: 10 ms decaying 2 kHz cosine, first sample 0.8
  const CL = Math.round(0.010 * sr), click = ctx.createBuffer(1, CL, sr), cd = click.getChannelData(0);
  for (let n = 0; n < CL; n++) cd[n] = 0.8 * Math.cos(2 * Math.PI * 2000 * n / sr) * Math.exp(-n / (0.002 * sr));
  const rec = await makeRecorder(ctx, 1, 1);
  const bus = new GainNode(ctx); bus.connect(rec.node); bus.connect(ctx.destination);
  const nClicks = Math.floor(DUR * BPM / 60);
  const t0 = Math.ceil((ctx.currentTime + 0.6) * sr) / sr;           // first click, on an exact frame
  const F0 = Math.round(t0 * sr);
  R.first_click_intended_frame = F0;
  const sched = [];   // per click: intended time (s), context time when start() was called, late flag
  let busyOn = true, busyBlocked = 0, busyTasks = 0;
  if (BUSY > 0) {
    const spin = () => { if (!busyOn) return; const t = performance.now(); while (performance.now() - t < BUSY) {} busyBlocked += performance.now() - t; busyTasks++; setTimeout(spin, 0); };
    setTimeout(spin, 0);
  }
  const playAt = (when) => { const s = new AudioBufferSourceNode(ctx, { buffer: click }); s.connect(bus); s.start(when); };
  const loopGaps = [];
  if (METHOD === 'lookahead') {
    let next = t0, i = 0, last = performance.now();
    await new Promise((done) => {
      const tick = () => {
        const now = performance.now(); loopGaps.push(now - last); last = now;
        while (i < nClicks && next < ctx.currentTime + 0.1) { const ct = ctx.currentTime; sched.push({ t: next, ctxTime: ct, late: next < ct }); playAt(next); next = t0 + (++i) * P / sr; }
        if (i < nClicks) setTimeout(tick, 25); else done();
      };
      tick();
    });
  } else if (METHOD === 'interval') {
    // wait until shortly before t0 so the first click lands near it, then setInterval(period)
    while (ctx.currentTime < t0 - 0.02) await sleep(5);
    let i = 0, last = performance.now();
    await new Promise((done) => {
      const id = setInterval(() => { const now = performance.now(); loopGaps.push(now - last); last = now;
        sched.push({ t: null, ctxTime: ctx.currentTime, perfNow: now }); playAt(0);
        if (++i >= nClicks) { clearInterval(id); done(); } }, 1000 * 60 / BPM);
    });
  } else if (METHOD === 'tone') {
    Tone.setContext(ctx);
    const tctx = Tone.getContext();
    R.tone = { version: Tone.version, lookAhead: tctx.lookAhead, updateInterval: tctx.updateInterval, clockSource: tctx.clockSource,
      rawContext_is_ours: tctx.rawContext === ctx || tctx.rawContext._nativeContext === ctx };
    const tr = Tone.getTransport(); tr.bpm.value = BPM;
    let i = 0;
    await new Promise((done) => {
      tr.scheduleRepeat((time) => {
        if (i >= nClicks) return; const ct = ctx.currentTime; sched.push({ t: time, ctxTime: ct, late: time < ct }); playAt(time);
        if (++i >= nClicks) done();
      }, '4n', 0);
      tr.start(t0);
    });
    tr.stop();
  } else if (METHOD === 'worklet') {
    await addModuleFromSource(ctx, `
      class Met extends AudioWorkletProcessor {
        constructor(o) { super(); const p = o.processorOptions; this.F0 = p.F0; this.P = p.P; this.N = p.N; this.click = p.click; }
        process(_, outputs) { const out = outputs[0][0]; const f = currentFrame;
          for (let k = 0; k < out.length; k++) { const fr = f + k; const rel = fr - this.F0;
            if (rel < 0) continue; const n = Math.floor(rel / this.P); if (n >= this.N) continue; const m = rel - n * this.P;
            if (m < this.click.length) out[k] = this.click[m]; }
          return true; } }
      registerProcessor('met', Met);`);
    const met = new AudioWorkletNode(ctx, 'met', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1],
      processorOptions: { F0, P, N: nClicks, click: cd.slice() } });
    met.connect(bus);
    for (let i = 0; i < nClicks; i++) sched.push({ t: t0 + i * P / sr });
    while (ctx.currentTime < t0 + nClicks * P / sr) await sleep(200);
  }
  // let the last click finish, then stop
  const tEnd = t0 + nClicks * P / sr + 0.3;
  while (ctx.currentTime < tEnd) await sleep(50);
  busyOn = false;
  const cap = await rec.stop();
  R.playbackStats = ctx.playbackStats ? JSON.parse(JSON.stringify(ctx.playbackStats.toJSON())) : null;
  R.busy = { blocked_ms: busyBlocked, tasks: busyTasks };
  R.loop_gap_ms = loopGaps.length ? stats(loopGaps.slice(1)) : null;
  R.capture = { firstFrame: cap.firstFrame, frames: cap.channels[0].length, seconds: cap.channels[0].length / sr, gaps: cap.gaps };
  // onsets -> context frames
  const on = clickOnsets(cap.channels[0], 0.05, Math.round(0.1 * sr)).map((i) => i + cap.firstFrame);
  R.n_clicks_expected = nClicks; R.n_onsets_detected = on.length;
  const G0 = METHOD === 'interval' ? on[0] : F0;
  R.grid = METHOD === 'interval' ? 'first detected onset + n * period' : 'intended first click frame + n * period';
  const dev = on.map((f, n) => (f - (G0 + n * P)) / sr * 1000);
  R.deviation_ms = stats(dev);
  const ioi = on.slice(1).map((f, n) => (f - on[n] - P) / sr * 1000);
  R.interval_minus_period_ms = stats(ioi);
  if (METHOD === 'interval') {   // also against a least-squares line (removes a constant rate difference)
    const n = on.length, xs = on.map((_, k) => k), mx = (n - 1) / 2, my = on.reduce((s, v) => s + v, 0) / n;
    let sxy = 0, sxx = 0; for (let k = 0; k < n; k++) { sxy += (xs[k] - mx) * (on[k] - my); sxx += (xs[k] - mx) ** 2; }
    const slope = sxy / sxx, icpt = my - slope * mx;
    R.fit = { period_frames: slope, period_ms: slope / sr * 1000 };
    R.deviation_from_fit_ms = stats(on.map((f, k) => (f - (icpt + slope * k)) / sr * 1000));
    R.ctxTime_at_callback_minus_grid_ms = stats(sched.map((s, k) => (s.ctxTime * sr - (G0 + k * P)) / sr * 1000));
  } else if (sched.length && sched[0].t !== undefined) {
    R.n_scheduled_late = sched.filter((s) => s.late).length;
    R.onset_minus_requested_time_ms = stats(on.slice(0, sched.length).map((f, k) => (f - sched[k].t * sr) / sr * 1000));
    R.schedule_margin_ms = sched[0].ctxTime !== undefined ? stats(sched.map((s) => (s.t - s.ctxTime) * 1000)) : null;
  }
  R.first_onsets_frames = on.slice(0, 5); R.dev_first10_ms = dev.slice(0, 10);
  R.dev_all_ms = dev;
  if (SAVE) R.wav = await upload('metronome', `metronome_${METHOD}_busy${BUSY}.wav`, encodeWav([cap.channels[0]], sr, { float: true }));
  await ctx.close();
  finish(R);
} catch (e) { fail(e, R); }
</script>
</body>
