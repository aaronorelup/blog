<!doctype html>
<meta charset="utf-8">
<title>small JS analysis libraries</title>
<body>
<script type="module">
// pitchy 4.1.0 (McLeod pitch method) on a melody clip: frame 2048 samples, hop 441 samples (10 ms), mono 44.1 kHz;
// writes time_s,frequency_hz,clarity.  web-audio-beat-detector 8.2.39 analyze() and guess() on beat clips.
import { finish, fail, upload, fetchArrayBuffer } from './common.js';
import { PitchDetector, analyze, guess } from '/build/small.js';
const q = new URLSearchParams(location.search);
const PITCH = (q.get('pitch') || 'S1').split(',').filter(Boolean), BEAT = (q.get('beat') || 'S3,S4,R2').split(',').filter(Boolean);
const R = { pitchy: {}, beatdetector: {} };
const load = async (id) => new OfflineAudioContext(1, 1, 44100).decodeAudioData(await fetchArrayBuffer(`/inputs/${id}/${id}.wav`));
try {
  for (const id of PITCH) {
    const b = await load(id); const x = new Float32Array(b.length);
    for (let c = 0; c < b.numberOfChannels; c++) { const d = b.getChannelData(c); for (let i = 0; i < d.length; i++) x[i] += d[i] / b.numberOfChannels; }
    const N = 2048, H = 441; const det = PitchDetector.forFloat32Array(N); const rows = [];
    const t0 = performance.now();
    for (let s = 0; s + N <= x.length; s += H) { const [f, c] = det.findPitch(x.subarray(s, s + N), b.sampleRate); rows.push([(s + N / 2) / b.sampleRate, f, c]); }
    const ms = performance.now() - t0;
    R.pitchy[id] = { ms, frames: rows.length, time_convention: 'time of the frame centre', csv: await upload('smalljs', `${id}_pitchy.csv`,
      'time_s,frequency_hz,clarity\n' + rows.map((r) => `${r[0].toFixed(6)},${r[1].toFixed(3)},${r[2].toFixed(4)}`).join('\n') + '\n') };
  }
  for (const id of BEAT) {
    const b = await load(id);
    const t0 = performance.now(); const tempo = await analyze(b); const t1 = performance.now(); const g = await guess(b); const t2 = performance.now();
    R.beatdetector[id] = { analyze_tempo: tempo, analyze_ms: t1 - t0, guess: g, guess_ms: t2 - t1, duration_s: b.duration };
    const beats = []; const per = 60 / g.bpm; for (let t = g.offset; t < b.duration; t += per) beats.push(t);
    R.beatdetector[id].beats_file = await upload('smalljs', `${id}_beatdetector_grid.txt`, beats.map((t) => t.toFixed(6)).join('\n') + '\n');
    R.beatdetector[id].bpm_file = await upload('smalljs', `${id}_beatdetector_bpm.txt`, `${g.bpm}\n`);
  }
  finish(R);
} catch (e) { fail(e, R); }
</script>
</body>
