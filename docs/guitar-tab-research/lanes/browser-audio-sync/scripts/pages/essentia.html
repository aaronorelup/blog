<!doctype html>
<meta charset="utf-8">
<title>essentia.js</title>
<body>
<script src="/nm/essentia.js/dist/essentia-wasm.web.js"></script>
<script src="/nm/essentia.js/dist/essentia.js-core.js"></script>
<script type="module">
// essentia.js 0.1.3 (Essentia compiled to WebAssembly) on one clip, mono 44.1 kHz:
//   RhythmExtractor2013 (method multifeature) -> bpm, beat ticks;  KeyExtractor (defaults) -> key, scale;
//   TonalExtractor (frameSize 4096, hopSize 2048, tuning 440) -> per-frame chords_progression (written as a .lab);
//   PitchMelodia (defaults) -> f0 track (for the melody clips).
import { finish, fail, upload, fetchArrayBuffer } from './common.js';
const q = new URLSearchParams(location.search);
const CLIP = q.get('clip') || 'S3', ALGOS = (q.get('algos') || 'rhythm,key,tonal,melodia').split(',');
const R = { clip: CLIP, algos: ALGOS };
try {
  const t0 = performance.now();
  const wasm = await EssentiaWASM();
  const essentia = new Essentia(wasm);
  R.init_ms = performance.now() - t0; R.essentia_version = essentia.version; R.algorithmNames_count = (essentia.algorithmNames || '').split(',').length;
  const ab = await fetchArrayBuffer(`/inputs/${CLIP}/${CLIP}.wav`);
  const dec = await new OfflineAudioContext(1, 1, 44100).decodeAudioData(ab);
  const mono = new Float32Array(dec.length);
  for (let c = 0; c < dec.numberOfChannels; c++) { const d = dec.getChannelData(c); for (let i = 0; i < d.length; i++) mono[i] += d[i] / dec.numberOfChannels; }
  const sig = essentia.arrayToVector(mono);
  R.input = { sampleRate: dec.sampleRate, channels: dec.numberOfChannels, seconds: dec.duration };
  if (ALGOS.includes('rhythm')) {
    const a = performance.now(); const r = essentia.RhythmExtractor2013(sig, 208, 'multifeature', 40); const ms = performance.now() - a;
    const ticks = Array.from(essentia.vectorToArray(r.ticks));
    R.rhythm = { ms, bpm: r.bpm, confidence: r.confidence, n_ticks: ticks.length, first10: ticks.slice(0, 10) };
    R.rhythm.beats_file = await upload('essentia', `${CLIP}_beats.txt`, ticks.map((t) => t.toFixed(6)).join('\n') + '\n');
    R.rhythm.bpm_file = await upload('essentia', `${CLIP}_bpm.txt`, `${r.bpm}\n`);
  }
  if (ALGOS.includes('key')) {
    const a = performance.now(); const r = essentia.KeyExtractor(sig); const ms = performance.now() - a;
    R.key = { ms, key: r.key, scale: r.scale, strength: r.strength };
    R.key.file = await upload('essentia', `${CLIP}_key.txt`, `${r.key} ${r.scale}\n`);
  }
  if (ALGOS.includes('tonal')) {
    const a = performance.now(); const r = essentia.TonalExtractor(sig, 4096, 2048, 440); const ms = performance.now() - a;
    const prog = []; const v = r.chords_progression; for (let i = 0; i < v.size(); i++) prog.push(v.get(i));
    const hop = 2048 / 44100; const segs = [];
    for (let i = 0; i < prog.length; i++) { if (!segs.length || segs[segs.length - 1].label !== prog[i]) segs.push({ start: i * hop, end: (i + 1) * hop, label: prog[i] }); else segs[segs.length - 1].end = (i + 1) * hop; }
    R.tonal = { ms, n_frames: prog.length, n_segments: segs.length, key_key: r.key_key, key_scale: r.key_scale, chords_key: r.chords_key, chords_scale: r.chords_scale,
      first_segments: segs.slice(0, 12).map((s) => [+s.start.toFixed(3), +s.end.toFixed(3), s.label]) };
    R.tonal.lab = await upload('essentia', `${CLIP}_chords.lab`, segs.map((s) => `${s.start.toFixed(6)}\t${s.end.toFixed(6)}\t${s.label}`).join('\n') + '\n');
  }
  if (ALGOS.includes('melodia')) {
    const a = performance.now(); const r = essentia.PitchMelodia(sig); const ms = performance.now() - a;
    const f0 = Array.from(essentia.vectorToArray(r.pitch)); const conf = Array.from(essentia.vectorToArray(r.pitchConfidence));
    const hop = 128 / 44100;   // PitchMelodia default hopSize 128 at 44.1 kHz
    R.melodia = { ms, n_frames: f0.length, voiced_frames: f0.filter((x) => x > 0).length, hop_s: hop };
    R.melodia.file = await upload('essentia', `${CLIP}_pitchmelodia.csv`, 'time_s,frequency_hz,confidence\n' + f0.map((x, i) => `${(i * hop).toFixed(6)},${x.toFixed(3)},${conf[i].toFixed(4)}`).join('\n') + '\n');
  }
  R.total_ms = performance.now() - t0;
  finish(R);
} catch (e) { fail(e, R); }
</script>
</body>
