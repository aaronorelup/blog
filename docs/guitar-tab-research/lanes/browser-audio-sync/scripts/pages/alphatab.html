<!doctype html>
<meta charset="utf-8">
<title>alphaTab metronome</title>
<body>
<div id="at" style="width:1200px"></div>
<script type="module">
// alphaTab 1.9.0: load a Guitar Pro 5 file, then use the audio export API (exportAudio, since 1.6.0) with the
// metronome on: once with the guitar track muted (trackVolume 0) so only the metronome sounds, once with the guitar
// and no metronome. Both renders are saved; click onsets are found to the sample and compared with the beat grid of
// the file's tempo.
import { finish, fail, encodeWav, upload, fetchArrayBuffer, clickOnsets, stats } from './common.js';
import * as alphaTab from '/nm/@coderline/alphatab/dist/alphaTab.mjs';
const q = new URLSearchParams(location.search);
const GP = q.get('gp') || '/inputs/S2n/S2n.gp5', TAG = q.get('tag') || 'S2n';
const R = { file: GP, alphaTab_npm_version: '1.9.0' };
try {
  const api = new alphaTab.AlphaTabApi(document.getElementById('at'), {
    core: { fontDirectory: '/nm/@coderline/alphatab/dist/font/', useWorkers: true },
    player: { playerMode: alphaTab.PlayerMode.EnabledSynthesizer, soundFont: '/nm/@coderline/alphatab/dist/soundfont/sonivox.sf2' },
  });
  const t0 = performance.now();
  const loaded = new Promise((r) => api.scoreLoaded.on((s) => r(s)));
  const sfLoaded = new Promise((r, j) => { api.soundFontLoaded.on(() => r()); api.soundFontLoadFailed && api.soundFontLoadFailed.on((e) => j(e)); });
  const ready = new Promise((r) => api.playerReady.on(() => r()));
  api.load(new Uint8Array(await fetchArrayBuffer(GP)));
  const score = await loaded;
  R.score = { title: score.title, tempo: score.tempo, tracks: score.tracks.map((t) => ({ name: t.name, strings: t.staves[0].tuning, capo: t.staves[0].capo })),
    masterBars: score.masterBars.length, timeSignature: `${score.masterBars[0].timeSignatureNumerator}/${score.masterBars[0].timeSignatureDenominator}` };
  await sfLoaded; await ready;
  R.load_ms = performance.now() - t0;
  const sr = 44100;
  const render = async (opts) => {
    const o = new alphaTab.synth.AudioExportOptions();
    o.sampleRate = sr; o.masterVolume = 1; o.metronomeVolume = opts.metronome; o.useSyncPoints = false;
    if (opts.muteTrack) o.trackVolume = new Map([[0, 0]]);
    const ex = await api.exportAudio(o);
    const parts = []; let total = 0; let last = null;
    const a = performance.now();
    for (;;) { const c = await ex.render(1000); if (!c) break; parts.push(c.samples); total += c.samples.length; last = { currentTime: c.currentTime, endTime: c.endTime, currentTick: c.currentTick, endTick: c.endTick }; }
    const ms = performance.now() - a;
    ex.destroy();
    const inter = new Float32Array(total); let off = 0; for (const p of parts) { inter.set(p, off); off += p.length; }
    const L = new Float32Array(total / 2), Rr = new Float32Array(total / 2);
    for (let i = 0; i < total / 2; i++) { L[i] = inter[2 * i]; Rr[i] = inter[2 * i + 1]; }
    return { L, R: Rr, ms, last };
  };
  const met = await render({ metronome: 1, muteTrack: true });
  const gtr = await render({ metronome: 0, muteTrack: false });
  R.metronome_render = { ms: met.ms, seconds: met.L.length / sr, last_chunk: met.last };
  R.guitar_render = { ms: gtr.ms, seconds: gtr.L.length / sr, last_chunk: gtr.last };
  R.metronome_wav = await upload('alphatab', `${TAG}_alphatab_metronome_only.wav`, encodeWav([met.L, met.R], sr));
  R.guitar_wav = await upload('alphatab', `${TAG}_alphatab_guitar_no_metronome.wav`, encodeWav([gtr.L, gtr.R], sr));
  // click onsets of the metronome-only render
  const mono = met.L.map((v, i) => 0.5 * (v + met.R[i]));
  let peak = 0; for (const v of mono) peak = Math.max(peak, Math.abs(v));
  const on = clickOnsets(mono, peak * 0.05, Math.round(0.15 * sr));
  const beat = 60 / score.tempo;
  R.metronome = { peak, n_onsets: on.length, first10_s: on.slice(0, 10).map((f) => +(f / sr).toFixed(6)), beat_s: beat,
    deviation_from_grid_ms: stats(on.map((f, n) => (f / sr - n * beat) * 1000)),
    interval_minus_beat_ms: stats(on.slice(1).map((f, n) => ((f - on[n]) / sr - beat) * 1000)) };
  finish(R);
} catch (e) { fail(e, R); }
</script>
</body>
