<!doctype html>
<html><head><meta charset="utf-8"><title>vexchords ESM trial</title>
<style>body{margin:0;background:#fff;font-family:sans-serif}.row{display:flex;gap:24px;padding:12px}.cell{width:180px}h4{margin:0 0 4px;font-size:13px}</style>
<script src="/web/bundles/vexchords.bundle.js"></script>
</head><body>
<div class="row"><div class="cell"><h4>vexchords (ESM): G (320003)</h4><div id="vc1"></div></div>
<div class="cell"><h4>vexchords (ESM): Bm (x24432)</h4><div id="vc2"></div></div></div>
<script type="module">
// vexchords 1.2.0 bundled from its ES module source with esbuild 0.25.12 (web/bundles/vexchords.bundle.js), because
// the package's dist/vexchords.js threw "A[e] is not a constructor" and the source's extensionless imports
// ('./chordbox') do not load in a browser without a bundler.
window.__info = {};
try {
  const { draw } = window.vexchordsESM;
  draw('#vc1', { chord: [[6, 3], [5, 2], [4, 0], [3, 0], [2, 0], [1, 3]], position: 0, barres: [] }, { width: 150, height: 180 });
  draw('#vc2', { chord: [[6, 'x'], [5, 2], [4, 4], [3, 4], [2, 3], [1, 2]], position: 0, barres: [{ fromString: 5, toString: 1, fret: 2 }] }, { width: 150, height: 180 });
  window.__info = { ok: true, svgs: document.querySelectorAll('svg').length };
} catch (e) { window.__info = { ok: false, error: String(e && e.stack || e).slice(0, 600) }; }
window.__rendered = true;
</script></body></html>
