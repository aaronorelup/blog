<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><script type="importmap">{"imports":{"three":"http://local/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const W=960,H=540;
const LOG=await (await fetch('http://local/symphony_log.json')).json();
const BAR=LOG.bar_seconds, NB=LOG.log.length, DUR=NB*BAR, BREAK=DUR*20/30;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); renderer.setSize(W,H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true; renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.fog=new THREE.Fog(0x0a0806,6,16);
const cam=new THREE.PerspectiveCamera(40,W/H,0.1,50);
// seeded rng
let seed=2000; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
// ---- room
const wallTex=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.fillStyle='#4a3b2c';g.fillRect(0,0,256,256);
  for(let x=0;x<256;x+=32){g.fillStyle='#55432f';g.fillRect(x,0,14,256);} for(let y=16;y<256;y+=64)for(let x=8;x<256;x+=32){g.fillStyle='#6b5338';g.beginPath();g.arc(x+7,y,4,0,7);g.fill();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(6,3);t.colorSpace=THREE.SRGBColorSpace;return t;})();
const wall=new THREE.Mesh(new THREE.PlaneGeometry(14,6),new THREE.MeshStandardMaterial({map:wallTex,roughness:.9})); wall.position.set(0,3,-2); wall.receiveShadow=true; scene.add(wall);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(14,10),new THREE.MeshStandardMaterial({color:0x2a1d14,roughness:.8})); floor.rotation.x=-Math.PI/2; floor.position.z=2; floor.receiveShadow=true; scene.add(floor);
// stand
const wood=new THREE.MeshStandardMaterial({color:0x3b2616,roughness:.6});
const stand=new THREE.Mesh(new THREE.BoxGeometry(2.2,.7,1),wood); stand.position.set(0,.35,-1.2); stand.castShadow=stand.receiveShadow=true; scene.add(stand);
// CRT body
const tv=new THREE.Group(); scene.add(tv); tv.position.set(0,.7,-1.2);
const body=new THREE.Mesh(new THREE.BoxGeometry(1.7,1.3,1.1),new THREE.MeshStandardMaterial({color:0x5a4632,roughness:.5,metalness:.1})); body.position.y=.65; body.castShadow=true; tv.add(body);
const bezel=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.1,.05),new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:.4})); bezel.position.set(-.08,.68,.56); tv.add(bezel);
// screen: canvas texture on a slightly curved plane
const sc=document.createElement('canvas'); sc.width=480; sc.height=360; const sg=sc.getContext('2d');
const stex=new THREE.CanvasTexture(sc); stex.colorSpace=THREE.SRGBColorSpace;
const sgeo=new THREE.PlaneGeometry(1.16,.87,24,18); {const p=sgeo.attributes.position; for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i); p.setZ(i,.06-.12*(x*x+y*y));}}
const screenMat=new THREE.MeshBasicMaterial({map:stex,toneMapped:false}); const screen=new THREE.Mesh(sgeo,screenMat); screen.position.set(-.14,.7,.58); tv.add(screen);
for(const dx of [.62,.62]){} const knobM=new THREE.MeshStandardMaterial({color:0xb8a27a,metalness:.6,roughness:.3});
[[.66,.95],[.66,.7]].forEach(([x,y])=>{const k=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.05,20),knobM);k.rotation.x=Math.PI/2;k.position.set(x,y,.58);tv.add(k);});
// screen light
const screenLight=new THREE.PointLight(0x9fc7ff,3,6,1.6); screenLight.position.set(-.1,1.4,0); scene.add(screenLight);
// lamp
const lamp=new THREE.PointLight(0xffb36b,6,9,1.5); lamp.position.set(-2.6,2.2,-.6); lamp.castShadow=true; scene.add(lamp);
const shade=new THREE.Mesh(new THREE.ConeGeometry(.35,.4,24,1,true),new THREE.MeshStandardMaterial({color:0xe8c79a,emissive:0x8a5a2a,side:THREE.DoubleSide})); shade.position.copy(lamp.position).add(new THREE.Vector3(0,.15,0)); scene.add(shade);
const pole=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,2.2),wood); pole.position.set(-2.6,1.1,-.6); scene.add(pole);
scene.add(new THREE.AmbientLight(0x221a14,.6));
// wall clock (programme clock: 30:00 compressed into the film)
const clock=new THREE.Group(); clock.position.set(1.9,3.1,-1.97); scene.add(clock);
clock.add(new THREE.Mesh(new THREE.CircleGeometry(.42,40),new THREE.MeshStandardMaterial({color:0xefe6d2,roughness:.7})));
const rim=new THREE.Mesh(new THREE.TorusGeometry(.43,.035,10,40),new THREE.MeshStandardMaterial({color:0x2b1d12})); clock.add(rim);
for(let i=0;i<12;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.02,.07,.01),new THREE.MeshBasicMaterial({color:0x222222}));const a=i/12*Math.PI*2;m.position.set(Math.sin(a)*.34,Math.cos(a)*.34,.01);m.rotation.z=-a;clock.add(m);}
const hand=(len,w,c)=>{const g=new THREE.Group();const m=new THREE.Mesh(new THREE.BoxGeometry(w,len,.01),new THREE.MeshBasicMaterial({color:c}));m.position.y=len/2;g.add(m);g.position.z=.02;clock.add(g);return g;};
const minH=hand(.32,.025,0x1a1a1a), secH=hand(.36,.01,0xaa1111);
// ---- the programme on screen, driven by the symphony's real training log
const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
function logAt(t){const i=Math.min(NB-1,Math.floor(t/BAR)); return LOG.log[i];}
function drawScreen(t){
  const L=logAt(t), purity=L.energy_on_right_notes, noise=Math.min(1,Math.abs(L.noise_amp));
  const broke=t>BREAK, horror=broke?Math.min(1,Math.max(0,Math.log10(Math.max(L.loss,1e-8))+3)/6):0; // driven by the real loss after 20:00
  const g=sg; const w=sc.width,h=sc.height;
  // painted landscape that sharpens as the orchestra learns
  const sky=g.createLinearGradient(0,0,0,h); sky.addColorStop(0,horror>.3?'#2a0505':'#f7c9a0'); sky.addColorStop(1,horror>.3?'#000':'#9cc6d9'); g.fillStyle=sky; g.fillRect(0,0,w,h);
  // sun (becomes an eye when it breaks)
  const un=t>BREAK?Math.min(1,L.lr_over_crit/2.4):0; const sx=w*.7, sy=h*.33; g.fillStyle=horror>.3?'#e8e2d0':'#ffe9a8'; g.beginPath(); g.ellipse(sx,sy,34,34*(1+.35*un),0,0,7); g.fill();
  if(horror>.3){ g.fillStyle='#300'; g.beginPath(); g.ellipse(sx+Math.sin(t*1.7)*6,sy,9,22*Math.min(1,horror*1.2),0,0,7); g.fill(); }
  // hills: amplitude of brush jitter falls with purity
  const jit=(1-purity)*40;
  [['#6f9b6a',.62],['#4f7d55',.72],['#355f40',.84]].forEach(([c,y0],k)=>{
    g.fillStyle=horror>.3?['#3a0d0d','#250707','#120303'][k]:c; g.beginPath(); g.moveTo(0,h);
    for(let x=0;x<=w;x+=8){ const base=h*y0+Math.sin(x*.012+k*2)*18*(1-.3*k); const j=(rnd()-.5)*jit; const drip=horror>.4?Math.max(0,Math.sin(x*.21+k)*horror*60):0; g.lineTo(x,base+j+drip); }
    g.lineTo(w,h); g.fill(); });
  // a note per melody slot, lit up by how well the orchestra currently plays it
  const K=16, slot=(t%BAR)/BAR*K|0;
  for(let k=0;k<K;k++){ g.fillStyle=k===slot?`rgba(255,255,255,${.4+.6*purity})`:`rgba(255,255,255,${.12+.2*purity})`; g.fillRect(24+k*27, h-30, 16, 8); }
  // title card in the first 4 s
  if(t<4){ g.fillStyle=`rgba(20,16,12,${1-smooth(3,4,t)})`; g.fillRect(0,0,w,h); g.fillStyle=`rgba(247,234,210,${1-smooth(3,4,t)})`; g.font='bold 30px Georgia'; g.textAlign='center'; g.fillText('THE QUIET HOUR',w/2,h/2-6); g.font='16px Georgia'; g.fillText('an orchestra learns a tune',w/2,h/2+22); }
  // static grain = the orchestra's learned noise voice
  const img=g.getImageData(0,0,w,h), d=img.data, amt=noise*90+horror*140;
  for(let i=0;i<d.length;i+=4){ const n=(rnd()-.5)*amt; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
  // scanlines + horror tearing
  for(let y=0;y<h;y+=2){ for(let x=0;x<w;x++){ const i=(y*w+x)*4; d[i]*=.82; d[i+1]*=.82; d[i+2]*=.82; } }
  g.putImageData(img,0,0);
  if(horror>.05){ for(let s=0;s<Math.floor(horror*14);s++){ const y=rnd()*h|0, hh=4+rnd()*20|0, dx=(rnd()-.5)*80*horror; g.drawImage(sc,0,y,w,hh,dx,y,w,hh);} }
  if(horror>.6){ g.fillStyle=`rgba(255,255,255,${(horror-.6)*1.5*(Math.sin(t*9)>.6?1:0)})`; g.font='bold 22px monospace'; g.textAlign='center'; g.fillText('loss = '+L.loss.toExponential(1),w/2,40); }
  stex.needsUpdate=true; return {purity,horror};
}
window.renderFrame=(t)=>{
  seed=2000+Math.floor(t*24);
  const {purity,horror}=drawScreen(t);
  // camera: slow push-in all programme; after 20:00 a slight drift down and roll
  const p=t/DUR, unease=t>BREAK?Math.min(1,logAt(t).lr_over_crit/2.4):0; cam.position.set(Math.sin(p*1.2)*.4*(1-p), 1.7-.35*p-horror*.2, 5.4-3.3*p*p*(3-2*p)); cam.lookAt(-.1,1.35-horror*.1,-1.2); cam.rotation.z+=horror*.04*Math.sin(t*.7);
  // lamp warmth fades and flickers once the training diverges
  lamp.intensity=6*(1-horror*.85)*(horror>.2&&rnd()<.25?0.2:1); lamp.color.setHSL(.08-.05*unease-.03*horror,.8,.6);
  screenLight.intensity=2.5+purity*1.5+horror*3; screenLight.color.setHSL(horror>.3?0:.58,.6,.65);
  // programme clock: minute hand = programme minutes (full turn = 60 min), second hand spins; after 20:00 it runs backward
  const progMin=30*t/DUR; minH.rotation.z=-progMin/60*Math.PI*2; secH.rotation.z=(t>BREAK?1:-1)*(progMin%1)*Math.PI*2*(t>BREAK?3:1);
  renderer.render(scene,cam); return renderer.domElement.toDataURL('image/jpeg',.9);
};
window.FILM={DUR,BREAK}; window.READY=true;
</script></body></html>
